const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const VER=[["v1","我的 v1"],["cx","Codex 改寫"]];
const tone=s=>!s?'':/還沒畫|失敗/.test(s)?'bad':/成功 4\/4|^成功/.test(s)?'ok':'mid';
let list=[],k=-1;
function th(key,n,cap){list.push({key,n,cap});const i=list.length-1;
  return `<img loading="lazy" tabindex="0" alt="${esc(cap)} 第 ${n} 張" src="th/${key}_${n}.jpg" data-i="${i}">`}
function ver(it,v,name){const key=v+'_'+it.id,x=it.v[v],cap=it.id+' '+it.label+'｜'+name;
  const imgs=x.n?`<div class="row4">${[1,2,3,4].slice(0,x.n).map(n=>th(key,n,cap)).join('')}</div>`:'<div class="empty">還沒畫</div>';
  return `<div class="vb"><p class="vh"><b>${name}</b>　<span class="${tone(x.judge)}">${esc(x.judge||'—')}</span></p>${imgs}
  <details class="pr"><summary>prompt（原文，送進 Flow 的就是這段）</summary><pre>${esc(D.P[key])}</pre></details></div>`}
function group(g){list=[];const [id,name,term]=D.G.find(x=>x[0]===g);
  return `<h2>${id} ${esc(name)}<small style="font:400 13px var(--sans);color:var(--mut)">　${esc(term)}</small></h2>
  <div class="note">${esc(D.S[g]||'還沒寫結論')}</div>`+
  D.I[g].map(it=>`<div class="lv"><div><b>${esc(it.label)}</b><small>${it.id}</small><p class="sub" style="font-size:13px">參考圖：${it.refs.map(esc).join('、')}</p></div>
  <div class="vr">${VER.map(([v,n])=>ver(it,v,n)).join('')}</div></div>`).join('')}
function overview(){list=[];
  let rows='';for(const [g,name] of D.G)for(const it of D.I[g])
    rows+=`<tr><td class="n">${it.id}</td><td>${esc(it.label)}</td>${VER.map(([v])=>`<td class="${tone(it.v[v].judge)}">${esc(it.v[v].judge||'—')}</td>`).join('')}</tr>`;
  return `<h2>一覽</h2><p class="sub">第一階段（單獨測）${D.total} 份 prompt，已畫 ${D.done} 份。點上方分頁看圖。</p>
  <div class="tbl"><table><tr><th>編號</th><th>項目</th><th>我的 v1</th><th>Codex 改寫</th></tr>${rows}</table></div>`}
function todo(){list=[];
  return `<h2>還沒測的</h2><p class="sub">第一階段 ${D.total} 份 prompt 已畫 ${D.done} 份，剩 ${D.total-D.done} 份；第二階段組合 ${D.T.filter(t=>/第二階段/.test(t[2])).length} 組還沒開始。</p>
  <div class="tbl"><table><tr><th>編號</th><th>項目</th><th>狀態</th></tr>${D.T.map(t=>`<tr><td class="n">${t[0]}</td><td>${esc(t[1])}</td><td>${esc(t[2])}</td></tr>`).join('')}</table></div>`}
const TABS=[["all","一覽"],...D.G.map(g=>[g[0],g[0]+' '+g[1]]),["todo","還沒測"]];
document.getElementById('nav').innerHTML=TABS.map(([h,n])=>`<a href="#${h}" data-v="${h}">${esc(n)}</a>`).join('');
const lb=document.getElementById('lb'),big=lb.querySelector('img'),cap=lb.querySelector('.cap'),pre=lb.querySelector('pre'),bp=document.getElementById('bp');
function show(i){k=(i+list.length)%list.length;const it=list[k];big.src='th/'+it.key+'_'+it.n+'.jpg';
  cap.textContent=it.cap+'　第 '+it.n+' 張';pre.textContent=D.P[it.key]||'';lb.hidden=false}
function close(){lb.hidden=true}
big.onclick=close;document.getElementById('bx').onclick=close;
document.getElementById('bl').onclick=()=>show(k-1);document.getElementById('bn').onclick=()=>show(k+1);
bp.onclick=()=>{pre.hidden=!pre.hidden;bp.textContent=pre.hidden?'顯示 prompt':'隱藏 prompt'};
document.addEventListener('keydown',e=>{if(lb.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowRight')show(k+1);if(e.key==='ArrowLeft')show(k-1)});
function route(){const h=location.hash.slice(1),v=TABS.some(t=>t[0]===h)?h:'all';
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));close();
  const m=document.getElementById('main');m.innerHTML=v==='all'?overview():v==='todo'?todo():group(v);
  m.querySelectorAll('img[data-i]').forEach(im=>{im.onclick=()=>show(+im.dataset.i);im.onkeydown=e=>{if(e.key==='Enter')show(+im.dataset.i)}})}
addEventListener('hashchange',route);route();

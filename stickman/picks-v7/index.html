<style>
:root{--bg:#eef0ee;--panel:#fff;--fg:#1d2420;--mut:#66706a;--line:#d5dad6;--acc:#1f6b52}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--panel:#1d2320;--fg:#e6ebe8;--mut:#93a09a;--line:#2f3833;--acc:#6cc7a3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141816;--panel:#1d2320;--fg:#e6ebe8;--mut:#93a09a;--line:#2f3833;--acc:#6cc7a3;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

<div style="font-size:14px;margin-bottom:12px"><a href="../story/">← 劇情</a>　<a href="../storyboard-v7/">分鏡表 v7</a></div>
<h1>EP1 選定的圖</h1>
<p class="sub">你在分鏡表 v7 每格選定要留下的那一張，照劇情順序排在一起，底下是那格的旁白（順稿第二版）。目前選了 16 格；其他幕選好後陸續補上。</p>
<h2>第 1 幕</h2>
<div class="grid">
<figure><img src="img/EP1-01-01_3.png?v=1794662135" alt="EP1-01-01 第 3 張" loading="lazy"><figcaption><b>01-01</b><span class="n">第 3 張</span><p>你正在跑，腳下全是爛泥巴。而兩旁的樹，比大樓還要高。</p></figcaption></figure>
<figure><img src="img/EP1-01-02_3.png?v=1794662135" alt="EP1-01-02 第 3 張" loading="lazy"><figcaption><b>01-02</b><span class="n">第 3 張</span><p>而你這輩子，從來沒跑得這麼快過。</p></figcaption></figure>
<figure><img src="img/EP1-01-03W_1.png?v=1794662135" alt="EP1-01-03W 第 1 張" loading="lazy"><figcaption><b>01-03W</b><span class="n">第 1 張</span><p>可是後面那個東西，跑得比你還快。</p></figcaption></figure>
<figure><img src="img/EP1-01-04W_1.png?v=1794662135" alt="EP1-01-04W 第 1 張" loading="lazy"><figcaption><b>01-04W</b><span class="n">第 1 張</span><p>牠光是一張嘴，就比你整個人還大。</p></figcaption></figure>
<figure><img src="img/EP1-01-05_2.png?v=1794662135" alt="EP1-01-05 第 2 張" loading="lazy"><figcaption><b>01-05</b><span class="n">第 2 張</span><p>而且啊，牠還越追越近。</p></figcaption></figure>
<figure><img src="img/EP1-01-06_3.png?v=1794662135" alt="EP1-01-06 第 3 張" loading="lazy"><figcaption><b>01-06</b><span class="n">第 3 張</span><p>這時候你一定很想問：我到底是怎麼跑到這裡來的？別急，這件事要從今天早上說起。</p></figcaption></figure>
</div>
<h2>第 2 幕</h2>
<div class="grid">
<figure><img src="img/EP1-02-01_4.png?v=1794662136" alt="EP1-02-01 第 4 張" loading="lazy"><figcaption><b>02-01</b><span class="n">第 4 張</span><p>話說，你的書桌上，擺著三樣東西。</p></figcaption></figure>
<figure><img src="img/EP1-02-02_1.png?v=1794662136" alt="EP1-02-02 第 1 張" loading="lazy"><figcaption><b>02-02</b><span class="n">第 1 張</span><p>第一樣，是帳單。電費、房租、學貸，而且每一張都蓋著紅紅的逾期章。</p></figcaption></figure>
<figure><img src="img/EP1-02-03_1.png?v=1794662136" alt="EP1-02-03 第 1 張" loading="lazy"><figcaption><b>02-03</b><span class="n">第 1 張</span><p>第二樣，是畢業學分不足的通知。沒錯，你已經延畢兩年了。</p></figcaption></figure>
<figure><img src="img/EP1-02-04_1.png?v=1794662136" alt="EP1-02-04 第 1 張" loading="lazy"><figcaption><b>02-04</b><span class="n">第 1 張</span><p>而現在最關心你的人，是系辦的助理。</p></figcaption></figure>
<figure><img src="img/EP1-02-05_1.png?v=1794662136" alt="EP1-02-05 第 1 張" loading="lazy"><figcaption><b>02-05</b><span class="n">第 1 張</span><p>第三樣呢，是一支手機，跟一把電擊槍。那把電擊槍，是上次打工的時候博士給你的。</p></figcaption></figure>
<figure><img src="img/EP1-02-06_3.png?v=1794662136" alt="EP1-02-06 第 3 張" loading="lazy"><figcaption><b>02-06</b><span class="n">第 3 張</span><p>偏偏房間裡，只有一個插座。所以你當然是拿來充手機啦。</p></figcaption></figure>
<figure><img src="img/EP1-02-07_4.png?v=1794662136" alt="EP1-02-07 第 4 張" loading="lazy"><figcaption><b>02-07</b><span class="n">第 4 張</span><p>就在這時候，手機亮了。是博士傳來的訊息：又有工作囉，時薪很不錯，記得帶電擊槍。</p></figcaption></figure>
<figure><img src="img/EP1-02-08_2.png?v=1794662136" alt="EP1-02-08 第 2 張" loading="lazy"><figcaption><b>02-08</b><span class="n">第 2 張</span><p>其實啊，這已經不是你第一次幫博士打工了。而上一次，他也說會付錢。</p></figcaption></figure>
<figure><img src="img/EP1-02-09_3.png?v=1794662136" alt="EP1-02-09 第 3 張" loading="lazy"><figcaption><b>02-09</b><span class="n">第 3 張</span><p>你看了看桌上那一疊帳單。</p></figcaption></figure>
<figure><img src="img/EP1-02-10_2.png?v=1794662136" alt="EP1-02-10 第 2 張" loading="lazy"><figcaption><b>02-10</b><span class="n">第 2 張</span><p>唉，還是去吧。</p></figcaption></figure>
</div>
</main></body></html>

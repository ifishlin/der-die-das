<h1>EP1 定稿畫面</h1>
<p class="sub">你在分鏡表 v7 每格選定要留下的那一張，照劇情順序排在一起，底下是那格的旁白（順稿第二版）。目前選了 115 格；斜線空白的 34 格是實驗室改 10 × 9 公尺後整格重畫、要補挑的。</p>
<h2>第 1 幕</h2>
<div class="grid">
<figure><img src="img/EP1-01-01_3.png?v=1794902620" alt="EP1-01-01 第 3 張" loading="lazy"><figcaption><b>01-01</b><span class="n">第 3 張</span><p>你正在跑，腳下全是爛泥巴。而兩旁的樹，比大樓還要高。</p><ul class="sfx"><li><span class="sfp o">選擇</span>高聳森林環境音<small>　0.0 秒起～01-06 7.4 秒・音量墊底</small></li><li><span class="sfp o">選擇</span>泥地奔跑腳步聲<small>　0.0 秒起～01-06 0.1 秒・音量小</small></li><li><span class="sfp o">選擇</span>慌張喘氣聲（無台詞）<small>　0.3 秒起～01-05 2.7 秒・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-01-02_3.png?v=1794902620" alt="EP1-01-02 第 3 張" loading="lazy"><figcaption><b>01-02</b><span class="n">第 3 張</span><p>而你這輩子，從來沒跑得這麼快過。</p></figcaption></figure>
<figure><img src="img/EP1-01-03W_1.png?v=1794902620" alt="EP1-01-03W 第 1 張" loading="lazy"><figcaption><b>01-03W</b><span class="n">第 1 張</span><p>可是後面那個東西，跑得比你還快。</p><ul class="sfx"><li><span class="sfp m">必要</span>大型恐龍沉重踏步聲<small>　0.0 秒起～01-05 2.7 秒・音量小・Freesound「Big Monster Stomp」</small><audio controls preload="none" src="audio/fs_812538.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-01-04W_1.png?v=1794902620" alt="EP1-01-04W 第 1 張" loading="lazy"><figcaption><b>01-04W</b><span class="n">第 1 張</span><p>牠光是一張嘴，就比你整個人還大。</p><ul class="sfx"><li><span class="sfp m">必要</span>恐懼尖叫（無台詞）<small>　3.2 秒起～01-05 0.1 秒・音量大・Freesound「Panic-stricken screaming #1」</small><audio controls preload="none" src="audio/fs_547961.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-01-05_2.png?v=1794902620" alt="EP1-01-05 第 2 張" loading="lazy"><figcaption><b>01-05</b><span class="n">第 2 張</span><p>而且啊，牠還越追越近。</p><ul class="sfx"><li><span class="sfp o">選擇</span>恐龍低吼／咆哮<small>　2.3 秒起～01-06 0.1 秒・音量大</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-01-06_3.png?v=1794902620" alt="EP1-01-06 第 3 張" loading="lazy"><figcaption><b>01-06</b><span class="n">第 3 張</span><p>這時候你一定很想問：我到底是怎麼跑到這裡來的？別急，這件事要從今天早上說起。</p><ul class="sfx"><li><span class="sfp m">必要</span>巨顎咬合落空聲<small>　0.0 秒起・音量大・TangoFlux 生成</small><audio controls preload="none" src="audio/gen_EP1-01_jaw_snap.mp3"></audio></li><li><span class="sfp m">必要</span>定格轉場衝擊音<small>　0.1 秒起・音量大・Freesound「Whoosh to HIT 2.wav」</small><audio controls preload="none" src="audio/fs_434873.mp3"></audio></li></ul></figcaption></figure>
</div>
<h2>第 2 幕</h2>
<div class="grid">
<figure><img src="img/EP1-02-01_4.png?v=1794902620" alt="EP1-02-01 第 4 張" loading="lazy"><figcaption><b>02-01</b><span class="n">第 4 張</span><p>話說，你的書桌上，擺著三樣東西。</p><ul class="sfx"><li><span class="sfp o">選擇</span>安靜窮房間的室內環境音（遠處微弱車聲／室內空氣感）<small>　0.0 秒起～02-10 2.7 秒・音量墊底</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-02-02_1.png?v=1794902620" alt="EP1-02-02 第 1 張" loading="lazy"><figcaption><b>02-02</b><span class="n">第 1 張</span><p>第一樣，是帳單。電費、房租、學貸，而且每一張都蓋著紅紅的逾期章。</p></figcaption></figure>
<figure><img src="img/EP1-02-03_1.png?v=1794902620" alt="EP1-02-03 第 1 張" loading="lazy"><figcaption><b>02-03</b><span class="n">第 1 張</span><p>第二樣，是畢業學分不足的通知。沒錯，你已經延畢兩年了。</p></figcaption></figure>
<figure><img src="img/EP1-02-04_1.png?v=1794902620" alt="EP1-02-04 第 1 張" loading="lazy"><figcaption><b>02-04</b><span class="n">第 1 張</span><p>而現在最關心你的人，是系辦的助理。</p></figcaption></figure>
<figure><img src="img/EP1-02-05_1.png?v=1794902620" alt="EP1-02-05 第 1 張" loading="lazy"><figcaption><b>02-05</b><span class="n">第 1 張</span><p>第三樣呢，是一支手機，跟一把電擊槍。那把電擊槍，是上次打工的時候博士給你的。</p></figcaption></figure>
<figure><img src="img/EP1-02-06_3.png?v=1794902620" alt="EP1-02-06 第 3 張" loading="lazy"><figcaption><b>02-06</b><span class="n">第 3 張</span><p>偏偏房間裡，只有一個插座。所以你當然是拿來充手機啦。</p></figcaption></figure>
<figure><img src="img/EP1-02-07_4.png?v=1794902620" alt="EP1-02-07 第 4 張" loading="lazy"><figcaption><b>02-07</b><span class="n">第 4 張</span><p>就在這時候，手機亮了。是博士傳來的訊息：又有工作囉，時薪很不錯，記得帶電擊槍。</p><ul class="sfx"><li><span class="sfp m">必要</span>手機在桌上震動＋訊息通知提示音<small>　0.0 秒起・音量中・Freesound「cell phone vibrate wood table_loopable.wav」</small><audio controls preload="none" src="audio/fs_384485.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-02-08_2.png?v=1794902620" alt="EP1-02-08 第 2 張" loading="lazy"><figcaption><b>02-08</b><span class="n">第 2 張</span><p>其實啊，這已經不是你第一次幫博士打工了。而上一次，他也說會付錢。</p></figcaption></figure>
<figure><img src="img/EP1-02-09_3.png?v=1794902620" alt="EP1-02-09 第 3 張" loading="lazy"><figcaption><b>02-09</b><span class="n">第 3 張</span><p>你看了看桌上那一疊帳單。</p></figcaption></figure>
<figure><img src="img/EP1-02-10_2.png?v=1794902620" alt="EP1-02-10 第 2 張" loading="lazy"><figcaption><b>02-10</b><span class="n">第 2 張</span><p>唉，還是去吧。</p><ul class="sfx"><li><span class="sfp o">選擇</span>椅子被推開、人起身的聲音<small>　1.8 秒起・音量小</small></li><li><span class="sfp o">選擇</span>走向門口的室內腳步聲<small>　2.0 秒起・音量小</small></li><li><span class="sfp m">必要</span>轉場咻聲（接到下一幕的場景跳轉）<small>　2.3 秒起・音量中・Freesound「Whoosh stereo light (transition)」</small><audio controls preload="none" src="audio/fs_701104.mp3"></audio></li></ul></figcaption></figure>
</div>
<h2>第 3 幕</h2>
<div class="grid">
<figure><img src="img/EP1-03-01_4.png?v=1794902620" alt="EP1-03-01 第 4 張" loading="lazy"><figcaption><b>03-01</b><span class="n">第 4 張</span><p>博士的實驗室，就在學校裡。</p><ul class="sfx"><li><span class="sfp o">選擇</span>校園戶外環境音（鳥叫、微風、遠處人聲）<small>　0.0 秒起～03-03 11.6 秒・音量墊底</small></li><li><span class="sfp o">選擇</span>步道行走腳步聲（平穩走路）<small>　0.0 秒起～03-03 0.9 秒・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-03-02_3.png?v=1794902620" alt="EP1-03-02 第 3 張" loading="lazy"><figcaption><b>03-02</b><span class="n">第 3 張</span><p>就在校務大樓旁邊，一間老舊的木頭小屋。</p></figcaption></figure>
<figure><img src="img/EP1-03-03_2.png?v=1794902620" alt="EP1-03-03 第 2 張" loading="lazy"><figcaption><b>03-03</b><span class="n">第 2 張</span><p>門上那些警告標誌，你一個都不想知道是什麼意思。</p><ul class="sfx"><li><span class="sfp m">必要</span>緊張的遲疑聲（吞口水、倒抽一口氣、「嗯…」的猶豫鼻音，無台詞）<small>　3.9 秒起・音量中・Freesound「Nervous Male Gulp.wav」</small><audio controls preload="none" src="audio/fs_150442.mp3"></audio></li></ul></figcaption></figure>
</div>
<h2>第 4 幕</h2>
<div class="grid">
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-01</b><span class="n">要重畫、還沒選</span><p>博士說，這一次要去白堊紀，六千六百五十萬年前的北美洲喔。他講得超級興奮。</p><ul class="sfx"><li><span class="sfp o">選擇</span>實驗室低頻機器嗡嗡聲<small>　0.0 秒起～04-23 4.8 秒・音量墊底</small></li></ul></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-01b</b><span class="n">要重畫、還沒選</span><p>為什麼是地獄溪？因為全世界大部分的暴龍化石，都是在那裡挖到的。要找暴龍，去那裡準沒錯。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-02</b><span class="n">要重畫、還沒選</span><p>可是你一直低頭滑手機，連頭都沒抬一下。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-03</b><span class="n">要重畫、還沒選</span><p>你只問了他一個問題：為什麼不去侏羅紀呢？畢竟那部電影，你都看了五遍耶。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-04</b><span class="n">要重畫、還沒選</span><p>這下博士可不高興了，他說：侏羅紀根本就沒有暴龍啦。你最愛的那部恐龍電影，光是片名就在騙你。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-05</b><span class="n">要重畫、還沒選</span><p>於是博士在黑板上，畫了一條長長的時間線。侏羅紀是從兩億年前，到一億四千五百萬年前，劍龍就住在這一段。再來才是白堊紀，一直到六千六百萬年前，而暴龍，排在最後面。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-06</b><span class="n">要重畫、還沒選</span><p>接著，博士開始上課。第一課：越大隻的，跑得越慢。他一手拿著大恐龍，一手拿著小恐龍，大的這隻，身高是小的兩倍。可是牠的腿能撐住的力氣只多四倍，體重卻足足重了八倍。腿撐不住，當然就跑不快啦。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-07</b><span class="n">要重畫、還沒選</span><p>而你，在滑手機。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-08</b><span class="n">要重畫、還沒選</span><p>第二課：跑最快的，不是最大隻，也不是最小隻。而是不大不小、剛剛好的，大概九十公斤。只要超過兩千七百公斤，就會被自己的體重拖慢。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-09</b><span class="n">要重畫、還沒選</span><p>你打了一個大哈欠。</p><ul class="sfx"><li><span class="sfp o">選擇</span>男生打大哈欠（不含字句）<small>　2.0 秒起・音量小</small></li></ul></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-10</b><span class="n">要重畫、還沒選</span><p>博士拿出碼表，叫你跑一趟給他看。一般人跑步時速大概二十四公里，奧運選手可以到四十四公里。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-11</b><span class="n">要重畫、還沒選</span><p>結果你一邊滑手機，一邊慢慢走完，博士的碼表根本沒按下去。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-12</b><span class="n">要重畫、還沒選</span><p>第三課：跑得越快，就越難轉彎。你看獵豹追羚羊，三次裡面，羚羊能逃掉兩次呢。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-13</b><span class="n">要重畫、還沒選</span><p>博士自己示範急轉彎，結果差點閃到腰。</p><ul class="sfx"><li><span class="sfp m">必要</span>閃到腰的痛苦悶哼哀號（不含字句）<small>　3.0 秒起・音量中・Freesound「ManGroaning」</small><audio controls preload="none" src="audio/fs_786286.mp3"></audio></li></ul></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-14</b><span class="n">要重畫、還沒選</span><p>你抬起頭看了一眼，然後又低頭繼續滑。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-15</b><span class="n">要重畫、還沒選</span><p>出發前，博士推過來三樣東西：一台相機、一個樣本袋，還有一個用膠帶纏得亂七八糟的按鈕。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-16</b><span class="n">要重畫、還沒選</span><p>他問你：電擊槍有帶嗎？你拍拍口袋：有啦。</p></figcaption></figure>
<figure><img src="img/EP1-04-17_2.png?v=1794902620" alt="EP1-04-17 第 2 張" loading="lazy"><figcaption><b>04-17</b><span class="n">第 2 張</span><p>這東西上面只有一顆按鈕，按下去，就能回家。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-18</b><span class="n">要重畫、還沒選</span><p>博士還說：沒拍到暴龍、沒帶回牙齒，就不付錢喔。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-19</b><span class="n">要重畫、還沒選</span><p>博士還給了你一本生存指南，又厚又重。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-20</b><span class="n">要重畫、還沒選</span><p>你看看指南，再看看旁邊那包洋芋片，最後你選了洋芋片。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-21</b><span class="n">要重畫、還沒選</span><p>然後把它跟按鈕一起，塞進背包裡。</p></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>04-22</b><span class="n">要重畫、還沒選</span><p>博士說，等你準備好，他再拉下拉桿。結果他直接就拉了。</p><ul class="sfx"><li><span class="sfp o">選擇</span>大型金屬拉桿被拉下的喀拉聲<small>　5.6 秒起・音量中</small></li></ul></figcaption></figure>

<div class="grid">

<figure><img src="img/EP1-06-02_3.png?v=1794902621" alt="EP1-06-02 第 3 張" loading="lazy"><figcaption><b>06-02</b><span class="n">第 3 張</span><p>這裡又熱又濕，因為那時候的地球比現在熱多了，連南北極都沒有冰呢。而第一個跑來歡迎你的，是蚊子。都過了六千六百五十萬年，蚊子還是一模一樣。</p><ul class="sfx"><li><span class="sfp m">必要</span>在頭頂繞飛的單隻蚊子嗡嗡聲<small>　6.5 秒起～12.6 秒・音量小・Freesound「Single Mosquito Buzz」</small><audio controls preload="none" src="audio/fs_435650.mp3"></audio></li></ul></figcaption></figure>

<figure><img src="img/EP1-06-04_4.png?v=1794902621" alt="EP1-06-04 第 4 張" loading="lazy"><figcaption><b>06-04</b><span class="n">第 4 張</span><p>原來是沒有訊號。對啊，六千六百五十萬年前，哪來的基地台。</p></figcaption></figure>
<figure><img src="img/EP1-06-05_2.png?v=1794902621" alt="EP1-06-05 第 2 張" loading="lazy"><figcaption><b>06-05</b><span class="n">第 2 張</span><p>你想找片草地坐下來休息，可是這個時代，草還沒長成草原呢。放眼望去都是蕨類，高到你的腰。</p><ul class="sfx"><li><span class="sfp o">選擇</span>撥開及腰蕨葉前進的葉片摩擦聲<small>　0.5 秒起～7.0 秒・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-06-06W_2.png?v=1794902621" alt="EP1-06-06W 第 2 張" loading="lazy"><figcaption><b>06-06W</b><span class="n">第 2 張</span><p>還好旁邊剛好有一顆長滿青苔的大石頭，又平又涼，大小剛剛好。今天第一次，你覺得這份工作還不錯嘛。</p></figcaption></figure>
<figure><img src="img/EP1-06-07_1.png?v=1794902621" alt="EP1-06-07 第 1 張" loading="lazy"><figcaption><b>06-07</b><span class="n">第 1 張</span><p>然後，那顆石頭，眨了一下眼睛。</p><ul class="sfx"><li><span class="sfp m">必要</span>原以為是石頭的恐龍慢慢睜開一隻眼的濕潤眼皮聲<small>　2.6 秒起・音量中・Freesound「Squish 5」</small><audio controls preload="none" src="audio/fs_578806.mp3"></audio></li></ul></figcaption></figure>

<figure><img src="img/EP1-06-09_3.png?v=1794902621" alt="EP1-06-09 第 3 張" loading="lazy"><figcaption><b>06-09</b><span class="n">第 3 張</span><p>你踮著腳尖，偷偷溜走。</p></figcaption></figure>

<figure><img src="img/EP1-07-10_3.png?v=1794902621" alt="EP1-07-10 第 3 張" loading="lazy"><figcaption><b>07-10</b><span class="n">第 3 張</span><p>你突然想起，手機裡存了一篇文章：〈遇到暴龍的三個求生秘訣〉。而且還是離線存的喔，你覺得自己好聰明。</p></figcaption></figure>

<figure><img src="img/EP1-07-12_3.png?v=1794902621" alt="EP1-07-12 第 3 張" loading="lazy"><figcaption><b>07-12</b><span class="n">第 3 張</span><p>蕨類擋得住牠的眼睛，卻擋不住牠的鼻子。因為暴龍的鼻子，比狗還要靈。</p><ul class="sfx"><li><span class="sfp o">選擇</span>暴龍嗅聞空氣（鼻孔張合）<small>　4.0 秒起・音量小・Freesound「Monster Snort.wav」</small><audio controls preload="none" src="audio/fs_369591.mp3"></audio></li></ul></figcaption></figure>

<figure class="todo"><div class="blank">待補挑</div><figcaption><b>07-16</b><span class="n">要重畫、還沒選</span><p>至於那本生存指南，第一頁只寫了兩個字：快跑。可惜它現在躺在實驗室的桌上，旁邊，就是你的水壺。</p><ul class="sfx"><li><span class="sfp o">選擇</span>切到實驗室桌面的轉場咻聲<small>　0.0 秒起・音量小</small></li></ul></figcaption></figure>

<figure><img src="img/EP1-07-18W_2.png?v=1794902621" alt="EP1-07-18W 第 2 張" loading="lazy"><figcaption><b>07-18W</b><span class="n">第 2 張</span><p>博士明明講過的，可是那時候，你在滑手機。越大隻的，跑得越慢，所以牠這一口，咬了個空。</p><ul class="sfx"><li><span class="sfp m">必要</span>暴龍大嘴咬合（咬空）<small>　7.4 秒起・音量大・TangoFlux 生成</small><audio controls preload="none" src="audio/gen_EP1-07_trex_bite_snap.mp3"></audio></li></ul></figcaption></figure>

<div class="grid">
<figure><img src="img/EP1-08-01_3.png?v=1794902621" alt="EP1-08-01 第 3 張" loading="lazy"><figcaption><b>08-01</b><span class="n">第 3 張</span><p>牠追上來了，地面每震動一下，你就覺得自己死定了。</p><ul class="sfx"><li><span class="sfp o">選擇</span>森林／河邊戶外環境音<small>　0.0 秒起～08-07 6.1 秒・音量墊底</small></li><li><span class="sfp m">必要</span>暴龍追擊時的快速沉重踏步、地面震動<small>　0.0 秒起～5.0 秒・音量小・Freesound「Big Monster Stomp」</small><audio controls preload="none" src="audio/fs_812538.mp3"></audio></li><li><span class="sfp m">必要</span>HERO 全力衝刺時的驚叫（無台詞）<small>　0.0 秒起～0.7 秒・音量中・Freesound「Panic-stricken screaming #2」</small><audio controls preload="none" src="audio/fs_547964.mp3"></audio></li><li><span class="sfp o">選擇</span>HERO 奔跑腳步聲<small>　0.0 秒起～08-04 5.5 秒・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-08-02W_3.png?v=1794902622" alt="EP1-08-02W 第 3 張" loading="lazy"><figcaption><b>08-02W</b><span class="n">第 3 張</span><p>可是追著追著，牠的速度慢了下來。七噸重的身體，根本跑不起來，腿只要一跑，骨頭就撐不住。</p><ul class="sfx"><li><span class="sfp o">選擇</span>暴龍吃力的緩慢重步（跑不動、骨頭撐著）<small>　0.0 秒起～7.4 秒・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-08-03_3.png?v=1794902622" alt="EP1-08-03 第 3 張" loading="lazy"><figcaption><b>08-03</b><span class="n">第 3 張</span><p>牠最快，大概只有時速十九公里。這個速度啊，叫做快走。</p><ul class="sfx"><li><span class="sfp o">選擇</span>暴龍張口大口喘氣<small>　0.0 秒起～6.5 秒・音量小・Freesound「heavy_breathing_beast」</small><audio controls preload="none" src="audio/fs_844096.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-08-04_4.png?v=1794902622" alt="EP1-08-04 第 4 張" loading="lazy"><figcaption><b>08-04</b><span class="n">第 4 張</span><p>你一邊跑，一邊回頭舉起相機。手一直在抖，但你還是按下了快門。</p><ul class="sfx"><li><span class="sfp m">必要</span>相機按下快門聲<small>　5.5 秒起・音量中・Freesound「Pentax K1000 Camera Shutter.wav」</small><audio controls preload="none" src="audio/fs_579883.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-08-05_4.png?v=1794902622" alt="EP1-08-05 第 4 張" loading="lazy"><figcaption><b>08-05</b><span class="n">第 4 張</span><p>照片有點糊，但看得出來是暴龍。任務，總算完成一半啦。</p></figcaption></figure>
<figure><img src="img/EP1-08-06W_2.png?v=1794902622" alt="EP1-08-06W 第 2 張" loading="lazy"><figcaption><b>08-06W</b><span class="n">第 2 張</span><p>你站上倒下來的樹幹，跟牠揮手說再見。</p></figcaption></figure>
<figure><img src="img/EP1-08-07_1.png?v=1794902622" alt="EP1-08-07 第 1 張" loading="lazy"><figcaption><b>08-07</b><span class="n">第 1 張</span><p>牠站在遠遠的地方，喘著氣看你，那個眼神，好像還有點受傷呢。</p><ul class="sfx"><li><span class="sfp m">必要</span>暴龍張口大口喘氣<small>　0.0 秒起～6.1 秒・音量中・Freesound「heavy_breathing_beast」</small><audio controls preload="none" src="audio/fs_844096.mp3"></audio></li></ul></figcaption></figure>
</div>
<h2>第 9 幕</h2>
<div class="grid">
<figure><img src="img/EP1-09-01_3.png?v=1794902622" alt="EP1-09-01 第 3 張" loading="lazy"><figcaption><b>09-01</b><span class="n">第 3 張</span><p>逃過一劫的你，沿著河往下游走，還吹起了口哨。照片已經到手，現在只差一顆牙齒了。暴龍那麼多，總會有一隻掉牙吧。</p><ul class="sfx"><li><span class="sfp o">選擇</span>淺河流水環境音<small>　0.0 秒起～09-08 3.4 秒・音量墊底</small></li><li><span class="sfp o">選擇</span>涉淺水行走腳步聲<small>　0.3 秒起～09-02 7.9 秒・音量小</small></li><li><span class="sfp o">選擇</span>人悠閒吹口哨（哼調子，非說話）<small>　0.0 秒起～09-02 7.9 秒・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-09-02_3.png?v=1794902622" alt="EP1-09-02 第 3 張" loading="lazy"><figcaption><b>09-02</b><span class="n">第 3 張</span><p>而且你還跑贏了暴龍耶，你是史上第一個跑贏暴龍的大學生。也是史上第一個，延畢兩年的。</p></figcaption></figure>
<figure><img src="img/EP1-09-03_3.png?v=1794902622" alt="EP1-09-03 第 3 張" loading="lazy"><figcaption><b>09-03</b><span class="n">第 3 張</span><p>你開心地自拍了一張。</p><ul class="sfx"><li><span class="sfp m">必要</span>手機拍照快門聲<small>　1.9 秒起・音量中・Freesound「iPhone Camera Capture.wav」</small><audio controls preload="none" src="audio/fs_431588.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-09-04_4.png?v=1794902622" alt="EP1-09-04 第 4 張" loading="lazy"><figcaption><b>09-04</b><span class="n">第 4 張</span><p>這張照片，應該可以放進履歷了吧。</p></figcaption></figure>
<figure><img src="img/EP1-09-05_2.png?v=1794902622" alt="EP1-09-05 第 2 張" loading="lazy"><figcaption><b>09-05</b><span class="n">第 2 張</span><p>結果突然間，你的笑容僵住了。</p><ul class="sfx"><li><span class="sfp o">選擇</span>倒抽一口氣／屏息（非說話）<small>　2.7 秒起・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-09-06_4.png?v=1794902622" alt="EP1-09-06 第 4 張" loading="lazy"><figcaption><b>09-06</b><span class="n">第 4 張</span><p>你想起來，博士還講過一件事，只是那時候，你在打哈欠。跑最快的，不是最大隻的，而是剛剛好的。</p></figcaption></figure>
<figure><img src="img/EP1-09-07_3.png?v=1794902622" alt="EP1-09-07 第 3 張" loading="lazy"><figcaption><b>09-07</b><span class="n">第 3 張</span><p>就在這時，你背後的蕨類，動了一下。</p><ul class="sfx"><li><span class="sfp m">必要</span>蕨類／矮叢被擾動的沙沙聲<small>　3.0 秒起・音量中・Freesound「bushmovement.wav」</small><audio controls preload="none" src="audio/fs_106114.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-09-08_3.png?v=1794902622" alt="EP1-09-08 第 3 張" loading="lazy"><figcaption><b>09-08</b><span class="n">第 3 張</span><p>可是，今天根本沒有風啊。</p><ul class="sfx"><li><span class="sfp o">選擇</span>低沉懸念過場聲（接下一幕盜龍出現）<small>　2.6 秒起～3.4 秒・音量中</small></li></ul></figcaption></figure>
</div>
<h2>第 10 幕</h2>
<div class="grid">
<figure><img src="img/EP1-10-01_3.png?v=1794902622" alt="EP1-10-01 第 3 張" loading="lazy"><figcaption><b>10-01</b><span class="n">第 3 張</span><p>第一隻，是盜龍。牠比你還高，全身都是羽毛，腳上還有一根像彎刀一樣的爪子。</p><ul class="sfx"><li><span class="sfp o">選擇</span>森林環境音（蟲鳴鳥叫）<small>　0.0 秒起～10-16 2.5 秒・音量墊底</small></li><li><span class="sfp o">選擇</span>盜龍低吼<small>　0.0 秒起・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-10-02_2.png?v=1794902622" alt="EP1-10-02 第 2 張" loading="lazy"><figcaption><b>10-02</b><span class="n">第 2 張</span><p>牠時速大概二十四到三十二公里，跟你跑得差不多快。</p></figcaption></figure>
<figure><img src="img/EP1-10-03_1.png?v=1794902622" alt="EP1-10-03 第 1 張" loading="lazy"><figcaption><b>10-03</b><span class="n">第 1 張</span><p>這時你想起來，身上還有電擊槍嘛。你把它掏出來，按下開關。</p></figcaption></figure>
<figure><img src="img/EP1-10-04_3.png?v=1794902622" alt="EP1-10-04 第 3 張" loading="lazy"><figcaption><b>10-04</b><span class="n">第 3 張</span><p>喀。電量，零。</p><ul class="sfx"><li><span class="sfp m">必要</span>電擊槍沒電的空喀聲<small>　0.1 秒起・音量中・Freesound「Flashlight Click On」</small><audio controls preload="none" src="audio/fs_830459.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-10-05_2.png?v=1794902622" alt="EP1-10-05 第 2 張" loading="lazy"><figcaption><b>10-05</b><span class="n">第 2 張</span><p>因為昨天晚上，你拿插座去充手機了，手機電量，百分之百。可惜，手機沒有訊號。</p></figcaption></figure>
<figure><img src="img/EP1-10-06_1.png?v=1794902623" alt="EP1-10-06 第 1 張" loading="lazy"><figcaption><b>10-06</b><span class="n">第 1 張</span><p>你乾脆把電擊槍丟了出去，剛好打中牠的頭。</p><ul class="sfx"><li><span class="sfp o">選擇</span>電擊槍被丟出去的揮空聲<small>　2.8 秒起・音量小</small></li><li><span class="sfp m">必要</span>電擊槍砸中恐龍頭的悶響<small>　3.6 秒起・音量中・Freesound「thump_thud_slam_fist_heavy.wav」</small><audio controls preload="none" src="audio/fs_529396.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-10-07_1.png?v=1794902623" alt="EP1-10-07 第 1 張" loading="lazy"><figcaption><b>10-07</b><span class="n">第 1 張</span><p>牠歪著頭看你，好像在問：就這樣喔？</p><ul class="sfx"><li><span class="sfp o">選擇</span>盜龍疑惑的短鳴<small>　2.0 秒起・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-10-08_3.png?v=1794902623" alt="EP1-10-08 第 3 張" loading="lazy"><figcaption><b>10-08</b><span class="n">第 3 張</span><p>你轉身就跑，跳過一根倒在地上的樹幹。你跳過去了，牠沒有。</p></figcaption></figure>
<figure><img src="img/EP1-10-09_4.png?v=1794902623" alt="EP1-10-09 第 4 張" loading="lazy"><figcaption><b>10-09</b><span class="n">第 4 張</span><p>第二隻，是腫頭龍。牠的頭頂上，有一塊又圓又厚的骨頭，活像是戴了一頂安全帽出門。</p></figcaption></figure>
<figure><img src="img/EP1-10-10_2.png?v=1794902623" alt="EP1-10-10 第 2 張" loading="lazy"><figcaption><b>10-10</b><span class="n">第 2 張</span><p>牠低著頭，直直朝你衝過來，你往旁邊一閃。</p><ul class="sfx"><li><span class="sfp o">選擇</span>腫頭龍低頭衝刺的沉重腳步<small>　0.5 秒起～3.8 秒・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-10-11_2.png?v=1794902623" alt="EP1-10-11 第 2 張" loading="lazy"><figcaption><b>10-11</b><span class="n">第 2 張</span><p>結果牠撞上的，是你後面那根大樹幹。</p><ul class="sfx"><li><span class="sfp m">必要</span>腫頭龍一頭撞上大樹幹的重擊<small>　0.0 秒起・音量大・Freesound「Collision」</small><audio controls preload="none" src="audio/fs_812593.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-10-12_2.png?v=1794902623" alt="EP1-10-12 第 2 張" loading="lazy"><figcaption><b>10-12</b><span class="n">第 2 張</span><p>第三隻，是似鴕龍，長得像一隻沒有翅膀的大鴕鳥，腿又細又長。</p></figcaption></figure>
<figure><img src="img/EP1-10-13_2.png?v=1794902623" alt="EP1-10-13 第 2 張" loading="lazy"><figcaption><b>10-13</b><span class="n">第 2 張</span><p>牠衝到你身邊，一口叼走了你的帽子。看起來，牠好像只想要那頂帽子。</p><ul class="sfx"><li><span class="sfp o">選擇</span>似鴕龍一口叼走帽子的快速咬合<small>　2.8 秒起・音量中</small></li><li><span class="sfp o">選擇</span>HERO 受驚倒抽一口氣<small>　3.4 秒起・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-10-14_3.png?v=1794902623" alt="EP1-10-14 第 3 張" loading="lazy"><figcaption><b>10-14</b><span class="n">第 3 張</span><p>沒多久，牠們又追上來，把你團團圍在中間。</p></figcaption></figure>
<figure><img src="img/EP1-10-15_1.png?v=1794902623" alt="EP1-10-15 第 1 張" loading="lazy"><figcaption><b>10-15</b><span class="n">第 1 張</span><p>然後，牠們突然全部跑掉了，還往三個不同的方向跑。</p></figcaption></figure>
<figure><img src="img/EP1-10-16_2.png?v=1794902623" alt="EP1-10-16 第 2 張" loading="lazy"><figcaption><b>10-16</b><span class="n">第 2 張</span><p>而且，不是因為你。蟲不叫了，鳥也不叫了，剛剛那三隻，連頭都沒回。你突然懂了：牠們不是在追你，而是在逃命。</p></figcaption></figure>
<figure><img src="img/EP1-10-17_1.png?v=1794902623" alt="EP1-10-17 第 1 張" loading="lazy"><figcaption><b>10-17</b><span class="n">第 1 張</span><p>黑影裡面，有一雙發亮的黃眼睛，那是一隻十四歲的青少年暴龍。牠還沒長胖，大概九百公斤，時速卻可以跑到五十三公里。成年暴龍吃的是三角龍，可是青少年暴龍，最愛吃跟你差不多大的東西。</p><ul class="sfx"><li><span class="sfp m">必要</span>暴龍走出黑影的沉重踏步<small>　0.0 秒起・音量中・Freesound「Big Monster Stomp」</small><audio controls preload="none" src="audio/fs_812538.mp3"></audio></li><li><span class="sfp o">選擇</span>暴龍低沉的喉音咆哮（墊底）<small>　0.4 秒起～15.5 秒・音量墊底</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-10-18_2.png?v=1794902623" alt="EP1-10-18 第 2 張" loading="lazy"><figcaption><b>10-18</b><span class="n">第 2 張</span><p>你跟牠，對上了眼。這一次，不用博士教你，你直接拔腿就跑。</p><ul class="sfx"><li><span class="sfp o">選擇</span>HERO 拔腿狂奔的腳步<small>　4.6 秒起・音量小</small></li><li><span class="sfp m">必要</span>暴龍咆哮（追逐高潮）<small>　5.1 秒起・音量大・Freesound「Dino Hiss Dragon Roar」</small><audio controls preload="none" src="audio/fs_320345.mp3"></audio></li></ul></figcaption></figure>
</div>
<h2>第 11 幕</h2>
<div class="grid">
<figure><img src="img/EP1-11-01_4.png?v=1794902623" alt="EP1-11-01 第 4 張" loading="lazy"><figcaption><b>11-01</b><span class="n">第 4 張</span><p>你正在跑，腳下全是爛泥巴，兩旁的樹，比大樓還要高。</p><ul class="sfx"><li><span class="sfp o">選擇</span>巨木森林環境音<small>　0.0 秒起～11-05 6.2 秒・音量墊底</small></li><li><span class="sfp o">選擇</span>HERO 泥地奔跑腳步聲<small>　0.0 秒起～11-05 6.2 秒・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-11-02_3.png?v=1794902623" alt="EP1-11-02 第 3 張" loading="lazy"><figcaption><b>11-02</b><span class="n">第 3 張</span><p>你這輩子，從來沒跑得這麼快過，可是後面那個東西，跑得比你還快。</p><ul class="sfx"><li><span class="sfp m">必要</span>TEEN 沉重踏步奔跑聲<small>　0.0 秒起～11-05 6.2 秒・音量小・Freesound「Big Monster Stomp」</small><audio controls preload="none" src="audio/fs_812538.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-11-03_4.png?v=1794902623" alt="EP1-11-03 第 4 張" loading="lazy"><figcaption><b>11-03</b><span class="n">第 4 張</span><p>牠光是一張嘴，就比你整個人還大，而且越追越近了。現在，你終於知道自己為什麼會在這裡了吧。</p></figcaption></figure>
<figure><img src="img/EP1-11-04_2.png?v=1794902623" alt="EP1-11-04 第 2 張" loading="lazy"><figcaption><b>11-04</b><span class="n">第 2 張</span><p>你一落地，就繼續跑。</p><ul class="sfx"><li><span class="sfp o">選擇</span>HERO 躍過樹根落地<small>　2.0 秒起・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-11-05W_3.png?v=1794902623" alt="EP1-11-05W 第 3 張" loading="lazy"><figcaption><b>11-05W</b><span class="n">第 3 張</span><p>你聽得到牠在後面喘氣，那個味道，聞起來像很久沒刷牙。</p><ul class="sfx"><li><span class="sfp m">必要</span>TEEN 粗重喘氣聲<small>　0.0 秒起～6.2 秒・音量小・Freesound「heavy_breathing_beast」</small><audio controls preload="none" src="audio/fs_844096.mp3"></audio></li><li><span class="sfp m">必要</span>HERO 被口臭薰到的嫌惡悶哼<small>　5.8 秒起・音量中・Freesound「ugh (male)」</small><audio controls preload="none" src="audio/fs_189565.mp3"></audio></li></ul></figcaption></figure>
<figure class="todo"><div class="blank">待補挑</div><figcaption><b>11-06</b><span class="n">要重畫、還沒選</span><p>博士講過的話，這一次，你好像有聽進去一點點：跑得越快，就越難轉彎。</p><ul class="sfx"><li><span class="sfp m">必要</span>閃回轉場音<small>　0.0 秒起～0.9 秒・音量中・Freesound「Flashback Sound.wav」</small><audio controls preload="none" src="audio/fs_541546.mp3"></audio></li><li><span class="sfp o">選擇</span>實驗室機器低鳴室內音<small>　0.0 秒起～5.6 秒・音量墊底</small></li><li><span class="sfp o">選擇</span>閃回轉場音<small>　5.3 秒起～11-07 0.3 秒・音量小・Freesound「Flashback Sound.wav」</small><audio controls preload="none" src="audio/fs_541546.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-11-07_4.png?v=1794902623" alt="EP1-11-07 第 4 張" loading="lazy"><figcaption><b>11-07</b><span class="n">第 4 張</span><p>於是你突然急轉彎，牠就衝過頭了。</p><ul class="sfx"><li><span class="sfp o">選擇</span>巨木森林環境音<small>　0.0 秒起～11-08 5.4 秒・音量墊底</small></li><li><span class="sfp o">選擇</span>HERO 泥地奔跑腳步聲<small>　0.0 秒起～11-08 5.4 秒・音量小</small></li><li><span class="sfp o">選擇</span>TEEN 沉重踏步奔跑聲<small>　0.0 秒起～11-08 5.4 秒・音量小・Freesound「Big Monster Stomp」</small><audio controls preload="none" src="audio/fs_812538.mp3"></audio></li><li><span class="sfp o">選擇</span>TEEN 煞不住打滑衝過頭<small>　3.4 秒起・音量小</small></li></ul></figcaption></figure>

<h2>第 12 幕</h2>
<div class="grid">
<figure><img src="img/EP1-12-01_3.png?v=1794902623" alt="EP1-12-01 第 3 張" loading="lazy"><figcaption><b>12-01</b><span class="n">第 3 張</span><p>可是你真的沒力了，只想找個地方躲起來。</p><ul class="sfx"><li><span class="sfp o">選擇</span>黃昏空地環境音（微風、遠處蟲鳴）<small>　0.0 秒起～12-15 5.3 秒・音量墊底</small></li><li><span class="sfp o">選擇</span>筋疲力竭的拖步聲<small>　0.0 秒起～3.6 秒・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-12-02_1.png?v=1794902623" alt="EP1-12-02 第 1 張" loading="lazy"><figcaption><b>12-02</b><span class="n">第 1 張</span><p>你整個人滾到一顆大石頭後面，縮成一團，能躲多小，就躲多小。</p><ul class="sfx"><li><span class="sfp o">選擇</span>身體滾到地上的翻滾聲<small>　0.3 秒起・音量小</small></li><li><span class="sfp o">選擇</span>HERO 發抖的喘氣（無台詞）<small>　1.2 秒起～5.2 秒・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-12-03_2.png?v=1794902623" alt="EP1-12-03 第 2 張" loading="lazy"><figcaption><b>12-03</b><span class="n">第 2 張</span><p>牠來不及煞車，一頭直直撞上那顆石頭。</p><ul class="sfx"><li><span class="sfp o">選擇</span>青少年暴龍全速衝刺的沉重踏步<small>　0.0 秒起～3.4 秒・音量小</small></li><li><span class="sfp m">必要</span>暴龍一頭直直撞上石頭的重擊<small>　3.4 秒起・音量大・Freesound「Collision」</small><audio controls preload="none" src="audio/fs_812593.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-12-04_1.png?v=1794902624" alt="EP1-12-04 第 1 張" loading="lazy"><figcaption><b>12-04</b><span class="n">第 1 張</span><p>結果那顆石頭，眨了一下眼睛——甲龍被吵醒了。</p><ul class="sfx"><li><span class="sfp o">選擇</span>甲龍被吵醒的低沉咕噥（動物發聲）<small>　2.6 秒起・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-12-05_3.png?v=1794902624" alt="EP1-12-05 第 3 張" loading="lazy"><figcaption><b>12-05</b><span class="n">第 3 張</span><p>牠一尾錘揮過去，把青少年暴龍整隻打飛。</p><ul class="sfx"><li><span class="sfp m">必要</span>甲龍尾錘揮出並命中的重擊<small>　3.9 秒起・音量大・TangoFlux 生成</small><audio controls preload="none" src="audio/gen_EP1-12_tail_club_hit.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-12-06_2.png?v=1794902624" alt="EP1-12-06 第 2 張" loading="lazy"><figcaption><b>12-06</b><span class="n">第 2 張</span><p>你早就不記得那顆石頭了，但是石頭，還記得你喔。</p><ul class="sfx"><li><span class="sfp o">選擇</span>HERO 驚訝的倒抽一口氣（無台詞）<small>　4.9 秒起・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-12-07_1.png?v=1794902624" alt="EP1-12-07 第 1 張" loading="lazy"><figcaption><b>12-07</b><span class="n">第 1 張</span><p>這時有個東西，彈到你的腳邊，是一顆牙齒，比香蕉還要大。放心，不是你的。</p><ul class="sfx"><li><span class="sfp o">選擇</span>巨大牙齒彈落在泥地上的聲音<small>　0.0 秒起・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-12-08_3.png?v=1794902624" alt="EP1-12-08 第 3 張" loading="lazy"><figcaption><b>12-08</b><span class="n">第 3 張</span><p>牙齒有了，照片也有了，任務總算完成啦。結果你一開心，相機就掉進泥巴裡了。</p><ul class="sfx"><li><span class="sfp o">選擇</span>HERO 開心的歡呼（無台詞）<small>　2.8 秒起～5.0 秒・音量小</small></li><li><span class="sfp m">必要</span>相機掉進泥巴裡的濕黏聲<small>　6.5 秒起・音量中・Freesound「squish 1.mp3」</small><audio controls preload="none" src="audio/fs_578792.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-12-09_2.png?v=1794902624" alt="EP1-12-09 第 2 張" loading="lazy"><figcaption><b>12-09</b><span class="n">第 2 張</span><p>你想起來，背包裡還有一樣東西，那是你一路上都捨不得吃的。於是你把洋芋片遞給甲龍：謝謝你啊，石頭。</p><ul class="sfx"><li><span class="sfp o">選擇</span>洋芋片袋的塑膠窸窣聲<small>　1.5 秒起～4.5 秒・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-12-10_2.png?v=1794902624" alt="EP1-12-10 第 2 張" loading="lazy"><figcaption><b>12-10</b><span class="n">第 2 張</span><p>牠吃了一口。這可是六千六百五十萬年來，地球上的第一包洋芋片呢。</p><ul class="sfx"><li><span class="sfp o">選擇</span>甲龍咬下洋芋片的清脆咬合聲<small>　0.9 秒起・音量中</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-12-11_2.png?v=1794902624" alt="EP1-12-11 第 2 張" loading="lazy"><figcaption><b>12-11</b><span class="n">第 2 張</span><p>好了，該回家了。你從背包裡翻出那顆按鈕，按了下去。沒反應。再按一次，還是沒反應。</p><ul class="sfx"><li><span class="sfp o">選擇</span>按鈕被按下的塑膠喀聲<small>　2.5 秒起・音量小</small></li><li><span class="sfp o">選擇</span>按鈕被按下的塑膠喀聲<small>　4.0 秒起・音量小</small></li></ul></figcaption></figure>
<figure><img src="img/EP1-12-12_4.png?v=1794902624" alt="EP1-12-12 第 4 張" loading="lazy"><figcaption><b>12-12</b><span class="n">第 4 張</span><p>這時候，你想起博士修東西的那一招，往膠帶上用力拍了一下。</p><ul class="sfx"><li><span class="sfp m">必要</span>用力拍在膠帶按鈕上的巴掌聲<small>　5.0 秒起・音量大・Freesound「hand_on_table」</small><audio controls preload="none" src="audio/fs_787456.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-12-13_1.png?v=1794902624" alt="EP1-12-13 第 1 張" loading="lazy"><figcaption><b>12-13</b><span class="n">第 1 張</span><p>按鈕亮了，隧道也打開了。果然，博士做的東西，都要拍一下才會動。</p><ul class="sfx"><li><span class="sfp o">選擇</span>按鈕亮起、裝置啟動的電子聲<small>　0.0 秒起・音量中</small></li><li><span class="sfp m">必要</span>藍色時光隧道打開的能量聲<small>　0.3 秒起～5.0 秒・音量中・Freesound「Sci-fi Time Portal」</small><audio controls preload="none" src="audio/fs_798213.mp3"></audio></li></ul></figcaption></figure>
<figure><img src="img/EP1-12-14_3.png?v=1794902624" alt="EP1-12-14 第 3 張" loading="lazy"><figcaption><b>12-14</b><span class="n">第 3 張</span><p>然後，隧道關了起來。</p><ul class="sfx"><li><span class="sfp m">必要</span>藍色隧道縮小關閉的能量收束聲<small>　2.0 秒起・音量大・Freesound「Portal_Despawn」</small><audio controls preload="none" src="audio/fs_720109.mp3"></audio></li></ul></figcaption></figure>

<h1>EP1 選定的圖</h1>
<p class="sub">你在分鏡表 v7 每格選定要留下的那一張，照劇情順序排在一起，底下是那格的旁白（順稿第二版）。目前選了 6 格；其他幕選好後陸續補上。</p>
<h2>第 1 幕</h2>
<div class="grid">
<figure><img src="img/EP1-01-01_3.png?v=1794661985" alt="EP1-01-01 第 3 張" loading="lazy"><figcaption><b>01-01</b><span class="n">第 3 張</span><p>你正在跑，腳下全是爛泥巴。而兩旁的樹，比大樓還要高。</p></figcaption></figure>
<figure><img src="img/EP1-01-02_3.png?v=1794661985" alt="EP1-01-02 第 3 張" loading="lazy"><figcaption><b>01-02</b><span class="n">第 3 張</span><p>而你這輩子，從來沒跑得這麼快過。</p></figcaption></figure>
<figure><img src="img/EP1-01-03W_1.png?v=1794661985" alt="EP1-01-03W 第 1 張" loading="lazy"><figcaption><b>01-03W</b><span class="n">第 1 張</span><p>可是後面那個東西，跑得比你還快。</p></figcaption></figure>
<figure><img src="img/EP1-01-04W_1.png?v=1794661985" alt="EP1-01-04W 第 1 張" loading="lazy"><figcaption><b>01-04W</b><span class="n">第 1 張</span><p>牠光是一張嘴，就比你整個人還大。</p></figcaption></figure>
<figure><img src="img/EP1-01-05_2.png?v=1794661985" alt="EP1-01-05 第 2 張" loading="lazy"><figcaption><b>01-05</b><span class="n">第 2 張</span><p>而且啊，牠還越追越近。</p></figcaption></figure>
<figure><img src="img/EP1-01-06_3.png?v=1794661985" alt="EP1-01-06 第 3 張" loading="lazy"><figcaption><b>01-06</b><span class="n">第 3 張</span><p>這時候你一定很想問：我到底是怎麼跑到這裡來的？別急，這件事要從今天早上說起。</p></figcaption></figure>

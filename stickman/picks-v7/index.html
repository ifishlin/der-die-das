<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--panel:#1d2320;--fg:#e6ebe8;--mut:#93a09a;--line:#2f3833;--acc:#6cc7a3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141816;--panel:#1d2320;--fg:#e6ebe8;--mut:#93a09a;--line:#2f3833;--acc:#6cc7a3;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1400px;margin:0 auto}h1{font-size:24px;margin:0 0 4px}a{color:var(--acc)}

<div style="font-size:14px;margin-bottom:12px"><a href="../story/">← 劇情</a>　<a href="../storyboard-v7/">分鏡表 v7</a></div>
<h1>EP1 選定的圖</h1>
<p class="sub">你在分鏡表 v7 每格選定要留下的那一張，照劇情順序排在一起，底下是那格的旁白（順稿第二版）。目前選了 42 格；其他幕選好後陸續補上。</p>
<h2>第 1 幕</h2>
<div class="grid">
<figure><img src="img/EP1-01-01_3.png?v=1794662486" alt="EP1-01-01 第 3 張" loading="lazy"><figcaption><b>01-01</b><span class="n">第 3 張</span><p>你正在跑，腳下全是爛泥巴。而兩旁的樹，比大樓還要高。</p></figcaption></figure>
<figure><img src="img/EP1-01-02_3.png?v=1794662486" alt="EP1-01-02 第 3 張" loading="lazy"><figcaption><b>01-02</b><span class="n">第 3 張</span><p>而你這輩子，從來沒跑得這麼快過。</p></figcaption></figure>
<figure><img src="img/EP1-01-03W_1.png?v=1794662486" alt="EP1-01-03W 第 1 張" loading="lazy"><figcaption><b>01-03W</b><span class="n">第 1 張</span><p>可是後面那個東西，跑得比你還快。</p></figcaption></figure>
<figure><img src="img/EP1-01-04W_1.png?v=1794662486" alt="EP1-01-04W 第 1 張" loading="lazy"><figcaption><b>01-04W</b><span class="n">第 1 張</span><p>牠光是一張嘴，就比你整個人還大。</p></figcaption></figure>
<figure><img src="img/EP1-01-05_2.png?v=1794662486" alt="EP1-01-05 第 2 張" loading="lazy"><figcaption><b>01-05</b><span class="n">第 2 張</span><p>而且啊，牠還越追越近。</p></figcaption></figure>
<figure><img src="img/EP1-01-06_3.png?v=1794662486" alt="EP1-01-06 第 3 張" loading="lazy"><figcaption><b>01-06</b><span class="n">第 3 張</span><p>這時候你一定很想問：我到底是怎麼跑到這裡來的？別急，這件事要從今天早上說起。</p></figcaption></figure>
</div>
<h2>第 2 幕</h2>
<div class="grid">
<figure><img src="img/EP1-02-01_4.png?v=1794662486" alt="EP1-02-01 第 4 張" loading="lazy"><figcaption><b>02-01</b><span class="n">第 4 張</span><p>話說，你的書桌上，擺著三樣東西。</p></figcaption></figure>
<figure><img src="img/EP1-02-02_1.png?v=1794662486" alt="EP1-02-02 第 1 張" loading="lazy"><figcaption><b>02-02</b><span class="n">第 1 張</span><p>第一樣，是帳單。電費、房租、學貸，而且每一張都蓋著紅紅的逾期章。</p></figcaption></figure>
<figure><img src="img/EP1-02-03_1.png?v=1794662486" alt="EP1-02-03 第 1 張" loading="lazy"><figcaption><b>02-03</b><span class="n">第 1 張</span><p>第二樣，是畢業學分不足的通知。沒錯，你已經延畢兩年了。</p></figcaption></figure>
<figure><img src="img/EP1-02-04_1.png?v=1794662486" alt="EP1-02-04 第 1 張" loading="lazy"><figcaption><b>02-04</b><span class="n">第 1 張</span><p>而現在最關心你的人，是系辦的助理。</p></figcaption></figure>
<figure><img src="img/EP1-02-05_1.png?v=1794662486" alt="EP1-02-05 第 1 張" loading="lazy"><figcaption><b>02-05</b><span class="n">第 1 張</span><p>第三樣呢，是一支手機，跟一把電擊槍。那把電擊槍，是上次打工的時候博士給你的。</p></figcaption></figure>
<figure><img src="img/EP1-02-06_3.png?v=1794662486" alt="EP1-02-06 第 3 張" loading="lazy"><figcaption><b>02-06</b><span class="n">第 3 張</span><p>偏偏房間裡，只有一個插座。所以你當然是拿來充手機啦。</p></figcaption></figure>
<figure><img src="img/EP1-02-07_4.png?v=1794662486" alt="EP1-02-07 第 4 張" loading="lazy"><figcaption><b>02-07</b><span class="n">第 4 張</span><p>就在這時候，手機亮了。是博士傳來的訊息：又有工作囉，時薪很不錯，記得帶電擊槍。</p></figcaption></figure>
<figure><img src="img/EP1-02-08_2.png?v=1794662486" alt="EP1-02-08 第 2 張" loading="lazy"><figcaption><b>02-08</b><span class="n">第 2 張</span><p>其實啊，這已經不是你第一次幫博士打工了。而上一次，他也說會付錢。</p></figcaption></figure>
<figure><img src="img/EP1-02-09_3.png?v=1794662486" alt="EP1-02-09 第 3 張" loading="lazy"><figcaption><b>02-09</b><span class="n">第 3 張</span><p>你看了看桌上那一疊帳單。</p></figcaption></figure>
<figure><img src="img/EP1-02-10_2.png?v=1794662486" alt="EP1-02-10 第 2 張" loading="lazy"><figcaption><b>02-10</b><span class="n">第 2 張</span><p>唉，還是去吧。</p></figcaption></figure>
</div>
<h2>第 3 幕</h2>
<div class="grid">
<figure><img src="img/EP1-03-01_4.png?v=1794662486" alt="EP1-03-01 第 4 張" loading="lazy"><figcaption><b>03-01</b><span class="n">第 4 張</span><p>博士的實驗室，就在學校裡。</p></figcaption></figure>
<figure><img src="img/EP1-03-02_3.png?v=1794662486" alt="EP1-03-02 第 3 張" loading="lazy"><figcaption><b>03-02</b><span class="n">第 3 張</span><p>就在校務大樓旁邊，一間老舊的木頭小屋。</p></figcaption></figure>
<figure><img src="img/EP1-03-03_2.png?v=1794662486" alt="EP1-03-03 第 2 張" loading="lazy"><figcaption><b>03-03</b><span class="n">第 2 張</span><p>門上那些警告標誌，你一個都不想知道是什麼意思。</p></figcaption></figure>
</div>
<h2>第 4 幕</h2>
<div class="grid">
<figure><img src="img/EP1-04-01_1.png?v=1794662486" alt="EP1-04-01 第 1 張" loading="lazy"><figcaption><b>04-01</b><span class="n">第 1 張</span><p>博士說，這一次要去白堊紀，六千六百五十萬年前的北美洲喔。他講得超級興奮。</p></figcaption></figure>
<figure><img src="img/EP1-04-02_3.png?v=1794662486" alt="EP1-04-02 第 3 張" loading="lazy"><figcaption><b>04-02</b><span class="n">第 3 張</span><p>可是你一直低頭滑手機，連頭都沒抬一下。</p></figcaption></figure>
<figure><img src="img/EP1-04-03_1.png?v=1794662486" alt="EP1-04-03 第 1 張" loading="lazy"><figcaption><b>04-03</b><span class="n">第 1 張</span><p>你只問了他一個問題：為什麼不去侏羅紀呢？畢竟那部電影，你都看了五遍耶。</p></figcaption></figure>
<figure><img src="img/EP1-04-04_3.png?v=1794662487" alt="EP1-04-04 第 3 張" loading="lazy"><figcaption><b>04-04</b><span class="n">第 3 張</span><p>這下博士可不高興了，他說：侏羅紀根本就沒有暴龍啦。你最愛的那部恐龍電影，光是片名就在騙你。</p></figcaption></figure>
<figure><img src="img/EP1-04-05_1.png?v=1794662487" alt="EP1-04-05 第 1 張" loading="lazy"><figcaption><b>04-05</b><span class="n">第 1 張</span><p>於是博士在黑板上，畫了一條長長的時間線。侏羅紀是從兩億年前，到一億四千五百萬年前，劍龍就住在這一段。再來才是白堊紀，一直到六千六百萬年前，而暴龍，排在最後面。</p></figcaption></figure>
<figure><img src="img/EP1-04-06_3.png?v=1794662487" alt="EP1-04-06 第 3 張" loading="lazy"><figcaption><b>04-06</b><span class="n">第 3 張</span><p>接著，博士開始上課。第一課：越大隻的，跑得越慢。他一手拿著大恐龍，一手拿著小恐龍，大的這隻，身高是小的兩倍。可是牠的腿能撐住的力氣只多四倍，體重卻足足重了八倍。腿撐不住，當然就跑不快啦。</p></figcaption></figure>
<figure><img src="img/EP1-04-07_1.png?v=1794662487" alt="EP1-04-07 第 1 張" loading="lazy"><figcaption><b>04-07</b><span class="n">第 1 張</span><p>而你，在滑手機。</p></figcaption></figure>
<figure><img src="img/EP1-04-08_4.png?v=1794662487" alt="EP1-04-08 第 4 張" loading="lazy"><figcaption><b>04-08</b><span class="n">第 4 張</span><p>第二課：跑最快的，不是最大隻，也不是最小隻。而是不大不小、剛剛好的，大概九十公斤。只要超過兩千七百公斤，就會被自己的體重拖慢。</p></figcaption></figure>
<figure><img src="img/EP1-04-09_1.png?v=1794662487" alt="EP1-04-09 第 1 張" loading="lazy"><figcaption><b>04-09</b><span class="n">第 1 張</span><p>你打了一個大哈欠。</p></figcaption></figure>
<figure><img src="img/EP1-04-10_3.png?v=1794662487" alt="EP1-04-10 第 3 張" loading="lazy"><figcaption><b>04-10</b><span class="n">第 3 張</span><p>博士拿出碼表，叫你跑一趟給他看。一般人跑步時速大概二十四公里，奧運選手可以到四十四公里。</p></figcaption></figure>
<figure><img src="img/EP1-04-11_1.png?v=1794662487" alt="EP1-04-11 第 1 張" loading="lazy"><figcaption><b>04-11</b><span class="n">第 1 張</span><p>結果你一邊滑手機，一邊慢慢走完，博士的碼表根本沒按下去。</p></figcaption></figure>
<figure><img src="img/EP1-04-12_3.png?v=1794662487" alt="EP1-04-12 第 3 張" loading="lazy"><figcaption><b>04-12</b><span class="n">第 3 張</span><p>第三課：跑得越快，就越難轉彎。你看獵豹追羚羊，三次裡面，羚羊能逃掉兩次呢。</p></figcaption></figure>
<figure><img src="img/EP1-04-13_3.png?v=1794662487" alt="EP1-04-13 第 3 張" loading="lazy"><figcaption><b>04-13</b><span class="n">第 3 張</span><p>博士自己示範急轉彎，結果差點閃到腰。</p></figcaption></figure>
<figure><img src="img/EP1-04-14_4.png?v=1794662487" alt="EP1-04-14 第 4 張" loading="lazy"><figcaption><b>04-14</b><span class="n">第 4 張</span><p>你抬起頭看了一眼，然後又低頭繼續滑。</p></figcaption></figure>
<figure><img src="img/EP1-04-15_3.png?v=1794662487" alt="EP1-04-15 第 3 張" loading="lazy"><figcaption><b>04-15</b><span class="n">第 3 張</span><p>出發前，博士推過來三樣東西：一台相機、一個樣本袋，還有一個用膠帶纏得亂七八糟的按鈕。</p></figcaption></figure>
<figure><img src="img/EP1-04-16_1.png?v=1794662487" alt="EP1-04-16 第 1 張" loading="lazy"><figcaption><b>04-16</b><span class="n">第 1 張</span><p>他問你：電擊槍有帶嗎？你拍拍口袋：有啦。</p></figcaption></figure>
<figure><img src="img/EP1-04-17_2.png?v=1794662487" alt="EP1-04-17 第 2 張" loading="lazy"><figcaption><b>04-17</b><span class="n">第 2 張</span><p>這東西上面只有一顆按鈕，按下去，就能回家。</p></figcaption></figure>
<figure><img src="img/EP1-04-18_4.png?v=1794662487" alt="EP1-04-18 第 4 張" loading="lazy"><figcaption><b>04-18</b><span class="n">第 4 張</span><p>博士還說：沒拍到暴龍、沒帶回牙齒，就不付錢喔。</p></figcaption></figure>
<figure><img src="img/EP1-04-19_1.png?v=1794662487" alt="EP1-04-19 第 1 張" loading="lazy"><figcaption><b>04-19</b><span class="n">第 1 張</span><p>博士還給了你一本生存指南，又厚又重。</p></figcaption></figure>
<figure><img src="img/EP1-04-20_3.png?v=1794662487" alt="EP1-04-20 第 3 張" loading="lazy"><figcaption><b>04-20</b><span class="n">第 3 張</span><p>你看看指南，再看看旁邊那包洋芋片，最後你選了洋芋片。</p></figcaption></figure>
<figure><img src="img/EP1-04-21_2.png?v=1794662487" alt="EP1-04-21 第 2 張" loading="lazy"><figcaption><b>04-21</b><span class="n">第 2 張</span><p>然後把它跟按鈕一起，塞進背包裡。</p></figcaption></figure>
<figure><img src="img/EP1-04-22_4.png?v=1794662487" alt="EP1-04-22 第 4 張" loading="lazy"><figcaption><b>04-22</b><span class="n">第 4 張</span><p>博士說，等你準備好，他再拉下拉桿。結果他直接就拉了。</p></figcaption></figure>
<figure><img src="img/EP1-04-23_1.png?v=1794662487" alt="EP1-04-23 第 1 張" loading="lazy"><figcaption><b>04-23</b><span class="n">第 1 張</span><p>機器卻沒反應，博士就往機器上用力拍了一下。</p></figcaption></figure>
</div>
</main></body></html>

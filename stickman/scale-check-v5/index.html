<header><h1>恐龍比例檢查（第 5 版）</h1>

alse, "size": "CU", "img": 1, "dino": "TREX", "verdict": "無法比", "fix": "不用改", "seen": "沒有 HERO 同框。TREX 頭到胸部的特寫，佔滿右中，臉部和疤痕的造型和比例圖一樣，沒有明顯怪的地方。", "imgs": ["img/EP1-08-07_1.jpg"]}, {"id": "EP1-08-07", "scene": "EP1-08", "w": false, "size": "CU", "img": 2, "dino": "TREX", "verdict": "無法比", "fix": "不用改", "seen": "沒有 HERO 同框。TREX 正面頭到胸部，站在小路上，正面看頭顯得比較圓短，前肢小，大致正常，沒有明顯的比例問題。", "imgs": ["img/EP1-08-07_2.jpg"]}];const NOTES=["原本景別 40 張一致 21 張（53%）；遠一級（W）34 張只有 9 張一致（26%）。多畫遠一級沒有讓比例變準，反而更常出錯。", "恐龍在遠處（追在後面、對岸、小路盡頭）時常畫太小：TEEN 側拍、第 8 幕暴龍在小路後方、第 7 幕近處的鴨嘴龍，都要放大 1.5～2 倍。", "恐龍頭湊近 HERO 的近距離鏡頭大多一致（第 7 幕 10、12、16）；但拉遠一級後暴龍頭常變太大（07W、11W、16W 要縮小 2～4 成）。", "甲龍（只比 HERO 高三成）一半一致，其餘偏大：身體畫得太長、趴著卻比 HERO 高。", "EP1-06-11W 第 1 張的 HERO 畫成全白人形（沒帽子、背包、衣服），角色本身畫錯。", "第 1 幕原本景別：TEEN 在後面追、正面拍（04）或在前景（05）都對；側拍並排（03、06）還是畫小。", "第 1 幕遠一級（W）全部偏小：拉遠以後 Flow 把 TEEN 畫得只比 HERO 高一兩成，放得下全身但比例沒變對。"];const P=[{"who": "TEEN", "img": "img/pair_teen.jpg", "note": "青少年暴龍 TEEN 頭頂 2.89 m，HERO 1.72 m：TEEN 是 HERO 的 1.68 倍高；頭大約有 HERO 身高的三分之二長。"}, {"who": "TREX", "img": "img/pair_trex.jpg", "note": "成年暴龍 TREX 頭頂 5.06 m：HERO 的 2.9 倍高；光是頭就比 HERO 整個人還長。"}, {"who": "EDMONTO", "img": "img/pair_edmonto.jpg", "note": "鴨嘴龍 EDMONTO 4.35 m：HERO 的 2.5 倍高。"}, {"who": "ANKY", "img": "img/pair_anky.jpg", "note": "甲龍 ANKY 2.23 m：只有 HERO 的 1.3 倍高，但身體又長又寬，像一台小車。"}];const PI=Object.fromEntries(P.map(p=>[p.who,p.img]));
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
document.getElementById('charts').innerHTML=P.map(p=>`<div><img src="${p.img}" alt="${p.who}"><p><b>${p.who}</b>　${esc(p.note)}</p></div>`).join('');
const cls=v=>v==='一致'?'ok':v.startsWith('略')?'warn':v.startsWith('太')?'bad':'na';

const both=R.filter(r=>r.dino&&V0.includes(r.verdict));
const grp=(f,t)=>{const a=both.filter(f);return a.length?`<li>${t}：${a.length} 張，`+V0.map(v=>`${v} ${a.filter(r=>r.verdict===v).length}`).join('、')+'</li>':''};
document.getElementById('sum').innerHTML=grp(r=>1,'全部可比的圖')+grp(r=>!r.w,'原本景別')+grp(r=>r.w,'遠一級（W）')
 +['TEEN','ANKY','EDMONTO','TREX'].map(d=>grp(r=>r.dino===d,d)).join('')
 +[...new Set(R.map(r=>r.scene))].map(s=>grp(r=>r.scene===s,'幕 '+s.slice(-1))).join('')

 +NOTES.map(n=>`<li>${n}</li>`).join('');
const card=r=>`<div class="card shot"><div class="bar"><span class=k>${r.id}・${esc(r.size)}・第 ${r.img} 張</span>${r.dino?`<span class=dz>${r.dino}</span>`:''}<span class="v ${cls(r.verdict)}">${esc(r.verdict)}</span><span>${esc(r.fix)}</span></div>

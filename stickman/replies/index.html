\nEP1-06-08 6 FS front eye E21 ['REF_HERO'] ｜ HERO 雙手枕在頭後、往後靠著放鬆，雙腳晃著，一臉滿足的小笑——石頭完全像普通\nEP1-06-09 6 ECU front eye G17 ['REF_ANKY'] ｜ 一隻眼睛在『石頭』表面睜開、眨了一下，點破牠是活的。\nEP1-06-10 7 WS side eye E22 ['REF_HERO', 'REF_ANKY', 'PAIR2_ANKY'] ｜ 反轉揭曉：長滿青苔的『石頭』其實是甲龍；左邊尾錘微微抬離地面，背上的 HERO \nEP1-06-11 8 FS side eye G24 ['REF_HERO', 'REF_ANKY'] ｜ HERO 踮著腳尖、高抬膝、張開雙臂保持平衡往右偷溜，同時回頭緊張地瞄左後方的甲\nEP1-06-12 9 CU front eye G22 ['REF_HERO', 'REF_PROPS'] ｜ HERO 撐開背包空蕩的水壺袋，才發現水壺沒帶、失望。\nEP1-06-13 10 MS front34 eye F20 ['REF_HERO'] ｜ HERO 把手掌搗在耳後、歪頭朝鏡頭方向（北）細聽水聲，表情半是期待、半是不敢全\n問題：\n- shot_count 13 ≠ 13 張"}}, "compare": "## Codex：19 張\n景別： {'FS': 4, 'MLS': 6, 'MCU': 1, 'CU': 5, 'WS': 2, 'ECU': 1}\n角度： {'eye': 19}\n方位： {'side': 8, 'front': 11}\n每張旁白句數： [1, 1, 1, 3, 3, 2, 3, 1, 2, 1, 1, 1, 1, 1, 1, 2, 1, 2, 2]\n方位對不上地圖：\n- EP1-06-02：相機 G33 在地圖外\n- EP1-06-05：算不出（主體 手機螢幕，相機 G31）\n- EP1-06-16：算不出（主體 背包空水壺袋，相機 H17）\n- EP1-06-17：算不出（主體 水壺與生存指南，相機 N/A）\n站位、相機都在可用的格子\n\n## Claude：13 張\n景別： {'FS': 3, 'EWS': 1, 'MCU': 1, 'MS': 3, 'ECU': 2, 'WS': 2, 'CU': 1}\n角度： {'eye': 12, 'aerial': 1}\n方位： {'side': 4, 'back': 1, 'front': 6, 'front34': 2}\n每張旁白句數： [2, 1, 3, 1, 2, 2, 3, 3, 1, 3, 2, 3, 4]\n方位對不上地圖：\n- EP1-06-02：相機 G34 在地圖外\n- EP1-06-05：填 front，地圖算出 None（主體 G26 朝 S，相機 G26）\n- EP1-06-09：填 front，地圖算出 front34（主體 F16 朝 E，相機 G17）\n- EP1-06-12：算不出（主體 背包的水壺側袋（空的，插入鏡頭），相機 G22）\n站位、相機都在可用的格子"}, {"id": "EP1-06_v2", "request": "你是一位動畫分鏡導演。下面給你一幕戲和這個場景的地圖，請你決定：\n- 這一幕要拍幾張圖；\n- 角色在地圖上站在哪裡、怎麼移動（走位）；\n- 每張圖的相機放在地圖哪裡；\n- 每張圖的 7 項拍攝資訊（一定要填）；\n- 每張圖送進 Google Flow（Nano Banana 2.1 生圖模型）的英文 prompt。\n\n━━━━━━━━━━━━━━━━━━━━\n【零、分鏡原則】（優先遵守）\n1. 你首先是動畫分鏡導演，其次才是生圖 prompt 工程師。目標是有電影感、敘事清楚、節奏有效的鏡頭，不只是把每張圖畫對。\n2. 優先順序：（1）電影效果與敘事功能（2）角色與空間連戲（3）Google Flow 的可生成性。\n3. 每張圖都要有明確的敘事功能，例如建立環境、呈現速度、強調危險、揭露資訊、製造笑點、形成懸念、定格或轉場錨點。不必另外輸出成欄位，但要反映在 notes、composition、action、旁白分配和鏡頭安排裡。\n4. 依戲劇需要選景別和角度：仰視（壓迫感、巨大感）、俯視（脆弱感、空間關係）、遠景（建立環境）、特寫／近景（情緒、細節、威脅）、插入鏡頭（資訊、物件、局部）。鏡頭變化一定要有理由，不是為了變化而變化。\n5. 先設計最佳分鏡，再處理模型限制。戲劇上值得用的景別或角度，就算實測是 △ 或 ✗ 也可以選：這時 7 項資訊照你想要的填，但 prompt 要寫成畫得出來的補救版本，remedy 寫怎麼補（例：想要 CU → shot_size 填 CU，prompt 用 MCU 的句子，remedy 寫「prompt 用 MCU，剪輯時推近到 CU」）。prompt 不可以直接用 ✗ 的寫法。\n6. 剪接：每次切鏡都要有目的，例如從環境切到角色、從 HERO 切到威脅、從動態切到定格、切插入鏡頭強調資訊。避免連續兩張功能重複、構圖相近、景別和視角沒有意義的變化；功能重複的就合併成一張。\n7. 會在別幕重現的瞬間是「關鍵錨點鏡頭」：角色位置和姿勢、相機位置、物件位置、背景構圖、光線方向、角色之間的遮擋關係都要特別清楚、穩定，方便之後重現。\n8. 角色的實際身高和畫面裡看起來多大是兩件事：身高固定不變，畫面裡佔幾成由距離、透視、景別和角度決定。\n\n━━━━━━━━━━━━━━━━━━━━\n【一、作品】\n科普短片系列，改編 Cody Cassidy《How to Survive History》。主角 HERO 是一個很窮、延畢兩年的大學生，幫博士打工，坐時光機回到過去出任務。HERO 沒有台詞，只有喘氣、驚叫這類聲音；故事全靠第二人稱旁白（「你」）。畫風：手腳粗粗的火柴人，白色圓頭；恐龍是卡通風，但大小照真實比例。\n每張圖是一張 16:9 靜態圖；剪輯時可以對它推近、拉遠、移框、停留，所以一張圖可以配好幾句旁白。\n可以用插入鏡頭（只拍東西或手，例如手機螢幕），插入鏡頭也要填 7 項資訊。\n\n━━━━━━━━━━━━━━━━━━━━\n【二、這一幕】EP1 幕 6　降落點空地・白天（甲龍「石頭」在睡覺）\n在演什麼：\nHERO 從空中掉下來，臉先著地。又熱又濕，蚊子圍上來。他拿手機搜尋「白堊紀要怎麼活下去」，沒有訊號。到處是蕨類。他坐上一顆長滿青苔的大石頭休息，覺得這份工作還不錯；然後石頭眨了一下眼睛，原來是一隻尾巴有骨錘的甲龍，牠只想繼續睡，HERO 踮著腳溜走。他口渴，發現水壺跟指南都留在實驗室，聽到水聲。\n\n旁白逐字（照順序；全部要分配到圖上，一句都不能漏、不能改字；「（停）」是笑點前約 0.8 秒的停頓）：\n  1. 你是臉先著地的。\n  2. 身後的隧道，也跟著關起來了。\n  3. 這裡又熱又濕。那時候的地球比現在熱得多，連南北極都沒有冰呢。\n  4. 第一個跑來歡迎你的，是蚊子。\n  5. （停）\n  6. 都過了六千六百五十萬年，蚊子還是一模一樣。\n  7. 你打開 Google，搜尋：白堊紀要怎麼活下去？\n  8. 畫面一直轉圈、轉圈。\n  9. 沒有訊號。\n  10. （停）\n  11. 對啊，六千六百五十萬年前，哪來的基地台。\n  12. 你想找一片草地坐下來休息。\n  13. 可是這個時代，草還沒有長成草原喔。\n  14. 到處都是蕨類，高到你的腰。\n  15. 還好，旁邊剛好有一顆長滿青苔的大石頭。\n  16. 又平又涼，大小剛剛好。\n  17. 今天第一次，你覺得這份工作還不錯嘛。\n  18. 然後，那顆石頭，眨了一下眼睛。\n  19. 原來，那是一隻甲龍。全身都是盔甲，尾巴上還有一顆骨錘。\n  20. 那顆骨錘一揮，可以把你打到下個月去。\n  21. 還好，牠只想繼續睡覺。\n  22. 你踮著腳尖，偷偷溜走。\n  23. 走著走著，你口渴了。\n  24. 打開背包一看，放水壺的地方，空空的。\n  25. （停）\n  26. 水壺啊，跟生存指南一起留在實驗室了。\n  27. 這時候，你聽到了水聲。\n  28. 這是今天的第一個好消息。\n  29. （停）\n  30. 不過你決定，先不要太相信它。\n\n前一幕（幕 5）：旁白交代 6,650 萬年前北美洲中間隔著一大片海，HERO 掉在西邊；森林裡閃了一下藍光。\n後一幕（幕 7）：HERO 循著水聲走到北邊的河邊，對岸一群鴨嘴龍在喝水。\n\n━━━━━━━━━━━━━━━━━━━━\n【三、角色】（身高是站立時頭頂的高度）\n- HERO：火柴人，身高 1.72 m。戴帽子（照設定圖）、胸前斜背一台小相機、背著背包（放水壺的袋子是空的）。剛摔進泥地，滿身泥巴、滿頭汗。參考圖：REF_HERO（角色設定圖）、REF_PROPS（道具圖，有相機）。\n- ANKY（甲龍，旁白叫牠「石頭」）：全身盔甲，尾巴有骨錘；身高 2.23 m，身長約 6 m。這一幕一直趴著睡覺，背上長滿青苔，看起來像一顆大石頭；只有眨眼和慢慢舉起尾錘。參考圖：REF_ANKY（設定圖）、PAIR2_ANKY（HERO 和甲龍的身高比例圖）。\n- 蚊子：沒有參考圖。\n\n━━━━━━━━━━━━━━━━━━━━\n【四、地圖】降落點空地・白天\n大小 14 欄（A–N）× 32 列（1–32），一格 2 公尺。北在上。時間：上午，太陽在東南方。\n格子用「欄字母＋列數字」表示。\n     A B C D E F G H I J K L M N\n  1  D D D D D D D D D D D D D D\n  2  D D D D D D D D D D D D D D\n  3  s s s s s s s s s s s s s s\n  4  s s s s s s s s s s s s s s\n  5  R R R R R R R R R R R R R R\n  6  R R R R R R R R R R R R R R\n  7  R R R R R R R R R R R R R R\n  8  R R R R R R R R R R R R R R\n  9  R R R R R R R R R R R R R R\n 10  R R R R R R R R R R R R R R\n 11  R R R R R R R R R R R R R R\n 12  R R R R R R R R R R R R R R\n 13  R R R R R R R R R R R R R R\n 14  R R R R R R R R R R R R R R\n 15  F F F g g g g g g g g F F F\n 16  F F F g g g g g g g g F F F\n 17  F F F g g g g g g g g F F F\n 18  F F F g g g g g g g g F F F\n 19  F F F g g g g g g g g F F F\n 20  F F F g g g g g g g g F F F\n 21  F F F g g g g g g g g F F F\n 22  F F F g g g g g g g g F F F\n 23  F F F g g g g g g g g F F F\n 24  F F F g g g g f f f f F F F\n 25  F F F g g g g f f f f F F F\n 26  F F F g g g g f f f f F F F\n 27  F F F A A A g f f f f F F F\n 28  F F F A A A g g g g g F F F\n 29  F F F g g g m m g g g F F F\n 30  F F F g g g m m g g g F F F\n 31  F F F g g g g g g g g F F F\n 32  F F F g g g g g g g g F F F\n\n字母（「角色」是角色能不能站在、走進那一格；「相機」是相機能不能放在那一格）：\n  A = 甲龍「石頭」（ANKY）睡著，像一顆長滿青苔的大石頭（ANKY the ankylosaur asleep, looking like a big moss-covered boulder）｜角色：不可站｜相機：不可放（不能穿過；劇情需要時 HERO 可以坐在牠背上）\n  D = 對岸的森林（開闊、朦朧）（a distant, open, hazy forest on the far bank, soft and pale, with gaps between the trees）｜角色：不可站｜相機：不可放（對岸，太遠）\n  F = 森林（蘇鐵、銀杏、針葉樹）（a dense Cretaceous forest of cycads, ginkgos and conifers）｜角色：不可站｜相機：可放（相機可以放在森林邊緣往外拍，前景會有枝葉）\n  R = 河（a wide slow river）｜角色：不可站｜相機：可放（相機可以在水面上方往岸上拍）\n  f = 蕨類叢（a thick patch of tall ferns）｜角色：可站｜相機：可放（蕨類高到 HERO 的腰）\n  g = 森林裡的空地（an open patch of forest floor with leaf litter and low plants）｜角色：可站｜相機：可放\n  m = 泥地（a patch of shallow mud on the forest floor (only a thin layer of mud, not a pit)）｜角色：可站｜相機：可放\n  s = 對岸河邊地（a strip of flat muddy riverside ground on the far bank）｜角色：不可站｜相機：不可放（對岸，太遠）\n  T = 時光隧道出口（HERO 掉下來的地方，掉下來後關閉）（the spot in the air where the blue time tunnel opens），位置：G29 正上方的空中\n甲龍頭朝東、尾錘朝西。甲龍和時光隧道出口的位置是固定的（之後另一幕會回到同一個地方），不能移動。\n地圖外面：北邊 對岸開闊、朦朧的森林往遠方延伸；東邊 寬闊的河和兩岸的森林往遠方延伸；西邊 寬闊的河和兩岸的森林往遠方延伸；南邊 茂密的森林往遠方延伸。\n\n━━━━━━━━━━━━━━━━━━━━\n【五、每張圖必填的 7 項拍攝資訊】一定要填，不能空；不適用填 N/A。左右一律是觀眾看到的畫面左右。\n  1. 主體（subject）：景別和構圖以誰為準；次要主體可列。 自由寫。\n  2. 景別（shot_size）：8 級擇一，以主體為準。 只能填下面其中一個：\n     - EWS：極遠景。主體很小，環境是重點\n     - WS：遠景。主體全身清楚，周圍環境也大量入鏡\n     - FS：全景。主體頭到腳剛好完整入鏡\n     - MLS：膝上景。畫面下緣在膝蓋附近\n     - MS：中景。畫面下緣在腰附近\n     - MCU：中近景。畫面下緣在胸附近\n     - CU：特寫。臉（或物件的重點部分）\n     - ECU：極特寫。比特寫更小的局部：眼睛、嘴、手指\n  3. 水平方位（azimuth）：相機在主體哪一邊。 只能填下面其中一個：\n     - front：正面。相機在主體正前方\n     - front34：前側 3/4。相機在主體前方偏一側，看得到臉和一側身體\n     - side：側面。相機在主體正側面\n     - back34：後側 3/4。相機在主體後方偏一側\n     - back：背面。相機在主體正後方\n  4. 角度（angle）：5 種擇一。 只能填下面其中一個：\n     - eye：平視。相機跟主體眼睛差不多高，平著看\n     - low：仰視。相機貼地往上看，主體顯得高大\n     - high：俯視。相機在附近高處往下看\n     - top：正上方俯拍。相機在主體正上方，垂直往下看\n     - aerial：空拍。相機在高空，往下看一大片地形，主體很小\n  5. 構圖位置（composition）：誰在畫面左／中／右；前景、背景有什麼。 自由寫。\n  6. 畫面方向（screen_direction）：主體往哪邊跑或看（觀眾的左右）。 只能填下面其中一個：\n     - left：往左。主體往畫面左邊移動\n     - right：往右。主體往畫面右邊移動\n     - toward：朝鏡頭。主體朝鏡頭來\n     - away：遠離鏡頭。主體離開鏡頭\n     - off_left：看畫外左。主體看向畫面外左邊\n     - off_right：看畫外右。看向畫面外右邊\n     - off_up：看畫外上。看向畫面外上方\n     - off_down：看畫外下。看向畫面外下方\n  7. 動作與關鍵瞬間（action）：哪一刻、什麼姿勢、表情。 自由寫。\n  景別填 ECU 時，另外在 ecu_part 寫是哪個局部（眼睛、嘴、手指…）；不是 ECU 填 N/A。\n\n每張圖另外要給：\n  - 配哪幾句旁白（照抄上面的句子）；\n  - 每個入鏡角色：哪些部位入鏡、約佔畫高幾成（每個角色都要寫，只寫倍數的話模型會把每個角色畫成一樣大）；\n  - 要附哪幾張參考圖。\n\n━━━━━━━━━━━━━━━━━━━━\n【六、地圖和 7 項資訊要對得上】回傳前請自己檢查：\n  - 水平方位：由相機的格子相對於主體的格子、和主體面朝的方向算出來。\n  - 景別：要跟相機到主體的距離合理，距離寫在 camera.distance_m。\n  - 畫面方向：主體面朝或移動的方向，換算成從相機看過去的左右。\n  - 構圖位置：誰在畫面左、誰在畫面右，要跟從相機看過去的地圖左右一致。\n  - 走位：前後圖的角色位置要連得起來。角色只能站在、走過字母說明標「角色：可站」的格子；相機只能放在標「相機：可放」的格子，不能放在地圖外（高度不限）。\n\n━━━━━━━━━━━━━━━━━━━━\n【七、寫 prompt 的規則】\n- 景別、水平方位、角度三項，直接用下面實測過的英文句子（HERO 換成這張的主體；水平方位句子裡的 trail、TEEN 換成這一幕的東西），不要自己改寫。✓ 有效、△ 部分有效、✗ 無效。\n- 用了表上沒有的寫法，列在 untested。\n- 7 項資訊填你想要的效果。想要的效果是 △ 或 ✗ 時，prompt 寫成畫得出來的補救版本，remedy 寫怎麼補（例：想要 CU → shot_size 填 CU，prompt 用 MCU 的句子，remedy 寫「prompt 用 MCU，剪輯時推近到 CU」）。prompt 不可以直接用 ✗ 的寫法。\n- 畫風那句固定寫：16:9, generate 1 image. Flat 2D cartoon in exactly the style of the attached character sheets: thick black outlines, flat colors. No text anywhere in the picture.\n- 每個入鏡角色只能出現一次；寫明畫面裡只有哪些角色。\n  [景別]\n   EWS ✓：Shot size: Extreme Wide Shot (EWS). HERO is very small in the picture; the environment is the main subject.\n   WS △：Shot size: Wide Shot (WS). HERO's whole body is clearly visible, with a lot of the surroundings around him.　（常畫成跟 FS 一樣大）\n   FS ✓：Shot size: Full Shot (FS). HERO's whole body, from head to feet, just fits in the picture.\n   MLS ✓：Shot size: Medium Long Shot (MLS). HERO is framed from the knees up; the bottom edge of the picture is at his knees.\n   MS △：Shot size: Medium Shot (MS). HERO is framed from the waist up; the bottom edge of the picture is at his waist.　（常畫成膝上）\n   MCU △：Shot size: Medium Close-up (MCU). HERO is framed from the chest up; the bottom edge of the picture is at his chest.　（常畫成到腰）\n   CU ✗：Shot size: Close-up (CU). HERO's face fills most of the picture.　（只到胸口）\n   ECU ✓：Shot size: Extreme Close-up (ECU). Only HERO's eyes and the glasses around them fill the picture.　（眼睛 ✓；寫「嘴」只有 1/4 成功）\n  [水平方位]\n   front ✓：Camera direction: front view. The camera is on the trail ahead of HERO, facing him.　（原文是 S00-3 追逐那一幕寫的（小路、TEEN），換場景時只換這些名詞）\n   front34 △：Camera direction: front three-quarter view. The camera is ahead of HERO and off to one side of the trail, so we see his face and one side of his body.　（大致做到；原文是 S00-3 追逐那一幕寫的（小路、TEEN），換場景時只換這些名詞）\n   side ✓：Camera direction: side view. The camera is beside the trail and sees HERO and TEEN exactly from the side.　（原文是 S00-3 追逐那一幕寫的（小路、TEEN），換場景時只換這些名詞）\n   back34 △：Camera direction: rear three-quarter view. The camera is behind TEEN and off to one side of the trail; TEEN is nearer the camera and HERO runs ahead of him, both seen from behind and one side.　（大致做到；偶爾多畫一個 HERO 當前景；原文是 S00-3 追逐那一幕寫的（小路、TEEN），換場景時只換這些名詞）\n   back ✓：Camera direction: back view. The camera is on the trail behind TEEN, looking the way they run; TEEN's back is nearer the camera and HERO's back is farther ahead. TEEN runs on one side of the trail, so he does not hide HERO.　（偶爾多畫一個 HERO 當前景；原文是 S00-3 追逐那一幕寫的（小路、TEEN），換場景時只換這些名詞）\n  [角度]\n   eye ✓：Camera angle: Eye-level: the camera is at HERO's eye height, looking straight ahead.\n   low ✓：Extreme low-angle shot, ground-level camera perspective, looking up at HERO's full body.　（一定要有 Extreme low-angle shot；只寫 Low Angle 40 格全失敗。目前只在單人站立畫面驗證）\n   high △：Camera angle: High angle: the camera is high above HERO, looking down at him.　（只有輕微往下看）\n   top ✗：Camera angle: Top-down shot (also called overhead shot): the camera is directly above HERO, looking straight down.　（最多高處斜看）\n   aerial △：Camera angle: Aerial shot: the camera is high in the sky, looking down at a wide stretch of the land.　（只有配 EWS 成功）\n  注意：寫了俯視、正上方、空拍，人物常會變小，景別被往遠拉一級。\n\n━━━━━━━━━━━━━━━━━━━━\n【八、工作順序】（照做，但不要輸出這段）\n1. 先讀完整段旁白，想清楚這一幕要完成的戲劇任務。\n2. 決定要幾張圖：夠用且有節奏，不是越多越好。\n3. 先想每張圖的敘事功能和剪接順序，再決定走位和相機位置。\n4. 分鏡想完，才把每張圖翻成送進 Google Flow 的英文 prompt。\n5. 回傳前檢查：旁白一句不漏、不改字；張數合理；走位連得起來；相機和 7 項資訊對得上地圖；每個不是平視的鏡頭都說得出理由。\n\n━━━━━━━━━━━━━━━━━━━━\n【九、回傳格式】\n只回一個 JSON 物件，不要其他文字，不要 markdown 程式碼框。欄位名稱和可選值照下面，一字不改：\n{\n \"scene_id\": \"EP1-06\",\n \"shot_count\": \"<整數>\",\n \"notes\": \"<整體拍法說明，繁體中文>\",\n \"blocking\": [\n  {\n   \"who\": \"<HERO／ANKY>\",\n   \"path\": [\n    {\n     \"t\": \"<整數>\",\n     \"cell\": \"<格子>\",\n     \"facing\": \"<N／NE／E／SE／S／SW／W／NW>\",\n     \"doing\": \"<在做什麼>\"\n    }\n   ]\n  }\n ],\n \"shots\": [\n  {\n   \"id\": \"EP1-06-<兩位數>\",\n   \"t\": \"<對應 blocking 的 t>\",\n   \"narration\": [\n    \"<旁白原句>\"\n   ],\n   \"subject\": \"<主體>\",\n   \"shot_size\": \"<EWS…ECU>\",\n   \"ecu_part\": \"<局部或 N/A>\",\n   \"azimuth\": \"<front…back>\",\n   \"angle\": \"<eye／low／high／top／aerial>\" me_height\": \"約6成\"}\n   ],\n   \"refs\": [\"REF_HERO\"],\n   \"prompt\": \"16:9, generate 1 image. Flat 2D cartoon in exactly the style of the attached character sheets: thick black outlines, flat colors. No text anywhere in the picture. Only one character is in the picture: HERO, a white round-headed mud-covered stick figure with a cap, a chest camera and a backpack, standing in a thick patch of tall ferns. Shot size: Wide Shot (WS). HERO's whole body is clearly visible, with a lot of the surroundings around him. Camera direction: front three-quarter view. The camera is ahead of HERO and off to one side, so we see his face and one side of his body. Camera angle: Eye-level: the camera is at HERO's eye height, looking straight ahead. HERO is standing waist-deep in a sea of tall ferns that reach up to his waist, one hand shading his eyes, looking around for a place to sit, mildly dismayed; ferns fill the foreground and midground, a dense Cretaceous forest behind, and there is no grass anywhere. HERO is centered.\",\n   \"untested\": [],\n   \"remedy\": \"WS 為 △，常畫成 FS：可接受（蕨海仍大量入鏡，且蕨類到腰的遮擋關係要保住）；若畫成 FS 露出腳，則把蕨類畫高一點或剪輯裁下緣。\"\n  },\n  {\n   \"id\": \"EP1-06-07\",\n   \"t\": 6,\n   \"narration\": [\n    \"還好，旁邊剛好有一顆長滿青苔的大石頭。\",\n    \"又平又涼，大小剛剛好。\",\n    \"今天第一次，你覺得這份工作還不錯嘛。\"\n   ],\n   \"subject\": \"HERO（坐在『大石頭』上休息）；次要：偽裝成石頭的 ANKY\",\n   \"shot_size\": \"FS\",\n   \"ecu_part\": \"N/A\",\n   \"azimuth\": \"front34\",\n   \"angle\": \"eye\",\n   \"composition\": \"畫面下半是一顆渾圓、長滿青苔的大石頭（其實是趴睡的甲龍，但要畫得完全像石頭：閉眼、看不到腿和頭、表面是苔蘚與凹凸岩塊感）；HERO 坐在石頭上方、兩腿垂著、往後靠、很放鬆；四周蕨類與森林，晨光溫暖。\",\n   \"screen_direction\": \"toward\",\n   \"action\": \"HERO 第一次露出滿意的表情，擦著汗、靠在涼涼的『石頭』上休息，覺得這份工作其實還不錯。\",\n   \"camera\": {\n    \"cell\": \"F25\",\n    \"height_m\": 1.4,\n    \"look_at\": \"HERO\",\n    \"distance_m\": 4.5\n   },\n   \"cast\": [\n    {\"who\": \"HERO\", \"visible\": \"坐姿全身\", \"frame_height\": \"約5成\"},\n    {\"who\": \"ANKY\", \"visible\": \"只露出長滿青苔的圓背（偽裝成大石頭，看不出頭、腿、尾錘，眼睛閉著）\", \"frame_height\": \"約4成（佔畫面下半）\"}\n   ],\n   \"refs\": [\"REF_HERO\", \"REF_ANKY\"],\n   \"prompt\": \"16:9, generate 1 image. Flat 2D cartoon in exactly the style of the attached character sheets: thick black outlines, flat colors. No text anywhere in the picture. In the picture: HERO, a white round-headed mud-covered stick figure with a cap, a chest camera and a backpack; and a big rounded moss-covered boulder. (The boulder is actually ANKY the sleeping ankylosaur, but it MUST look exactly like a smooth mossy rock: eyes closed, no legs, no head and no tail club showing, just a bumpy moss-and-stone dome.) Shot size: Full Shot (FS). HERO's whole body, from head to feet, just fits in the picture. Camera direction: front three-quarter view. The camera is ahead of HERO and off to one side, so we see his face and one side of his body. Camera angle: Eye-level: the camera is at HERO's eye height, looking straight ahead. HERO sits on top of the mossy boulder, legs dangling, leaning back and relaxed, wiping sweat, looking content for the first time today. Around them: tall ferns and a dense Cretaceous forest, warm morning light. The boulder fills the lower part of the frame; HERO is centered on top of it.\",\n   \"untested\": [],\n   \"remedy\": \"front34 為 △，大致可做到；重點是『石頭』必須畫成石頭（不可露出甲龍特徵），這是後面揭露的鋪陳。此鏡為錨點：HERO 坐姿與相機格需穩定，供他幕重現。\"\n  },\n  {\n   \"id\": \"EP1-06-08\",\n   \"t\": 6,\n   \"narration\": [\n    \"然後，那顆石頭，眨了一下眼睛。\"\n   ],\n   \"subject\": \"ANKY 的眼睛（插入鏡頭・揭露爆點）\",\n   \"shot_size\": \"ECU\",\n   \"ecu_part\": \"甲龍的眼睛\",\n   \"azimuth\": \"side\",\n   \"angle\": \"eye\",\n   \"composition\": \"畫面被一隻又大又圓的爬蟲類眼睛填滿，眼睛長在長滿青苔、佈滿骨質甲板的岩石般皮膚上；眼睛正在睜開／眨動，露出一條黑色瞳孔；四周是苔蘚與凹凸的甲板，其餘都在框外。\",\n   \"screen_direction\": \"off_right\",\n   \"action\": \"原本以為是石頭的表面，忽然一隻眼睛睜開、眨了一下，瞳孔往 HERO 坐著的方向（畫面右）瞄過去——揭露爆點。\",\n   \"camera\": {\n    \"cell\": \"G26\",\n    \"height_m\": 1.0,\n    \"look_at\": \"ANKY 的眼睛\",\n    \"distance_m\": 1.2\n   },\n   \"cast\": [\n    {\"who\": \"ANKY\", \"visible\": \"只有一隻眼睛與周圍的苔蘚、甲板皮膚\", \"frame_height\": \"眼睛區域填滿整個畫面（約10成）\"}\n   ],\n   \"refs\": [\"REF_ANKY\"],\n   \"prompt\": \"16:9, generate 1 image. Flat 2D cartoon in exactly the style of the attached character sheets: thick black outlines, flat colors. No text anywhere in the picture. This is an insert shot: only the ankylosaur's eye, no other character. Shot size: Extreme Close-up (ECU). Only the ankylosaur's single big round eye and the mossy armored skin around it fill the picture. Camera direction: side view. The camera is beside the ankylosaur's head and sees the eye from the side. Camera angle: Eye-level: the camera is level with the eye, looking straight at it. The eye is in the act of opening and blinking, a slit of dark pupil appearing, glancing off toward the right of frame; the surrounding skin is bumpy bony armor plating covered in patches of green moss, so it still half-looks like stone. Flat cartoon rendering.\",\n   \"untested\": [\"ECU 用在恐龍的眼睛（實測成功的是人眼＋眼鏡，恐龍眼屬類比）\"],\n   \"remedy\": \"N/A（ECU 畫眼睛是實測最穩的特寫；若偶爾拉遠，剪輯裁切放大到眼睛即可）。此為揭露爆點鏡，瞳孔朝右＝HERO 坐的方向，需與 07/09 的遮擋關係一致。\"\n  },\n  {\n   \"id\": \"EP1-06-09\",\n   \"t\": 6,\n   \"narration\": [\n    \"原來，那是一隻甲龍。全身都是盔甲，尾巴上還有一顆骨錘。\",\n    \"那顆骨錘一揮，可以把你打到下個月去。\",\n    \"還好，牠只想繼續睡覺。\"\n   ],\n   \"subject\": \"ANKY（側面全身）；次要：坐在背上的 HERO\",\n   \"shot_size\": \"WS\",\n   \"ecu_part\": \"N/A\",\n   \"azimuth\": \"side\",\n   \"angle\": \"eye\",\n   \"composition\": \"甲龍側面橫躺、佔滿畫面橫向：頭在畫面右（東）、一隻大骨錘尾巴在畫面左（西）；全身覆蓋苔蘚與骨板盔甲；HERO 是個小小的泥人，僵在牠背上（畫面中上方）；背景蕨類與森林。渺小的 HERO vs 龐大的甲龍＝威脅感與笑點。\",\n   \"screen_direction\": \"right\",\n   \"action\": \"揭露整隻甲龍：盔甲、尾端的骨錘都看得清楚；尾錘微微抬起又放下，但牠其實只想繼續睡，HERO 則嚇僵在背上。\",\n   \"camera\": {\n    \"cell\": \"E31\",\n    \"height_m\": 1.5,\n    \"look_at\": \"ANKY\",\n    \"distance_m\": 8\n   },\n   \"cast\": [\n    {\"who\": \"ANKY\", \"visible\": \"側面全身（頭、盔甲背、尾錘）\", \"frame_height\": \"約5成高、橫向幾乎佔滿畫寬\"},\n    {\"who\": \"HERO\", \"visible\": \"坐在甲龍背上的全身，很小\", \"frame_height\": \"約1.5成\"}\n   ],\n   \"refs\": [\"REF_HERO\", \"REF_ANKY\", \"PAIR2_ANKY\"],\n   \"prompt\": \"16:9, generate 1 image. Flat 2D cartoon in exactly the style of the attached character sheets: thick black outlines, flat colors. No text anywhere in the picture. Exactly two characters are in the picture: ANKY, a cartoon ankylosaur drawn at true scale (about 6 m long), lying prone and sleeping, its whole body covered in bony armor plating and patches of green moss, with a big bony club on the end of its tail; and HERO, a tiny white round-headed mud-covered stick figure sitting frozen on the ankylosaur's back. Shot size: Wide Shot (WS). The ankylosaur's whole body is clearly visible, with the surroundings around it. Camera direction: side view. The camera is beside the ankylosaur and sees it exactly from the side; its head is toward the right of the frame and its clubbed tail toward the left. Camera angle: Eye-level: the camera is at the ankylosaur's eye height, looking straight ahead. The armored body and the tail club are clearly shown; one eye is open but the animal just wants to keep sleeping; tiny HERO sits stiffly on its back, dwarfed by it. Background: tall ferns and a dense Cretaceous forest. ANKY fills the width of the frame; HERO is a small figure on its upper back.\",\n   \"untested\": [],\n   \"remedy\": \"WS 為 △，常畫得偏滿：prompt 用 WS 原句；若甲龍太滿到切頭或切尾錘，剪輯略拉遠或重生以保留『頭＋盔甲＋尾錘』三要素與 HERO 的體型對比。此為錨點鏡，甲龍朝向、HERO 背上位置需穩定。\"\n  },\n  {\n   \"id\": \"EP1-06-10\",\n   \"t\": 7,\n   \"narration\": [\n    \"還好，牠只想繼續睡覺。\",\n    \"你踮著腳尖，偷偷溜走。\",\n    \"走著走著，你口渴了。\"\n   ],\n   \"subject\": \"HERO（踮腳尖偷溜）；次要：背景睡著的『石頭』甲龍\",\n   \"shot_size\": \"FS\",\n   \"ecu_part\": \"N/A\",\n   \"azimuth\": \"front34\",\n   \"angle\": \"eye\",\n   \"composition\": \"HERO 在前景偏中，踮著腳尖朝鏡頭（南）這邊躡手躡腳地走來、一根手指比在嘴前、回頭瞄；背景（北）是那顆長滿青苔、睜著一眼的大石頭（甲龍）；四周蕨類。\",\n   \"screen_direction\": \"toward\",\n   \"action\": \"HERO 誇張地踮腳尖、放輕腳步往鏡頭方向偷偷溜走，一手比噤聲、緊張地回頭看那隻睡著的甲龍。\",\n   \"camera\": {\n    \"cell\": \"H32\",\n    \"height_m\": 1.5,\n    \"look_at\": \"HERO\",\n    \"distance_m\": 4.5\n   },\n   \"cast\": [\n    {\"who\": \"HERO\", \"visible\": \"全身\", \"frame_height\": \"約7成\"},\n    {\"who\": \"ANKY\", \"visible\": \"背景裡長滿青苔的圓背（偽裝石頭，露一隻睜開的眼）\", \"frame_height\": \"約3成\"}\n   ],\n   \"refs\": [\"REF_HERO\", \"REF_ANKY\"],\n   \"prompt\": \"16:9, generate 1 image. Flat 2D cartoon in exactly the style of the attached character sheets: thick black outlines, flat colors. No text anywhere in the picture. Exactly two characters are in the picture: HERO, a white round-headed mud-covered stick figure with a cap, a chest camera and a backpack, tiptoeing in the foreground; and, in the background, the big moss-covered boulder-like ankylosaur ANKY lying asleep with one eye open. Shot size: Full Shot (FS). HERO's whole body, from head to feet, just fits in the picture. Camera direction: front three-quarter view. The camera is ahead of HERO and off to one side of the clearing, so we see his face and one side of his body. Camera angle: Eye-level: the camera is at HERO's eye height, looking straight ahead. HERO is creeping toward the camera on exaggerated tiptoes, one finger over his lips, casting a nervous glance back over his shoulder at the sleeping armored creature behind him. Around them: tall ferns and forest floor with leaf litter. HERO is in the foreground slightly right of center; the mossy ankylosaur is smaller in the background behind him.\",\n   \"untested\": [],\n   \"remedy\": \"front34 為 △；若畫成較正面亦可接受。背景甲龍需維持『像石頭、露一眼』的狀態以連戲。\"\n  },\n  {\n   \"id\": \"EP1-06-11\",\n   \"t\": 8,\n   \"narration\": [\n    \"打開背包一看，放水壺的地方，空空的。\",\n    \"（停）\",\n    \"水壺啊，跟生存指南一起留在實驗室了。\"\n   ],\n   \"subject\": \"HERO（腰上，打開背包看到水壺格是空的）\",\n   \"shot_size\": \"MS\",\n   \"ecu_part\": \"N/A\",\n   \"azimuth\": \"front34\",\n   \"angle\": \"eye\",\n   \"composition\": \"HERO 置中，把背包轉到胸前、打開、朝鏡頭攤給我們看；背包側邊放水壺的鬆緊網袋空空、扁扁的；他肩膀下垮、一臉失落；背景蕨類森林。\",\n   \"screen_direction\": \"off_down\",\n   \"action\": \"HERO 打開背包往裡看，看到那個放水壺的位置空空如也，愣住（停），然後想起水壺和生存指南都留在實驗室了，整個人垮下來。\",\n   \"camera\": {\n    \"cell\": \"F32\",\n    \"height_m\": 1.4,\n    \"look_at\": \"HERO 與背包\",\n    \"distance_m\": 3\n   },\n   \"cast\": [\n    {\"who\": \"HERO\", \"visible\": \"腰部以上與雙手、背包\", \"frame_height\": \"約7成\"}\n   ],\n   \"refs\": [\"REF_HERO\", \"REF_PROPS\"],\n   \"prompt\": \"16:9, generate 1 image. Flat 2D cartoon in exactly the style of the attached character sheets: thick black outlines, flat colors. No text anywhere in the picture. Only one character is in the picture: HERO, a white round-headed mud-covered stick figure with a cap and a chest camera, holding his backpack open in front of his chest with both hands. Shot size: Medium Shot (MS). HERO is framed from the waist up; the bottom edge of the picture is at his waist. Camera direction: front three-quarter view. The camera is ahead of HERO and off to one side, so we see his face and one side of his body. Camera angle: Eye-level: the camera is at HERO's eye height, looking straight ahead. HERO peers into the open backpack; its elastic side water-bottle pocket hangs flat and completely empty; his shoulders slump and his face falls with disappointment. Background: softly blurred tall ferns and forest. HERO is centered.\",\n   \"untested\": [],\n   \"remedy\": \"MS 為 △，常畫成膝上：prompt 用 MS 原句；若畫成膝上，剪輯推近到腰上，重點保住『空水壺格＋失落表情』。\"\n  },\n  {\n   \"id\": \"EP1-06-12\",\n   \"t\": 9,\n   \"narration\": [\n    \"這時候，你聽到了水聲。\",\n    \"這是今天的第一個好消息。\",\n    \"（停）\",\n    \"不過你決定，先不要太相信它。\"\n   ],\n   \"subject\": \"HERO（背側，望向北邊的河・懸念轉場）\",\n   \"shot_size\": \"MLS\",\n   \"ecu_part\": \"N/A\",\n   \"azimuth\": \"back34\",\n   \"angle\": \"eye\",\n   \"composition\": \"HERO 在前景偏中，從背後側方看他：他把頭偏向上方（北），朝遠處的河望去；畫面上緣（北）隱約可見蕨類外、一條寬緩的河與對岸朦朧的森林；留白往北，引導視線到下一幕。\",\n   \"screen_direction\": \"away\",\n   \"action\": \"HERO 一聽到水聲，頭猛地抬起、偏向北邊河的方向，身體前傾想過去——卻又停住、踏出遲疑的半步，決定先別太相信這個好消息。\",\n   \"camera\": {\n    \"cell\": \"F32\",\n    \"height_m\": 1.4,\n    \"look_at\": \"HERO（越過他看向北邊的河）\",\n    \"distance_m\": iew. The camera is in the clearing ahead of HERO, facing him. Camera angle: Aerial shot: the camera is high in the sky, looking down at a wide stretch of the land. A vast, hot, humid Cretaceous landscape: a wide slow river running across the far (upper) side, a hazy pale forest on the far bank, dense forests of cycads, ginkgos and conifers on the left and right, big patches of tall ferns, and an open clearing of leaf litter where HERO stands. Shimmering heat haze, bright morning light from the south-east, no ice, lush and green. HERO is a tiny speck near the lower center of the clearing.", "untested": [], "remedy": "aerial 為 △ 但實測配 EWS 可成；若人物被拉得更小或角度偏斜，可接受（本鏡本就以環境為主體）。"}, {"id": "EP1-06-03", "t": 3, "narration": ["第一個跑來歡迎你的，是蚊子。", "（停）", "都過了六千六百五十萬年，蚊子還是一模一樣。"], "subject": "HERO（全身揮手打蚊子）", "shot_size": "FS", "ecu_part": "N/A", "azimuth": "front34", "angle": "eye", "composition": "HERO 在畫面中偏右，全身入鏡、手腳亂揮；他頭臉周圍是一團小蚊子（偏左上）；背景是模糊的蕨類與森林，地上落葉；滿身泥、冒汗。", "screen_direction": "toward", "action": "HERO 站穩後對著頭邊的蚊子雲瘋狂拍打、皺著臉、跳腳，汗珠亂飛，一臉崩潰。", "camera": {"cell": "I30", "height_m": 1.5, "look_at": "HERO", "distance_m": 6}, "cast": [{"who": "HERO", "visible": "全身", "frame_height": "約7成"}, {"who": "蚊子", "visible": "一團小蚊子圍著頭臉", "frame_height": "每隻約0.3成，成群散佈頭部周圍"}], "refs": ["REF_HERO"], "prompt": "16:9, generate 1 image. Flat 2D cartoon in exactly the style of the attached character sheets: thick black outlines, flat colors. No text anywhere in the picture. Only one real character is in the picture: HERO, a white round-headed mud-covered stick figure with a cap, a chest camera and a backpack, swatting wildly; plus a small cloud of tiny cartoon mosquitoes around his head. Shot size: Full Shot (FS). HERO's whole body, from head to feet, just fits in the picture. Camera direction: front three-quarter view. The camera is ahead of HERO and off to one side of the clearing, so we see his face and one side of his body. Camera angle: Eye-level: the camera is at HERO's eye height, looking straight const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const sel=document.getElementById('sc'),tabs=document.getElementById('tabs'),out=document.getElementById('out');

let view='cmp';
function copyBtn(id){return `<button class="copy" data-c="${id}">複製</button>`}
function nice(w){const d=w.data;if(!d)return `<div class="card warn">原始檔不是合法 JSON：${esc(w.err)}</div>`;

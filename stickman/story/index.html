<style>
:root{--bg:#eef0ee;--panel:#fff;--fg:#1d2420;--mut:#66706a;--line:#d5dad6;--acc:#1f6b52}

:root[data-theme="dark"]{--bg:#141816;--panel:#1d2320;--fg:#e6ebe8;--mut:#93a09a;--line:#2f3833;--acc:#6cc7a3;color-scheme:dark}

a.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--line)}

.body b{font-size:16px}.body span{color:var(--mut);font-size:14px}

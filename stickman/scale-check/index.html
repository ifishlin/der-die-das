<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>暴龍比例檢查</title>
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#f2f0eb;--panel:#fffdf9;--fg:#1f1d1a;--mut:#6d685f;--line:#dcd6ca;--acc:#8a4a20;--cx:#1f6b52;--cl:#a0522d;
  --ok:#1f7a45;--ok-soft:#dcefe3;--warn:#9a6a00;--warn-soft:#f6ecd2;--bad:#b0362c;--bad-soft:#f6dcd8;--na:#6d685f;--na-soft:#ebe8e2;
  --sans:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151412;--panel:#1e1c19;--fg:#ebe6dd;--mut:#a29b8f;--line:#35312a;--acc:#e3a072;--cx:#6cc7a3;--cl:#e3a07a;
  --ok:#6cc792;--ok-soft:#1b2c22;--warn:#e0b25a;--warn-soft:#332a14;--bad:#ef7d72;--bad-soft:#3a1f1c;--na:#a29b8f;--na-soft:#26231f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151412;--panel:#1e1c19;--fg:#ebe6dd;--mut:#a29b8f;--line:#35312a;--acc:#e3a072;--cx:#6cc7a3;--cl:#e3a07a;
  --ok:#6cc792;--ok-soft:#1b2c22;--warn:#e0b25a;--warn-soft:#332a14;--bad:#ef7d72;--bad-soft:#3a1f1c;--na:#a29b8f;--na-soft:#26231f;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
main{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:24px;margin:0;text-wrap:balance}h2{font-size:18px;margin:0}
a{color:var(--acc)}.sub{color:var(--mut);margin:4px 0 0;max-width:84ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.pair{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pair img{width:min(100%,420px);border-radius:6px;cursor:zoom-in}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:500;font-size:12.5px}
.k{font:12.5px var(--mono)}
.v{display:inline-block;font:500 12.5px var(--sans);border-radius:5px;padding:1px 8px;white-space:nowrap}
.v.ok{background:var(--ok-soft);color:var(--ok)}.v.warn{background:var(--warn-soft);color:var(--warn)}.v.bad{background:var(--bad-soft);color:var(--bad)}.v.na{background:var(--na-soft);color:var(--na)}
.who{font-weight:700}.who.codex{color:var(--cx)}.who.claude{color:var(--cl)}
.list{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}.shot .imgs{display:block}.shot img{width:100%;border-radius:6px;display:block;cursor:zoom-in}
.shot .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.list{display:flex;flex-direction:column;gap:14px}
ul{margin:4px 0 0;padding-left:20px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;cursor:zoom-out}.zoom img{max-width:100%;max-height:100%}
</style></head><body>
<main>
<div style="font-size:14px"><a href="../">← stickman</a>　<a href="../draw-compare/">分鏡出圖比較</a></div>
<header><h1>暴龍比例檢查</h1>
<p class="sub">EP1 幕 1 第 2 版，Codex 和 Claude 各自分鏡後 Flow 畫出來的圖。每張跟比例圖並排，<b>眼睛看了覺得 TEEN 和 HERO 的大小關係跟比例圖一致，就算一致</b>（考慮誰離鏡頭近、誰遠）。不用公式、不用地圖距離。判斷是 Claude 看圖做的。</p></header>
<div class="card pair"><img src="img/pair_teen.jpg" alt="PAIR_TEEN 比例圖"><div><h2>比例圖 PAIR_TEEN</h2><p class="sub">站在同一個距離時：TEEN 頭頂 2.89 m，HERO 1.72 m，TEEN 是 HERO 的 1.68 倍高；TEEN 的頭大約有 HERO 身高的三分之二長。</p></div></div>
<div class="card"><h2>總表</h2><div class="tbl"><table id="tb"><tr><th>來源</th><th>圖</th><th>張</th><th>判定</th><th>該怎麼改</th></tr></table></div><ul id="sum" style="margin-top:10px"></ul></div>
<div class="list" id="list"></div>
</main>
<script>
const R=[{"who": "codex", "shot": "01", "img": 1, "verdict": "只有 HERO", "fix": "—", "seen": "畫面裡沒有 TEEN。", "imgs": ["img/codex_01_1.jpg"]}, {"who": "codex", "shot": "01", "img": 2, "verdict": "只有 HERO", "fix": "—", "seen": "畫面裡沒有 TEEN。", "imgs": ["img/codex_01_2.jpg"]}, {"who": "codex", "shot": "02", "img": 1, "verdict": "太小", "fix": "TEEN 放大約 2 倍", "seen": "兩個並排在同一條小路上、差不多遠，TEEN 的頭跟 HERO 的頭一樣高，身體跟 HERO 差不多大，像一隻小型獸腳類。", "imgs": ["img/codex_02_1.jpg"]}, {"who": "codex", "shot": "02", "img": 2, "verdict": "略小", "fix": "TEEN 放大約 1.2–1.3 倍", "seen": "TEEN 在左邊、比 HERO 遠一些，頭頂略高於 HERO 的頭；考慮它比較遠，大小接近但還是偏小。", "imgs": ["img/codex_02_2.jpg"]}, {"who": "codex", "shot": "03", "img": 1, "verdict": "太小", "fix": "TEEN 放大約 2 倍", "seen": "TEEN 只在 HERO 身後不遠，卻比 HERO 還矮，眼睛在 HERO 眼睛下方。", "imgs": ["img/codex_03_1.jpg"]}, {"who": "codex", "shot": "03", "img": 2, "verdict": "太小", "fix": "TEEN 放大約 2 倍", "seen": "TEEN 正面跑在 HERO 身後不遠，頭頂比 HERO 的頭還低。", "imgs": ["img/codex_03_2.jpg"]}, {"who": "codex", "shot": "04", "img": 1, "verdict": "一致", "fix": "不用改", "seen": "TEEN 頭頂高出 HERO 很多，身體比 HERO 大好幾倍，兩個差不多遠。", "imgs": ["img/codex_04_1.jpg"]}, {"who": "codex", "shot": "04", "img": 2, "verdict": "一致", "fix": "不用改", "seen": "HERO 稍微靠近鏡頭、膝蓋以下出框；TEEN 頭頂仍高出 HERO 很多，大小關係跟比例圖一致。", "imgs": ["img/codex_04_2.jpg"]}, {"who": "codex", "shot": "05", "img": 1, "verdict": "一致", "fix": "不用改", "seen": "TEEN 前傾撲過來，頭在畫面上緣、嘴張到最大；光是頭就跟 HERO 的上半身一樣大，身體在畫面外。", "imgs": ["img/codex_05_1.jpg"]}, {"who": "codex", "shot": "05", "img": 2, "verdict": "一致", "fix": "不用改", "seen": "TEEN 頭壓得比 HERO 低（前傾撲咬），但頭的大小跟 HERO 的上半身差不多，跟比例圖一致。", "imgs": ["img/codex_05_2.jpg"]}, {"who": "claude", "shot": "01", "img": 1, "verdict": "只有 HERO", "fix": "—", "seen": "畫面裡沒有 TEEN。", "imgs": ["img/claude_01_1.jpg"]}, {"who": "claude", "shot": "01", "img": 2, "verdict": "只有 HERO", "fix": "—", "seen": "畫面裡沒有 TEEN。", "imgs": ["img/claude_01_2.jpg"]}, {"who": "claude", "shot": "02", "img": 1, "verdict": "只有 HERO", "fix": "—", "seen": "畫面裡沒有 TEEN。", "imgs": ["img/claude_02_1.jpg"]}, {"who": "claude", "shot": "02", "img": 2, "verdict": "只有 HERO", "fix": "—", "seen": "畫面裡沒有 TEEN。", "imgs": ["img/claude_02_2.jpg"]}, {"who": "claude", "shot": "03", "img": 1, "verdict": "只有 HERO", "fix": "—", "seen": "畫面裡沒有 TEEN。", "imgs": ["img/claude_03_1.jpg"]}, {"who": "claude", "shot": "03", "img": 2, "verdict": "只有 HERO", "fix": "—", "seen": "畫面裡沒有 TEEN。", "imgs": ["img/claude_03_2.jpg"]}, {"who": "claude", "shot": "04", "img": 1, "verdict": "略小", "fix": "TEEN 放大約 1.3–1.4 倍", "seen": "TEEN 在 HERO 斜後方、差不多遠，頭頂只比 HERO 的頭高一點；比例圖上應該高出大約 HERO 身高的七成。", "imgs": ["img/claude_04_1.jpg"]}, {"who": "claude", "shot": "04", "img": 2, "verdict": "略小", "fix": "TEEN 放大約 1.4–1.5 倍", "seen": "跟第 1 張差不多，TEEN 的頭頂幾乎跟 HERO 的頭一樣高，比第 1 張更小一點。", "imgs": ["img/claude_04_2.jpg"]}, {"who": "claude", "shot": "05", "img": 1, "verdict": "略大", "fix": "可以接受（刻意誇張）；要照比例的話 TEEN 縮小約 2 成", "seen": "TEEN 在 HERO 正後方、比 HERO 遠，卻有 HERO 的兩倍多高。正面衝鏡的戲劇效果。", "imgs": ["img/claude_05_1.jpg"]}, {"who": "claude", "shot": "05", "img": 2, "verdict": "略大", "fix": "可以接受（刻意誇張）；要照比例的話 TEEN 縮小約 2 成", "seen": "跟第 1 張一樣，TEEN 在 HERO 後面卻比比例圖還大。", "imgs": ["img/claude_05_2.jpg"]}, {"who": "claude", "shot": "06", "img": 1, "verdict": "一致", "fix": "不用改", "seen": "TEEN 在前景離鏡頭很近、只露上半身，HERO 在遠處小路上，近大遠小合理。", "imgs": ["img/claude_06_1.jpg"]}, {"who": "claude", "shot": "06", "img": 2, "verdict": "一致", "fix": "不用改", "seen": "同第 1 張的構圖，HERO 是背影，大小關係合理。", "imgs": ["img/claude_06_2.jpg"]}, {"who": "claude", "shot": "07", "img": 1, "verdict": "太小", "fix": "TEEN 放大約 1.5 倍", "seen": "側拍、兩個差不多遠，TEEN 整隻只比 HERO 大一點，頭在 HERO 腰部高度。", "imgs": ["img/claude_07_1.jpg"]}, {"who": "claude", "shot": "07", "img": 2, "verdict": "太小", "fix": "TEEN 放大約 1.8 倍", "seen": "跟第 1 張一樣的構圖，TEEN 更小，頭在 HERO 腰部以下。", "imgs": ["img/claude_07_2.jpg"]}];
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const cls=v=>v==='一致'?'ok':v.startsWith('略')?'warn':v.startsWith('太')?'bad':'na';
const name=w=>w==='codex'?'Codex':'Claude';
document.getElementById('tb').insertAdjacentHTML('beforeend',R.map(r=>`<tr><td class="who ${r.who}">${name(r.who)}</td><td class=k>EP1-01-${r.shot}</td><td class=k>${r.img?'第 '+r.img+' 張':'兩張'}</td><td><span class="v ${cls(r.verdict)}">${esc(r.verdict)}</span></td><td>${esc(r.fix)}</td></tr>`).join(''));
const both=R.filter(r=>r.verdict!=='只有 HERO');
document.getElementById('sum').innerHTML=['codex','claude'].map(w=>{const a=both.filter(r=>r.who===w);return `<li>${name(w)}：有 TEEN 的圖 ${a.length} 張，一致 ${a.filter(r=>r.verdict==='一致').length} 張（${a.filter(r=>r.verdict==='一致').map(r=>r.shot+'-'+r.img).join('、')||'無'}）</li>`}).join('')
 +'<li>並排同一距離的側拍最容易把 TEEN 畫小（Codex 02、03，Claude 04、07）；TEEN 在前景或當主體時大小都對。</li>';
document.getElementById('list').innerHTML=R.map(r=>`<div class="card shot"><div class="bar"><span class="who ${r.who}">${name(r.who)}</span><span class=k>EP1-01-${r.shot}・第 ${r.img} 張</span><span class="v ${cls(r.verdict)}">${esc(r.verdict)}</span><span>${esc(r.fix)}</span></div>
  <div class="imgs">${r.imgs.map(s=>`<img src="${esc(s)}" alt="${r.who} ${r.shot}" loading="lazy">`).join('')}</div><p style="margin:8px 0 0">${esc(r.seen)}</p></div>`).join('');
document.querySelectorAll('img').forEach(im=>im.onclick=()=>{const z=document.createElement('div');z.className='zoom';z.innerHTML=`<img src="${im.src}" alt="">`;z.onclick=()=>z.remove();document.body.appendChild(z)});
</script>
</body></html>

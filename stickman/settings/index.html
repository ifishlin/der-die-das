<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Stickman 設定</title>
<style>
:root{--bg:#eef0ee;--panel:#fff;--fg:#1d2420;--mut:#66706a;--line:#d5dad6;--acc:#1f6b52}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--panel:#1d2320;--fg:#e6ebe8;--mut:#93a09a;--line:#2f3833;--acc:#6cc7a3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141816;--panel:#1d2320;--fg:#e6ebe8;--mut:#93a09a;--line:#2f3833;--acc:#6cc7a3;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1100px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}a{color:var(--acc)}
.sub{color:var(--mut);margin:0 0 22px;max-width:70ch}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px}
a.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--acc);outline:none}
a.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--line)}
.cover{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;background:var(--acc);color:var(--panel);font-size:40px;font-weight:700;letter-spacing:.05em}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.body b{font-size:16px}.body span{color:var(--mut);font-size:14px}
.body time{color:var(--acc);font-size:12px;font-variant-numeric:tabular-nums}
</style></head><body><main>
<div style="font-size:14px;margin-bottom:12px"><a href="../">← Stickman</a></div>
<h1>設定</h1>
<p class="sub">角色、地點、道具、恐龍的設定圖、地圖和產生它們的 prompt。</p>
<div class="list">
  <a class="card" href="../characters/"><img loading="lazy" src="../characters/img/REF_PROF.jpg" alt="">
    <div class="body"><time>2026-11-12</time><b>人物與場景設定（通用）</b><span>每集都用的：HERO、博士、道具、HERO 的房間、實驗室、校園，和它們的設定圖 prompt。</span></div></a>
  <a class="card" href="../dinos/"><img loading="lazy" src="../characters/img/REF_TREX.jpg" alt="">
    <div class="body"><time>2026-11-12</time><b>恐龍系列設定</b><span>EP1 恐龍時代的角色：石頭（甲龍）、各種恐龍和比例、恐龍設定圖的 prompt、沒選用的候選。</span></div></a>
</div>
</main></body></html>

<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Stickman 設定</title>
<style>
:root{--bg:#eef0ee;--panel:#fff;--fg:#1d2420;--mut:#66706a;--line:#d5dad6;--acc:#1f6b52}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--panel:#1d2320;--fg:#e6ebe8;--mut:#93a09a;--line:#2f3833;--acc:#6cc7a3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141816;--panel:#1d2320;--fg:#e6ebe8;--mut:#93a09a;--line:#2f3833;--acc:#6cc7a3;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1100px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}a{color:var(--acc)}
.sub{color:var(--mut);margin:0 0 22px;max-width:70ch}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px}
a.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;color:inherit;text-decoration:none}
a.card.latest{border:3px solid #b4561f;background:color-mix(in srgb,#b4561f 10%,var(--panel))}a.card.latest b{color:#b4561f}
a.card:hover,a.card:focus-visible{border-color:var(--acc);outline:none}
a.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--line)}
.cover{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;text-align:center;background:var(--acc);color:var(--panel);font-size:40px;font-weight:700;letter-spacing:.05em}.pgbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 18px}.pgbox p{margin:0 0 8px}.pgrow{display:flex;flex-wrap:wrap;gap:4px}.pgc{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--fg);background:var(--line)}.pgc.done,.pgc.skip,.pgc.late{background:#2f7d5b;color:#fff}.pgc.wait{background:#c0861a;color:#fff}.pgc.doing{background:#2f6fa8;color:#fff}.tip{position:relative;cursor:help}.tip .bubble{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:min(320px,80vw);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:8px 10px;font-size:13px;font-weight:400;line-height:1.55;text-align:left}.tip:hover .bubble,.tip:focus .bubble,.tip:focus-within .bubble{display:block}.pgc.tip{cursor:help}.pgrow .tip:nth-child(n+15) .bubble{left:auto;right:0}.bubble .bst{font-weight:600}.bubble .bck{color:var(--mut)}.pgd{margin-top:10px}.pgd summary{cursor:pointer;font-weight:600}.tw{overflow-x:auto}.pgt{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}.pgt th,.pgt td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}.pgt td.n{text-align:right}.pgt td.st{white-space:nowrap}.pgt tr.wait td{background:rgba(192,134,26,.12)}.pgt tr.doing td{background:rgba(47,111,168,.10)}.pgbox .tw{overflow:visible}.pglg{font-size:12.5px;color:var(--mut);margin:8px 0 0!important}.cover small{display:block;font-size:17px;font-weight:600;opacity:.85;letter-spacing:.1em;margin-bottom:4px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.body b{font-size:16px}.body span{color:var(--mut);font-size:14px}
.body time{color:var(--acc);font-size:12px;font-variant-numeric:tabular-nums}
hr.sep{border:0;border-top:2px solid var(--line);margin:28px 0 18px}
h2.grp{font-size:15px;color:var(--mut);font-weight:600;margin:0 0 10px;letter-spacing:.04em}
h2.ep{font-size:20px;margin:6px 0 4px;color:var(--fg)}
p.small{margin:14px 0 0;font-size:14px}p.small span{color:var(--mut)}
details.fold{margin-top:28px;border-top:2px solid var(--line);padding-top:12px}details.fold>summary{cursor:pointer;color:var(--mut);font-weight:600;font-size:14px;margin-bottom:12px}
.btns{display:flex;flex-wrap:wrap;gap:8px}a.btn{display:inline-block;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--fg);text-decoration:none;font-size:13.5px}a.btn:hover,a.btn:focus-visible{border-color:var(--acc);color:var(--acc);outline:none}
h3.grp{font-size:14px;color:var(--mut);font-weight:600;margin:18px 0 10px;letter-spacing:.04em;border-left:3px solid var(--acc);padding-left:8px}
</style></head><body><main>
<div style="font-size:14px;margin-bottom:12px"><a href="../">← Stickman</a></div>

</div>
</main></body></html>

bject": "HERO；次要主體 TEEN", "shot_size": "FS", "azimuth": "front", "angle": "eye", "composition": "HERO 全身在中央偏右；TEEN 從畫面左後方露出頭、軀幹和跑動雙腿。TEEN 位於第 7 列，從東側回望時自然落在 HERO 的畫面左側，兩張臉互不遮擋。", "screen_direction": "toward", "action": "HERO 用盡全力朝鏡頭跑，身體失去從容；後方 TEEN 步幅大、頭部穩定，形成速度與體能的反差，正式揭露追兵。", "remedy": "N/A", "imgs": [{"src": "img/EP1-01_v2_codex_03_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/b2b70693-262c-4add-b0d6-8d4bcb1b85dd"}, {"src": "img/EP1-01_v2_codex_03_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/c0fcdb66-40c3-415e-b149-ae8e0bb97f0a"}]}, {"id": "EP1-01-04", "t": 4, "narration": ["牠的嘴巴，比你整個人還要大。", "而且啊，牠越追越近了。"], "subject": "TEEN；次要主體 HERO", "shot_size": "MLS", "azimuth": "side", "angle": "eye", "composition": "TEEN 膝上身體佔據畫面左側與中央，巨大張嘴朝右，尾部被左邊框裁切。HERO 在右側接近出框，只露膝上身體；兩者之間的空隙比上一張明顯縮小。以嘴部局部誇張製造吞噬感，不改變 TEEN 身高。", "screen_direction": "right", "action": "TEEN 張嘴到最大、頭頸朝 HERO 前伸；HERO 在右側奮力逃離。先讓旁白落在張嘴形狀上，再以數位推近強調獵物與牙齒之間縮短的空隙。", "remedy": "嘴巴局部誇張尚未實測。若模型把 TEEN 全身放大，使用 PAIR2_TEEN 鎖定身高，保留張嘴形狀，剪輯時推近嘴與 HERO 之間的空隙，讓旁白和裁切共同完成誇張感。", "imgs": [{"src": "img/EP1-01_v2_codex_04_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/1c33a506-4bb2-40ca-b313-dfafcd16df28"}, {"src": "img/EP1-01_v2_codex_04_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/1cc411e4-3f67-4d6b-9c2b-9eed1e5b8879"}]}, {"id": "EP1-01-05", "t": 5, "narration": ["你一定很想問：", "我到底是怎麼跑到這裡來的？", "這件事呢，要從今天早上開始說起。"], "subject": "HERO；次要主體 TEEN", "shot_size": "FS", "azimuth": "side", "angle": "low", "composition": "HERO 全身懸空在畫面中央偏右，Q6 樹根在他正下方。TEEN 在左側，口鼻向右伸到 HERO 後方但不接觸；TEEN 高處頭頂與低處腿部可被邊框裁切，HERO 輪廓完整。右後方是 M3–S5 空地的暖色亮面，左側是較暗樹幹。", "screen_direction": "right", "action": "HERO 跨根跳躍到最高點，東側前腿伸出、西側後腿彎曲，雙臂上揚，臉朝東，嘴巴驚叫；胸前相機向東甩出，背包仍貼在背後。TEEN 張嘴前伸。整張在此定格，不再切新的反應鏡頭。", "remedy": "先使用已驗證的完整極低角度句子生成。若雙角色跳躍使低角度失效，維持 HERO 全身、樹根和追兵的相對位置，接受較弱的仰視作備選，以剪輯推近加強壓迫感。選定後保存原圖，幕 11 直接重用同一張，不重新生成；同時固定 Q6 懸空 HERO、P6 TEEN、Q8 相機、樹根位置、西方光向、右後空地與所有遮擋關係。", "imgs": [{"src": "img/EP1-01_v2_codex_05_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/33e4e2b0-6d07-44fc-9ad4-2e45ba66adeb"}, {"src": "img/EP1-01_v2_codex_05_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/7d668a4a-18d8-4ecf-8138-e25d32cea898"}]}]}, "claude": {"name": "Claude CLI", "notes": "冷開場的戲劇任務：在觀眾還不知道發生什麼事時，先用「奔跑→環境壓迫→速度→揭露威脅→放大危險→逼近→定格懸念」七拍把人一口氣拉進追逐，最後定格在 HERO 跳起那一瞬間丟出問句，轉場去倒敘。七張圖對應七個敘事功能，景別與視角都為功能服務：①正面極遠景＋逆光夕陽建立環境與孤身奔跑；②正面貼地仰角讓樹「比大樓高」、壓迫感出來；③前側 3/4 中近景貼臉呈現 HERO 的拚命與喘；④側面遠景第一次揭露後面有東西在追（此前三張刻意只畫 HERO，延後揭露）；⑤正面仰角把暴龍的大嘴放到最大、HERO 縮成前景比例尺；⑥後側 3/4 從掠食者背後看出去，用縮小的間距表現「越追越近」；⑦側面定格 HERO 躍過樹根、暴龍大嘴咬在腳跟——這是幕 11 要原樣重現的關鍵錨點，所以用最乾淨好重現的正側面、兩角色都完整入鏡、夕陽從畫左逆光。HERO 全程沿小路（第 6 列）向東（畫面右）跑，暴龍走第 7 列在後方追，間距從 12m 一路縮到貼身。HERO 無帽、滿身泥、胸前小相機、背背包。暴龍大嘴是視覺誇張，不照幾何比例。多數鏡頭用平視；非平視的仰角（②⑤）與後側/側面都寫得出理由。", "shots": [{"id": "EP1-01-01", "t": 1, "narration": ["你正在跑。"], "subject": "HERO（沿泥巴小路奔跑）", "shot_size": "EWS", "azimuth": "front", "angle": "eye", "composition": "HERO 很小在畫面中央偏下，沿小路朝鏡頭跑來；兩側巨樹夾道往畫面上方收攏，小路盡頭是西方夕陽，HERO 逆光成剪影。畫面只有 HERO。", "screen_direction": "toward", "action": "冷開場第一格：孤身一人在黃昏森林小路上全力奔跑，還看不出在逃什麼。", "remedy": "N/A", "imgs": [{"src": "img/EP1-01_v2_claude_01_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/77496b89-2ba1-46b2-b098-fc9033dd309b"}, {"src": "img/EP1-01_v2_claude_01_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/fcec0dd5-28bf-470b-b188-2014d18e365a"}]}, {"id": "EP1-01-02", "t": 2, "narration": ["腳下是爛泥巴，旁邊的樹，比大樓還要高。"], "subject": "HERO 與夾道巨樹（環境為重）", "shot_size": "FS", "azimuth": "front", "angle": "low", "composition": "HERO 在畫面中央全身入鏡，貼地仰角讓他顯得往上衝；兩側與上方是比大樓還高的蘇鐵、銀杏、針葉樹，橙色夕陽天空從樹縫透進來；前景是濕爛的泥巴。畫面只有 HERO。", "screen_direction": "toward", "action": "仰角強調巨樹的壓迫與渺小感，呼應『樹比大樓還高』；HERO 踩著爛泥往鏡頭衝。", "remedy": "低仰角若把 HERO 畫得過大或樹不夠高，回退為平視 FS 並在 prompt 保留巨樹夾道；剪輯時可下壓畫面模擬仰角。", "imgs": [{"src": "img/EP1-01_v2_claude_02_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/abebabe2-3a13-4e83-8225-8db76ae3d425"}, {"src": "img/EP1-01_v2_claude_02_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/ad7a693a-fda3-4fb0-a132-ee13ed1fbf5d"}]}, {"id": "EP1-01-03", "t": 3, "narration": ["你這輩子啊，從來沒跑得這麼快過。"], "subject": "HERO（拚命奔跑的臉與上身）", "shot_size": "MCU", "azimuth": "front34", "angle": "eye", "composition": "HERO 在畫面中央偏左，看得到臉和一側身體，手臂猛擺；背景是被速度模糊掉的夕陽森林小路往右後方退去。畫面只有 HERO。", "screen_direction": "toward", "action": "貼近呈現 HERO 滿臉泥、張口大喘、眼睛瞪大的拚命狀態，把『跑得這麼快』落在角色的身體感上。", "remedy": "MCU 常被畫成到腰、front34 大致可用：若下緣落在腰部，剪輯時推近到胸上即可。", "imgs": [{"src": "img/EP1-01_v2_claude_03_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/b0a059f5-4328-4161-a3b1-cc6afa95e9af"}, {"src": "img/EP1-01_v2_claude_03_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/6e7dc689-26e3-4aaa-926d-34e0996e5aad"}]}, {"id": "EP1-01-04", "t": 4, "narration": ["可是後面那個東西，跑得比你還快。"], "subject": "HERO 與 TEEN（正側面的追逐關係）", "shot_size": "WS", "azimuth": "side", "angle": "eye", "composition": "畫面右邊 HERO 全身往右跑；畫面左後方 TEEN（明顯比人高很多）在同一條小路上追來，嘴開始張；兩側巨樹、橙色夕陽光從畫左來。第一次讓觀眾看到後面有東西。", "screen_direction": "right", "action": "揭露鏡頭：首次把掠食者放進畫面，用正側面一眼交代體型差與追逐方向，暴龍比 HERO 快、間距正在縮。", "remedy": "WS 常被畫成 FS；prompt 已強調大量環境，若仍偏近，接受全身 FS 構圖即可，不影響揭露功能。", "imgs": [{"src": "img/EP1-01_v2_claude_04_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/c32768ed-c3e9-47d8-b40d-59d96333b1ef"}, {"src": "img/EP1-01_v2_claude_04_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/4947e191-5ac2-4c04-a9ce-a18056e23300"}]}, {"id": "EP1-01-05", "t": 5, "narration": ["牠的嘴巴，比你整個人還要大。"], "subject": "TEEN（張到最開的大嘴）；HERO 當前景比例尺", "shot_size": "FS", "azimuth": "front", "angle": "low", "composition": "TEEN 從畫面中央直衝鏡頭、大嘴張到誇張地大、滿口牙，佔滿上半畫面；左下前景是縮得很小的 HERO 在逃；兩側森林、逆光橙色夕陽天空。", "screen_direction": "toward", "action": "放大危險：用貼地仰角＋正面衝鏡，把暴龍的嘴誇張到『比一個人還大』，HERO 縮小當比例尺，威脅感與喜感並存。", "remedy": "嘴若不夠誇張，剪輯時推近到嘴部；低角度若失效改平視仰拍、靠 prompt 維持張嘴衝鏡。", "imgs": [{"src": "img/EP1-01_v2_claude_05_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/0b34bbd2-0fd0-4ce1-9970-aab9e3e87069"}, {"src": "img/EP1-01_v2_claude_05_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/47b87650-ddf8-454b-aaea-98bb4349df2e"}]}, {"id": "EP1-01-06", "t": 6, "narration": ["而且啊，牠越追越近了。"], "subject": "TEEN（掠食者背後視角）；HERO 在前方逃", "shot_size": "MS", "azimuth": "back34", "angle": "eye", "composition": "TEEN 的背與前伸的頭佔滿畫面近景，大嘴張開幾乎咬到前方；畫面前方不遠處是縮小的 HERO 往同一方向逃。兩者都朝畫面深處（遠離鏡頭）跑，間距被壓得很小。", "screen_direction": "away", "action": "逼近感：從暴龍背後看出去，HERO 已在一口之內，用縮短的間距把『越追越近』視覺化。", "remedy": "back34 偶爾會多畫一個 HERO 當前景或畫成純背面、MS 常被畫成膝上：只要維持『暴龍在前景、HERO 在前方近距離』的逼近關係都可接受，必要時剪輯推近。", "imgs": [{"src": "img/EP1-01_v2_claude_06_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/03683e29-0f5b-4d80-932e-0408d2e40183"}, {"src": "img/EP1-01_v2_claude_06_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/881c5379-d720-46f3-bb3e-c39e22554c6b"}]}, {"id": "EP1-01-07", "t": 7, "narration": ["你一定很想問：", "我到底是怎麼跑到這裡來的？", "這件事呢，要從今天早上開始說起。"], "subject": "HERO 躍過樹根的定格瞬間；TEEN 大嘴在後", "shot_size": "WS", "azimuth": "side", "angle": "eye", "composition": "正側面。畫面右邊 HERO 在躍過大樹根的最高點定格（四肢收起、張嘴尖叫）；畫面左、緊貼其後是 TEEN 張到最大的嘴咬向他腳跟。兩角色完整入鏡，夕陽從畫左逆光鑲邊。此為幕 11 原樣重現的關鍵錨點。", "screen_direction": "right", "action": "定格＋懸念＋轉場錨點：最戲劇性的一瞬凍結，旁白丟出『我到底怎麼跑到這裡來的』，接著轉去今天早上。角色姿勢、相機位置、樹根位置、遮擋與光向都要穩定好重現。", "remedy": "WS 常被畫成 FS，可接受兩角色全身入鏡；務必確認 HERO 騰空、樹根在下、TEEN 大嘴緊貼其後都在框內，作為幕 11 的重現基準。", "imgs": [{"src": "img/EP1-01_v2_claude_07_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/0ed41669-954b-46d8-92b5-e68019f53c14"}, {"src": "img/EP1-01_v2_claude_07_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/2c4c7d3c-de99-40f1-9545-5c064ad6da4d"}]}]}}}, {"id": "EP1-01_v5", "narration": ["你正在跑。", "腳下是爛泥巴，旁邊的樹，比大樓還要高。", "你這輩子啊，從來沒跑得這麼快過。", "可是後面那個東西，跑得比你還快。", "牠的嘴巴，比你整個人還要大。", "而且啊，牠越追越近了。", "你一定很想問：", "我到底是怎麼跑到這裡來的？", "這件事呢，要從今天早上開始說起。"], "who": {"claude": {"name": "Claude CLI", "notes": "冷開場，六個原始鏡＋四張「遠一級」加拍。節奏設計：先建立環境與奔跑（1），再貼近感受速度（2），接著揭露追兵（3），放大威脅（嘴，4），壓縮距離（5），最後定格在跳躍瞬間（6，幕11要重現的錨點鏡）。追逐全程沿小路第 6 列往東（畫面右）跑，相機多放在小路南側往北拍，因此『東＝畫面右、西（夕陽）＝畫面左』全片一致；TEEN 從畫面左方逼近、在夕陽下呈逆光剪影，威脅感與連戲都穩定。鏡位刻意交替：側拍（1、2、3、6）建立速度與比例＋正面仰拍（4）壓迫＋背面（5）看縮小的間距，避免連續同構圖。shot 3/4/5/6 同框 HERO 與 TEEN，依規則各加拍一張遠一級。TEEN 的大嘴採視覺誇張，不照幾何尺寸。錨點鏡（06）：HERO 空中跳過 Q6 樹根、四肢張開、泥點凝結；TEEN 於其左後方張口撲來、逆光；構圖、站位、光向務必與幕11一致。", "shots": [{"id": "EP1-01-01", "t": "1", "narration": ["你正在跑。", "腳下是爛泥巴，旁邊的樹，比大樓還要高。"], "subject": "HERO（環境為重點）", "shot_size": "WS", "azimuth": "side", "angle": "low", "composition": "HERO 在畫面中偏左、全身側面往右跑；前景是南側森林的枝葉，背景參天大樹向上超出畫面頂、夕陽橘光；小路由左向右延伸。TEEN 遠在畫面左外，不入鏡。", "screen_direction": "right", "action": "冷開場第一格：滿身泥巴的 HERO 在爛泥小路上狂奔，巨樹壓頂，建立『你正在跑』與森林之巨大。", "remedy": "若低角度把 HERO 畫太大或樹沒頂到畫面外，剪輯時當環境鏡輕微下搖即可；仍可用此構圖。", "imgs": [{"src": "img/EP1-01_v5_claude_01_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/b9c9f860-32f6-4f83-94ff-81644cb9ba37"}, {"src": "img/EP1-01_v5_claude_01_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/f6838178-0a1a-4f23-b549-34aa62876347"}]}, {"id": "EP1-01-02", "t": "2", "narration": ["你這輩子啊，從來沒跑得這麼快過。"], "subject": "HERO", "shot_size": "FS", "azimuth": "side", "angle": "eye", "composition": "HERO 全身側面置中偏左、往右全速衝刺，步幅拉到最大；背景森林與小路橫向掠過以示速度。TEEN 仍在畫面左外。", "screen_direction": "right", "action": "貼近感受速度：側面的長步幅、泥巴飛濺、使盡全力的姿勢，對應『從來沒跑得這麼快』。", "remedy": "N/A", "imgs": [{"src": "img/EP1-01_v5_claude_02_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/18feb64c-9240-4907-80ce-1f3852bf669b"}, {"src": "img/EP1-01_v5_claude_02_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/84d63507-7e2b-464d-8ab9-34f5ec9ffc84"}]}, {"id": "EP1-01-03", "t": "3", "narration": ["可是後面那個東西，跑得比你還快。"], "subject": "HERO 與 TEEN（追逐側面）", "shot_size": "WS", "azimuth": "side", "angle": "eye", "composition": "HERO 全身側面在畫面右側往右跑；TEEN 在畫面左側後方追，兩者皆側面同向往右；TEEN 明顯較高大、正在拉近。前景南側枝葉，背景夕陽森林。", "screen_direction": "right", "action": "揭露追兵：第一次讓觀眾看到青少年暴龍，並用側面同框點出『牠比你大、追得比你快』。", "remedy": "WS 常被畫成 FS；若兩者放不下，改用加拍的 EWS 版 EP1-01-03W。", "imgs": [{"src": "img/EP1-01_v5_claude_03_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/fa214a4e-d5dc-447e-b966-7efb994543b5"}, {"src": "img/EP1-01_v5_claude_03_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/d9582811-ebc5-491a-8d62-f1e087d32576"}]}, {"id": "EP1-01-03W", "t": "3", "narration": ["可是後面那個東西，跑得比你還快。"], "subject": "HERO 與 TEEN（追逐側面）", "shot_size": "EWS", "azimuth": "side", "angle": "eye", "composition": "同 03，但拉遠：兩角色都變小、側面往右，被參天大樹包圍，環境為主、追逐關係清楚。", "screen_direction": "right", "action": "03 的遠一級版，剪輯時可與 03 擇一或接續。", "remedy": "N/A", "imgs": [{"src": "img/EP1-01_v5_claude_3W_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/44404c9a-efe8-4b59-b240-e8b321880da4"}, {"src": "img/EP1-01_v5_claude_3W_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/86df2f0d-1568-49f5-a36a-fac6693e9811"}]}, {"id": "EP1-01-04", "t": "4", "narration": ["牠的嘴巴，比你整個人還要大。"], "subject": "TEEN 的大嘴（HERO 全身當比例）", "shot_size": "FS", "azimuth": "front", "angle": "low", "composition": "HERO 在畫面下方置中、全身朝鏡頭衝、張口驚叫；其正後上方 TEEN 張開的血盆大口誇張放大，佔據畫面上半、滿是牙齒，彷彿比 HERO 整個人還大。仰角增加壓迫。", "screen_direction": "toward", "action": "放大威脅與笑點錯愕：用誇張大嘴對比 HERO 全身，坐實『嘴巴比你整個人還大』。", "remedy": "嘴若沒畫到比 HERO 大，剪輯時推近到嘴部；低角度若失敗則退為平視，靠構圖把大嘴壓在上方。", "imgs": [{"src": "img/EP1-01_v5_claude_04_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/59fc6924-de26-4a72-ad28-977d29d6dbf8"}, {"src": "img/EP1-01_v5_claude_04_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/931dcffc-3cdb-447c-9c07-de0e3383ddc2"}]}, {"id": "EP1-01-04W", "t": "4", "narration": ["牠的嘴巴，比你整個人還要大。"], "subject": "TEEN 的大嘴（HERO 全身當比例）", "shot_size": "WS", "azimuth": "front", "angle": "low", "composition": "同 04 但拉遠：HERO 全身朝鏡頭、周圍留白較多；其後 TEEN 誇張張開的大嘴仍明顯壓在上方。", "screen_direction": "toward", "action": "04 的遠一級版。", "remedy": "同 EP1-01-04。", "imgs": [{"src": "img/EP1-01_v5_claude_4W_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/ced03823-cb1f-4bc1-b8b4-ea01136b1dc2"}, {"src": "img/EP1-01_v5_claude_4W_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/dddf0d39-73e4-4935-b2e2-8745e68b5bba"}]}, {"id": "EP1-01-05", "t": "5", "narration": ["而且啊，牠越追越近了。"], "subject": "TEEN（背面，HERO 在前）", "shot_size": "MLS", "azimuth": "back", "angle": "eye", "composition": "從追逐者後方看：TEEN 的背影佔畫面近景（膝以上），HERO 的背影在前方小路更遠處往右前跑；兩者之間的間距很小且正在縮短。TEEN 偏小路一側不擋住 HERO。", "screen_direction": "away", "action": "用背面鏡呈現縮小中的間距，直接說明『越追越近』。", "remedy": "若恐龍被畫成全身，接受為 FS；若擋住 HERO，改用加拍 FS 版 EP1-01-05W。", "imgs": [{"src": "img/EP1-01_v5_claude_05_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/1ae4fe86-7c31-4315-82b2-f8c8b3615da0"}, {"src": "img/EP1-01_v5_claude_05_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/40384a4c-c256-4919-a58d-6c276b9c0df4"}]}, {"id": "EP1-01-05W", "t": "5", "narration": ["而且啊，牠越追越近了。"], "subject": "TEEN（背面，HERO 在前）", "shot_size": "FS", "azimuth": "back", "angle": "eye", "composition": "同 05 但拉遠：TEEN 全身背影在近景，HERO 背影在前方更遠，兩者之間的小間距與整條小路都看得到。", "screen_direction": "away", "action": "05 的遠一級版。", "remedy": "N/A", "imgs": [{"src": "img/EP1-01_v5_claude_5W_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/a8fec8ea-10b2-4198-9086-79a190b5c765"}, {"src": "img/EP1-01_v5_claude_5W_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/d06ae68f-6080-4f74-9a24-c7f90f2918af"}]}, {"id": "EP1-01-06", "t": "6", "narration": ["你一定很想問：", "我到底是怎麼跑到這裡來的？", "這件事呢，要從今天早上開始說起。"], "subject": "HERO 與 TEEN（定格跳躍）", "shot_size": "WS", "azimuth": "side", "angle": "eye", "composition": "側面定格：HERO 在畫面右側騰空、四肢張開往右躍過畫面下緣的樹根，泥點凝結在空中；TEEN 在畫面左後方張口撲咬、定格。夕陽在畫面左方（西），TEEN 逆光成橘色剪影，HERO 受側逆光。此為幕11要重現的錨點鏡。", "screen_direction": "right", "action": "全片定格高潮：HERO 跳躍最高點、恐懼至極；TEEN 血盆大口就在身後；旁白提問『我到底是怎麼跑到這裡來的』，隨後倒帶回今早。", "remedy": "WS 若放不下恐龍張嘴，用加拍 EWS 版 EP1-01-06W；此為幕11要重現的錨點鏡，HERO 跳躍姿勢、樹根位置、TEEN 張口位置、夕陽來自畫面左方等務必保持一致。", "imgs": [{"src": "img/EP1-01_v5_claude_06_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/310d26a1-c01f-45e4-b9f0-6b4e0698f89a"}, {"src": "img/EP1-01_v5_claude_06_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/d2fd2adb-2293-436d-a721-8cced187fc94"}]}, {"id": "EP1-01-06W", "t": "6", "narration": ["你一定很想問：", "我到底是怎麼跑到這裡來的？", "這件事呢，要從今天早上開始說起。"], "subject": "HERO 與 TEEN（定格跳躍）", "shot_size": "EWS", "azimuth": "side", "angle": "eye", "composition": "同 06 但拉遠：HERO 空中、TEEN 張口都變小，被參天森林包圍，夕陽在畫面左方；環境為主、定格關係清楚。", "screen_direction": "right", "action": "錨點鏡的遠景版，保持與 06 相同構圖與光向。", "remedy": "錨點鏡的遠景版，保持與 EP1-01-06 相同構圖與光向。", "imgs": [{"src": "img/EP1-01_v5_claude_6W_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/71ec23ae-848f-400e-8b54-49f6f1e848ab"}, {"src": "img/EP1-01_v5_claude_6W_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/9aee2379-50e1-40ab-93e2-33f5b76fe742"}]}]}}}, {"id": "EP1-02_v5", "narration": ["話說，你的書桌上，擺著三樣東西。", "第一樣，是帳單。", "電費、房租、學貸，每一張都蓋著紅紅的逾期章。", "第二樣，是畢業學分不足的通知。", "沒錯，你已經延畢兩年了。", "（停）", "現在最關心你的人，是系辦的助理。", "第三樣呢，是一支手機，跟一把電擊槍。", "那把電擊槍，是上次打工的時候，博士給你的。", "偏偏房間裡，只有一個插座。", "（停）", "你當然是拿來充手機啦。", "這時候，手機亮了。", "是博士傳來的訊息：", "又有工作囉，時薪很不錯，記得帶電擊槍。", "其實啊，這已經不是你第一次幫博士打工了。", "上一次，他也說會付錢。", "（停）", "你看看桌上那一疊帳單。", "唉，還是去吧。"], "who": {"claude": {"name": "Claude CLI", "notes": "整幕只有 HERO 一人，重點是用「空間建立 → 道具插入鏡頭 → HERO 定格反應」的交叉剪接，把慘況一條條鋪陳，並在三個笑點（系辦助理、拿來充手機、他上次也說會付錢）前用 HERO 的呆臉定格做節奏。開場用 WS 把破套房、清晨百葉窗光、書桌三樣東西一次建立；接著 02–03 兩張俯角插入鏡頭特寫帳單的紅色逾期章與學分不足通知的紅色警告圖示；04 切到 HERO 正面呆臉打笑點一；05 插入手機＋電擊槍；06 插入「只有一個插座」的牆插座（充電線接到手機）打笑點二；07 手機螢幕發亮的 ECU 帶出博士訊息（無字，用對話泡泡圖示）；08 HERO 舉著手機的半信半疑反應打笑點三；09 用過肩俯角把 HERO 與那疊帳單連在一起（呼應決定）；10 WS 收尾，HERO 起身走向門口，當作接第 3 幕的轉場。全片無恐龍，不需要加拍遠一級。插入鏡頭沒有角色，cast 留空。物件特寫沒有實測句，prompt 用 close insert shot 描述，remedy 註明剪輯時再推近。", "shots": [{"id": "EP1-02-01", "t": "1", "narration": ["話說，你的書桌上，擺著三樣東西。"], "subject": "HERO 與整間套房", "shot_size": "WS", "azimuth": "back34", "angle": "eye", "composition": "HERO 坐在畫面中央偏左的書桌椅上，背對鏡頭面朝北牆書桌；背景是北牆百葉窗與清晨光、滿桌道具；畫面左邊是沒整理的床，右邊是空牆面。", "screen_direction": "away", "action": "HERO 懶散坐在椅子上，背影，望著書桌上三樣東西；清晨光從百葉窗灑進來，建立破舊小套房的氛圍。", "remedy": "WS 常被畫成 FS；若環境不夠大，剪輯時稍微拉遠或接受較滿的構圖。", "imgs": [{"src": "img/EP1-02_v5_claude_01_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/3fc4f390-256b-452d-ad1b-f663d2c9592d"}, {"src": "img/EP1-02_v5_claude_01_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/1b729ce8-03fd-4c52-bf1c-3894a818f991"}]}, {"id": "EP1-02-02", "t": "1", "narration": ["第一樣，是帳單。", "電費、房租、學貸，每一張都蓋著紅紅的逾期章。"], "subject": "帳單堆（蓋滿紅色逾期章）", "shot_size": "CU", "azimuth": "front", "angle": "high", "composition": "整疊帳單填滿畫面，俯角看下去；每張都蓋著鮮紅的圓形逾期章，邊緣露出一點磨舊的木桌面。", "screen_direction": "toward", "action": "靜態插入鏡頭，強調一張張蓋滿紅章的帳單，呈現債務壓力。", "remedy": "若紅章不夠滿版，剪輯時推近到 CU／ECU。", "imgs": [{"src": "img/EP1-02_v5_claude_02_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/9684f4e3-eb6f-400b-874c-b8b257afc428"}, {"src": "img/EP1-02_v5_claude_02_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/8ff8899d-d017-4afb-9b1c-a39aa552db0c"}]}, {"id": "EP1-02-03", "t": "1", "narration": ["第二樣，是畢業學分不足的通知。", "沒錯，你已經延畢兩年了。"], "subject": "畢業學分不足通知（紅色警告圖示）", "shot_size": "CU", "azimuth": "front", "angle": "high", "composition": "一張通知單填滿畫面中央，俯角看下去，印著一個大大的紅色警告圖示（紅色三角驚嘆號），無任何文字，四周是木桌面。", "screen_direction": "toward", "action": "靜態插入鏡頭，紅色警告圖示強調延畢的壞消息。", "remedy": "若畫面太空，剪輯時推近到 CU。", "imgs": [{"src": "img/EP1-02_v5_claude_03_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/49c823d9-47a9-4f5c-bf25-3d975fba21c4"}, {"src": "img/EP1-02_v5_claude_03_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/f67b0444-6ac6-4215-9cef-107fa52eef21"}]}, {"id": "EP1-02-04", "t": "1", "narration": ["（停）", "現在最關心你的人，是系辦的助理。"], "subject": "HERO（呆臉反應）", "shot_size": "MCU", "azimuth": "front", "angle": "eye", "composition": "HERO 正面佔滿畫面中央，胸部以上；背景是模糊的書桌與清晨光。", "screen_direction": "toward", "action": "HERO 一臉平板、放空地直視鏡頭，配合笑點前的停頓與『最關心你的人是系辦助理』。", "remedy": "MCU 常被畫成到腰；剪輯時推近到胸上。", "imgs": [{"src": "img/EP1-02_v5_claude_04_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/0b6596aa-0c1e-4a8f-a9a9-19820afe5dcf"}, {"src": "img/EP1-02_v5_claude_04_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/82d08fe5-1931-49e4-977f-9e690a1f55f6"}]}, {"id": "EP1-02-05", "t": "1", "narration": ["第三樣呢，是一支手機，跟一把電擊槍。", "那把電擊槍，是上次打工的時候，博士給你的。"], "subject": "手機（插著充電線）與電擊槍", "shot_size": "CU", "azimuth": "front", "angle": "high", "composition": "俯角看桌面，手機（接著充電線）在一側、電擊槍在另一側並排填滿畫面，背景是磨舊木桌。", "screen_direction": "toward", "action": "靜態插入鏡頭，把第三樣『手機＋電擊槍』一起呈現，電擊槍造型對齊道具圖。", "remedy": "若兩物件太小，剪輯時推近。", "imgs": [{"src": "img/EP1-02_v5_claude_05_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/f5c59f3e-6df0-4f8e-b42d-4985c87d4197"}, {"src": "img/EP1-02_v5_claude_05_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/a5d39a86-cb72-497f-a6eb-85c506729af8"}]}, {"id": "EP1-02-06", "t": "1", "narration": ["偏偏房間裡，只有一個插座。", "（停）", "你當然是拿來充手機啦。"], "subject": "牆上唯一的插座（插著充電線）", "shot_size": "CU", "azimuth": "front", "angle": "eye", "composition": "畫面中央是素白牆面上靠近地板的唯一一個插座，平視正對；一條充電線插在上面，往畫面左邊延伸（通向手機）。", "screen_direction": "toward", "action": "靜態插入鏡頭，孤零零一個插座＋一條充電線，鋪『只有一個插座卻拿來充手機』的笑點。", "remedy": "若插座太小，剪輯時推近到 CU。", "imgs": [{"src": "img/EP1-02_v5_claude_06_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/5020d887-7f3a-43b7-9dd3-867fdcb1e4fa"}]}, {"id": "EP1-02-07", "t": "2", "narration": ["這時候，手機亮了。", "是博士傳來的訊息：", "又有工作囉，時薪很不錯，記得帶電擊槍。"], "subject": "手機螢幕（亮起的訊息通知）", "shot_size": "ECU", "azimuth": "front", "angle": "high", "composition": "俯角極近看手機，螢幕突然發亮填滿畫面，螢幕上只有一個發光的對話泡泡通知圖示，無任何文字；旁邊露出一點充電線。", "screen_direction": "toward", "action": "手機螢幕瞬間亮起，一則訊息通知跳出，製造『博士來訊』的轉折。", "remedy": "若螢幕不夠滿版，剪輯時推近。", "imgs": [{"src": "img/EP1-02_v5_claude_07_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/b869886f-fb7b-495f-8464-4de10bcaa55b"}, {"src": "img/EP1-02_v5_claude_07_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/ac752545-a2b1-4353-843f-120246fad681"}]}, {"id": "EP1-02-08", "t": "2", "narration": ["其實啊，這已經不是你第一次幫博士打工了。", "上一次，他也說會付錢。", "（停）"], "subject": "HERO（舉手機、半信半疑）", "shot_size": "MCU", "azimuth": "front34", "angle": "eye", "composition": "HERO 在畫面中央偏一側，胸部以上，一手舉著發亮的手機看，臉朝鏡頭前側 3/4；背景是書桌與清晨光。", "screen_direction": "toward", "action": "HERO 舉著手機、一臉狐疑、不太相信地看著訊息，配合『上一次他也說會付錢』的吐槽。", "remedy": "MCU 常被畫成到腰；剪輯時推近到胸上。", "imgs": [{"src": "img/EP1-02_v5_claude_08_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/a22e9a60-040a-4602-af40-7d523cad18be"}, {"src": "img/EP1-02_v5_claude_08_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/dc3c0b0c-84dd-49b6-8fda-57e821056117"}]}, {"id": "EP1-02-09", "t": "3", "narration": ["你看看桌上那一疊帳單。"], "subject": "HERO（過肩看帳單）", "shot_size": "MS", "azimuth": "back", "angle": "high", "composition": "HERO 的頭與肩在畫面近景（偏左），背對鏡頭；俯角越過他的肩膀看向書桌上那疊蓋滿紅章的帳單（畫面中景偏右）。", "screen_direction": "away", "action": "HERO 低頭看著那一疊帳單，過肩鏡頭把『人』與『帳單』連在一起，呼應他即將做的決定。", "remedy": "若帳單被 HERO 擋住，剪輯時微調或接受較小的帳單面積。", "imgs": [{"src": "img/EP1-02_v5_claude_09_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/970f1796-a69e-4c6a-b1d9-da054514cc06"}, {"src": "img/EP1-02_v5_claude_09_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/520d6b17-069d-4d1f-9c21-bb790e277410"}]}, {"id": "EP1-02-10", "t": "4", "narration": ["唉，還是去吧。"], "subject": "HERO（起身走向門口）", "shot_size": "WS", "azimuth": "back34", "angle": "eye", "composition": "HERO 在畫面中景，背對並偏側，從書桌離開、橫越凌亂房間走向遠處角落的房門；畫面左邊是床、右後方是門，清晨光仍從百葉窗灑入。", "screen_direction": "away", "action": "HERO 無奈站起身，慢慢走離書桌、朝門口走去，當作離開房間、接第 3 幕的轉場。", "remedy": "WS 常被畫成 FS；若環境不夠大，剪輯時稍微拉遠或接受較滿的構圖。", "imgs": [{"src": "img/EP1-02_v5_claude_10_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/e342d896-31b5-4c1e-b37f-27c52281cb89"}, {"src": "img/EP1-02_v5_claude_10_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/b9ebd4c1-cfe9-4ad7-8e87-2aa65bd8bc5a"}]}]}}}, {"id": "EP1-03_v5", "narration": ["博士的實驗室，就在學校裡。", "校務大樓旁邊，一間老舊的木頭小屋。", "門上那些警告標誌啊，你一個都不想知道是什麼意思。"], "who": {"claude": {"name": "Claude CLI", "notes": "這是一幕過場戲，功能是交代博士實驗室的位置、並用門上的警告標誌埋下笑點與懸念。只有 HERO 一個角色、沒有恐龍，所以不需要加拍遠一級。三句旁白對三個漸進景別，形成「大環境→鎖定小屋→貼近那扇不祥的門」的三拍節奏。第1張用空拍極遠景建立整個校園與相對位置（校務大樓在西、木屋在東），HERO 很小地走在步道上，呼應『實驗室就在學校裡』。第2張拉到平視遠景鎖定那間老舊兩層木屋，顯出它又舊又格格不入，HERO 小小地走上通往門口的岔路。第3張走到門口，刻意用背面全景：HERO 背對鏡頭、仰頭看著貼滿警告貼紙的門，小小的身影面對一整面不祥的門，製造脆弱感與笑點；剪輯時可在這張上推近到貼紙群，承接旁白的吐槽。光線統一為早晨東方日照，鏡頭都朝北拍，所以陽光一律來自畫面右側。警告標誌一律用危險圖示（骷髏、輻射、生化、閃電、驚嘆三角），不含任何文字，符合畫風規則。", "shots": [{"id": "EP1-03-01", "t": "1", "narration": ["博士的實驗室，就在學校裡。"], "subject": "校園環境（校務大樓與老舊木造小屋）；HERO 很小地走在步道上往小屋走", "shot_size": "EWS", "azimuth": "front", "angle": "aerial", "composition": "畫面左上是白色石材校務大樓（只見東端，往西延伸出框）；其東邊隔一小塊草地是老舊兩層木造小屋，位於畫面中上偏右；一條東西向步道橫過畫面中段，有一小段岔路通到小屋門口；前景是草地與幾棵樹；HERO 極小，位於畫面下半、步道上，背對鏡頭往北（上）朝小屋走", "screen_direction": "away", "action": "HERO 一個小點沿步道往小屋走，建立『實驗室藏在校園裡某處』的全景資訊", "remedy": "N/A", "imgs": [{"src": "img/EP1-03_v5_claude_01_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/15d1ba58-24bc-40d6-9b61-ca303c20809b"}, {"src": "img/EP1-03_v5_claude_01_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/c37638d3-a117-42c7-8005-7bd2490b9414"}]}, {"id": "EP1-03-02", "t": "2", "narration": ["校務大樓旁邊，一間老舊的木頭小屋。"], "subject": "老舊兩層木造小屋（主體）；HERO 小小地走上門前岔路（次要）", "shot_size": "WS", "azimuth": "front", "angle": "eye", "composition": "老舊木屋位於畫面中央、佔滿上半到大半畫面，南牆那扇貼滿警告貼紙的門朝向鏡頭；畫面左緣是白色校務大樓的東端；兩者之間一小塊草地；前景是橫過的校園步道；HERO 小小地在畫面中央偏下、背對鏡頭走上通往門口的岔路", "screen_direction": "away", "action": "鎖定那間又舊又突兀的木屋，HERO 正走上岔路靠近它，呈現『就是這一間』", "remedy": "WS 實測常被畫成 FS（主體偏大、環境偏少）；若生成結果小屋塞太滿，剪輯時可當 FS 使用，或重生時再加大環境留白。", "imgs": [{"src": "img/EP1-03_v5_claude_02_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/2f0b12f6-80b0-4359-9048-43f9880ea91d"}, {"src": "img/EP1-03_v5_claude_02_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/8a0ac438-8711-49f1-bde5-43e9adb0b486"}]}, {"id": "EP1-03-03", "t": "3", "narration": ["門上那些警告標誌啊，你一個都不想知道是什麼意思。"], "subject": "HERO（背面）站在貼滿警告貼紙的小屋門前", "shot_size": "FS", "azimuth": "back", "angle": "eye", "composition": "HERO 居中、背對鏡頭、仰頭看門，佔畫面大半高度；他身後（上方與兩側）是老舊木屋的木板牆與那扇貼滿危險圖示的門，填滿整個背景；陽光從畫面右側（東）打來，把 HERO 的影子投在門上", "screen_direction": "away", "action": "HERO 背對鏡頭站定在門前，仰頭盯著一整面警告貼紙，一手半舉、猶豫要不要敲——小小身影對上不祥的門，笑點與懸念；剪輯時可在此圖推近讀那堆貼紙", "remedy": "若 back-view 單角色版多畫出一個前景 HERO，重生時強調『only one character, seen from behind』；欲強調門上貼紙時，剪輯以此靜圖往門面推近當作插入鏡頭。", "imgs": [{"src": "img/EP1-03_v5_claude_03_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/03a8b8e9-d2c0-4b98-8905-22fbc6be98c2"}, {"src": "img/EP1-03_v5_claude_03_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/b8b4b309-216f-4502-afdf-206a1f200d18"}]}]}}}, {"id": "EP1-04_v5", "narration": ["博士說，這一次，要去白堊紀。", "六千六百五十萬年前的北美洲喔。", "他講得超級興奮。", "可是你一直低頭滑手機，連頭都沒抬一下。", "你只問了他一個問題：", "為什麼不去侏羅紀呢？", "畢竟那部電影，你看了五遍耶。", "這下博士可不高興了。", "他說：侏羅紀根本就沒有暴龍啦。", "你最喜歡的那部恐龍電影，光是片名就在騙你。", "博士在黑板上，畫了一條長長的時間線。", "侏羅紀，是從兩億年前，到一億四千五百萬年前，劍龍就住在這一段。", "再來是白堊紀，一直到六千六百萬年前，暴龍排在最後面。", "接著，博士開始上課了。", "第一課：越大隻的，跑得越慢。", "他一手拿著大恐龍，一手拿著小恐龍。", "大的這隻，身高是小的兩倍。", "可是牠的腿能撐住的力氣，只多了四倍，", "體重卻足足重了八倍。", "腿撐不住，當然就跑不快啦。", "（停）", "而你，在滑手機。", "第二課：跑最快的，不是最大隻的，也不是最小隻的。", "是不大不小、剛剛好的，大概九十公斤左右。", "只要超過兩千七百公斤，就會被自己的體重拖慢。", "（停）", "你打了一個大哈欠。", "第三課：跑得越快，就越難轉彎。", "你看獵豹追羚羊，三次裡面，羚羊可以逃掉兩次呢。", "出發前，博士推過來三樣東西。", "一台相機、一個樣本袋，", "還有一個用膠帶纏得亂七八糟的手環。", "他問你：電擊槍有帶嗎？你拍拍口袋：有啦。", "這個手環上面，只有一顆按鈕。", "按下去，就可以回家。", "博士還說：沒拍到暴龍、沒帶回牙齒，就不付錢喔。", "博士還給了你一本生存指南。", "又厚，又重。", "你看看指南，再看看旁邊那包洋芋片。", "你選了洋芋片。", "把它跟手環一起，塞進背包裡。", "博士說，等你準備好了，他再拉下拉桿。", "（停）", "結果他直接就拉了。", "機器沒反應。", "博士往機器上，用力拍了一下。"], "who": {"claude": {"name": "Claude CLI", "notes": "全幕室內行前教育，核心喜劇是「博士超熱血上課 vs HERO 全程低頭滑手機」的對比。分三個表演區，各自建立 180° 線：西牆黑板教學區（鏡1–10，相機多在東／南側看向西牆）、中央發裝備區（鏡11–17）、北牆時光機與紅色拉桿區（鏡18–20）。博士多用 front／front34 平視，帶到他的表情與教具（玩具恐龍、碼表、拉桿）；HERO 的三個反應節拍（滑手機、打哈欠、選洋芋片）用 MCU／MS 當笑點。黑板時間線與手環按鈕用較近景別交代資訊，但依畫風規則畫面無任何文字，時間線是一條長線加恐龍塗鴉、海報是無字圖像。結尾「博士直接拉拉桿→機器沒反應→用力拍一下」用同機位靜止製造反高潮，當作接往幕5的錨點。全幕沒有大恐龍實體入鏡（博士手上拿的是玩具恐龍，不算 TREX／TEEN／ANKY），故不需加拍遠一級，所有 variant_of 皆為 N/A。", "shots": [{"id": "EP1-04-01", "t": "1", "narration": ["博士說，這一次，要去白堊紀。", "六千六百五十萬年前的北美洲喔。", "他講得超級興奮。"], "subject": "PROF（兼建立整間實驗室與 HERO 的對比）", "shot_size": "WS", "azimuth": "front34", "angle": "eye", "composition": "前景畫面左：HERO 低頭滑手機；背景畫面中偏右：PROF 站在綠色黑板前雙手舉高；黑板與電影海報構成西牆背景；水泥地板。", "screen_direction": "toward", "action": "博士手舞足蹈地宣布目的地，HERO 在前景對他完全視而不見、只顧滑手機，一張圖建立全場喜劇反差。", "remedy": "WS 可能被畫成接近 FS；剪輯時當建立全景使用或稍微外推保留環境即可。", "imgs": [{"src": "img/EP1-04_v5_claude_01_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/ea0172c0-6df1-4094-85fa-dbd0e405afd6"}, {"src": "img/EP1-04_v5_claude_01_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/4277e66f-13c3-41bd-a908-19645a89175d"}]}, {"id": "EP1-04-02", "t": "1", "narration": ["可是你一直低頭滑手機，連頭都沒抬一下。"], "subject": "HERO", "shot_size": "MCU", "azimuth": "front", "angle": "eye", "composition": "HERO 置中，低頭盯著手機；手機微光打在臉上；背景是模糊的水泥地與牆。", "screen_direction": "off_down", "action": "切到 HERO 特寫，頭完全低下、拇指滑手機，對博士的熱情零反應，強調『連頭都沒抬』。", "remedy": "MCU 可能被畫成到腰；剪輯時由此推近到胸上即可。", "imgs": [{"src": "img/EP1-04_v5_claude_02_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/a00facc4-21b3-4b19-8bc0-b6dbd069a8c8"}]}, {"id": "EP1-04-03", "t": "2", "narration": ["你只問了他一個問題：", "為什麼不去侏羅紀呢？", "畢竟那部電影，你看了五遍耶。"], "subject": "HERO", "shot_size": "MS", "azimuth": "side", "angle": "eye", "composition": "HERO 側面置中，難得抬起頭往畫面左邊（博士方向）發問；手機仍在手上；背景水泥地。", "screen_direction": "off_left", "action": "HERO 全幕唯一一次抬頭，側臉張嘴問出那個問題，手還沒放下手機，呈現他只關心電影。", "remedy": "MS 可能被畫成膝上景；剪輯時由腰部往上裁到需要景別即可。", "imgs": [{"src": "img/EP1-04_v5_claude_03_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/8518dbc0-446b-4bcb-ba4a-04c944001177"}, {"src": "img/EP1-04_v5_claude_03_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/243af667-7fe0-4ddd-ab0e-a7790b9818cf"}]}, {"id": "EP1-04-04", "t": "3", "narration": ["這下博士可不高興了。", "他說：侏羅紀根本就沒有暴龍啦。", "你最喜歡的那部恐龍電影，光是片名就在騙你。"], "subject": "PROF", "shot_size": "MCU", "azimuth": "front34", "angle": "eye", "composition": "PROF 置中偏左，皺眉伸出食指糾正，往畫面 : "side", "angle": "high", "composition": "從斜上方俯看 HERO，他低頭滑手機完全專注；手機在畫面中央偏下；周圍水泥地。", "screen_direction": "off_down", "action": "笑點節拍：停頓後切到 HERO，他對第一課毫無反應，只顧滑手機；輕微俯角強化他被晾在一旁。", "remedy": "high 只會呈現輕微俯視、MCU 可能偏到腰；剪輯時裁切強化俯角與景別。", "imgs": [{"src": "img/EP1-04_v5_claude_07_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/57862f46-e9ed-4434-ba14-4bad656e9e93"}, {"src": "img/EP1-04_v5_claude_07_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/12ec341b-d28e-4b18-8a98-07b4b2aab9b7"}]}, {"id": "EP1-04-08", "t": "6", "narration": ["第二課：跑最快的，不是最大隻的，也不是最小隻的。", "是不大不小、剛剛好的，大概九十公斤左右。", "只要超過兩千七百公斤，就會被自己的體重拖慢。"], "subject": "PROF", "shot_size": "MS", "azimuth": "front", "angle": "eye", "composition": "PROF 正面置中，雙手在胸前比出『不大不小、剛剛好』的距離；背景水泥地。", "screen_direction": "toward", "action": "第二課：博士正對鏡頭，用雙手比一個中等大小，再張開比超重，講最快的是不大不小的。", "remedy": "MS 可能被畫成膝上；剪輯時裁到需要景別。", "imgs": [{"src": "img/EP1-04_v5_claude_08_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/1cc190f7-145e-4a38-a098-b797097ef468"}]}, {"id": "EP1-04-09", "t": "6", "narration": ["（停）", "你打了一個大哈欠。"], "subject": "HERO", "shot_size": "MCU", "azimuth": "front", "angle": "eye", "composition": "HERO 正面置中，頭往後仰、嘴張大打哈欠、眼睛瞇起；手機仍在手上；背景水泥地。", "screen_direction": "off_up", "action": "第二個笑點節拍：停頓後 HERO 打一個大哈欠，表示他對第二課一樣沒興趣。", "remedy": "MCU 可能被畫成到腰；剪輯時推近到胸上。", "imgs": [{"src": "img/EP1-04_v5_claude_09_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/79359775-e255-4f31-a8ff-cbfd5f040bd1"}]}, {"id": "EP1-04-10", "t": "7", "narration": ["第三課：跑得越快，就越難轉彎。", "你看獵豹追羚羊，三次裡面，羚羊可以逃掉兩次呢。"], "subject": "PROF", "shot_size": "FS", "azimuth": "side", "angle": "eye", "composition": "PROF 全身置中，身體誇張地往一側急轉、一手扶住下背，表情痛苦（差點閃到腰）；空地背景，水泥地。", "screen_direction": "left", "action": "第三課示範：博士在空地上示範急轉彎，身體一扭差點閃到腰，一手趕緊扶腰，全身喜劇動作。", "remedy": "N/A", "imgs": [{"src": "img/EP1-04_v5_claude_10_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/a52de20d-1326-41d4-9338-ff5e4f453f6a"}, {"src": "img/EP1-04_v5_claude_10_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/9169a1b2-934b-478a-ad0c-63c685e78be0"}]}, {"id": "EP1-04-11", "t": "8", "narration": ["出發前，博士推過來三樣東西。", "一台相機、一個樣本袋，", "還有一個用膠帶纏得亂七八糟的手環。"], "subject": "PROF（兼三樣裝備）", "shot_size": "WS", "azimuth": "side", "angle": "eye", "composition": "PROF 在畫面左、HERO 在畫面右，兩人側面相對；中間一台小推車／桌面上放著相機、樣本袋、膠帶纏的手環三樣；背景水泥地。", "screen_direction": "right", "action": "博士把三樣裝備往 HERO（畫面右）推過去，HERO 只斜眼一瞥仍在滑手機；側面兩人中間擺三件道具，資訊清楚。", "remedy": "WS 可能被畫成接近 FS；剪輯時當環境兩人鏡用或裁切即可。", "imgs": [{"src": "img/EP1-04_v5_claude_11_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/a138f990-1c60-41d9-8f09-d5d3ffeee4ea"}, {"src": "img/EP1-04_v5_claude_11_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/b20c77e0-2605-4c8d-9e13-f74d3d2c8ae7"}]}, {"id": "EP1-04-12", "t": "8", "narration": ["他問你：電擊槍有帶嗎？你拍拍口袋：有啦。"], "subject": "HERO", "shot_size": "MS", "azimuth": "side", "angle": "eye", "composition": "HERO 側面置中，一手仍握手機，另一手拍拍褲子口袋；背景水泥地。", "screen_direction": "left", "action": "回答『電擊槍有啦』：HERO 一派輕鬆地拍拍口袋示意有帶，眼睛幾乎沒離開手機。", "remedy": "MS 可能被畫成膝上；剪輯時裁到需要景別。", "imgs": [{"src": "img/EP1-04_v5_claude_12_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/c6f70bf9-420f-4386-b6b3-6c8118b32ca2"}, {"src": "img/EP1-04_v5_claude_12_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/38dd689e-9e51-4beb-8252-aa8adc8f3651"}]}, {"id": "EP1-04-13", "t": "8", "narration": ["這個手環上面，只有一顆按鈕。", "按下去，就可以回家。"], "subject": "回家手環（道具插入鏡頭）", "shot_size": "CU", "azimuth": "front", "angle": "high", "composition": "畫面中央一個用膠帶纏得亂七八糟的手環，上面只有一顆紅色按鈕；HERO 的一隻手托著它，另一隻拇指懸在按鈕上方；背景虛化。", "screen_direction": "toward", "action": "插入鏡頭強調道具與規則：手環只有一顆按鈕，拇指懸在上方，點出『按下去就能回家』。", "remedy": "物件 CU 通常可行；若手環被畫得太小、太遠，剪輯時再推近到只剩手環與按鈕。", "imgs": []}, {"id": "EP1-04-14", "t": "9", "narration": ["博士還說：沒拍到暴龍、沒帶回牙齒，就不付錢喔。"], "subject": "PROF", "shot_size": "MCU", "azimuth": "front34", "angle": "eye", "composition": "PROF 置中偏左，一手搖食指、另一手拇指食指搓錢的手勢，表情嚴肅往畫面右方說；背景水泥地。", "screen_direction": "toward", "action": "博士定下條件：搖食指加搓錢手勢強調『沒拍到暴龍、沒帶回牙齒就不付錢』，建立任務賭注。", "remedy": "MCU 可能被畫成到腰；剪輯時推近到胸上。", "imgs": []}, {"id": "EP1-04-15", "t": "10", "narration": ["博士還給了你一本生存指南。", "又厚，又重。"], "subject": "PROF（過肩自 HERO）", "shot_size": "MS", "azimuth": "front", "angle": "eye", "composition": "前景畫面右是 HERO 的肩背（背對），中景置中是 PROF 正面雙手捧著一本超厚超重的書遞過來、手臂被壓得往下沉；背景水泥地。", "screen_direction": "toward", "action": "過 HERO 肩的鏡頭：博士吃力地雙手捧出一本又厚又重的生存指南遞給 HERO，強調它的份量。", "remedy": "MS 可能被畫成膝上；剪輯時裁到需要景別。若過肩前景被省略，單人 PROF 捧書也可接受。", "imgs": [{"src": "img/EP1-04_v5_claude_15_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/74489b01-8925-4774-8bd1-7380b451e5f0"}, {"src": "img/EP1-04_v5_claude_15_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/84a0353d-797c-4ae1-a9d0-7216338c8f09"}]}, {"id": "EP1-04-16", "t": "10", "narration": ["你看看指南，再看看旁邊那包洋芋片。"], "subject": "HERO", "shot_size": "MS", "azimuth": "front34", "angle": "eye", "composition": "HERO 前側 3/4 置中，一手拎著厚厚的生存指南、眼神飄向旁邊推車上一包洋芋片；手機夾在腋下或另一手；背景水泥地。", "screen_direction": "off_down", "action": "抉擇鋪陳：HERO 一手掂著又厚又重的指南，視線在指南和一包洋芋片之間來回，露出『在考慮』的表情。", "remedy": "MS 可能被畫成膝上；剪輯時裁到需要景別。", "imgs": []}, {"id": "EP1-04-17", "t": "10", "narration": ["你選了洋芋片。", "把它跟手環一起，塞進背包裡。"], "subject": "HERO", "shot_size": "MS", "azimuth": "front", "angle": "eye", "composition": "HERO 正面置中，抓起那包洋芋片、連同手環塞進背包；厚指南被丟在旁邊推車上；背景水泥地。", "screen_direction": "toward", "action": "抉擇笑點收尾：HERO 乾脆選了洋芋片，連同回家手環塞進背包，生存指南被丟在一邊。", "remedy": "MS 可能被畫成膝上；剪輯時裁到需要景別。", "imgs": []}, {"id": "EP1-04-18", "t": "11", "narration": ["博士說，等你準備好了，他再拉下拉桿。", "（停）"], "subject": "HERO（兼時光機圓環與拉桿）", "shot_size": "WS", "azimuth": "front", "angle": "eye", "composition": "HERO 站在畫面中央的金屬圓環裡、背著背包仍低頭看手機；畫面右邊 PROF 一手搭在北牆的紅色大拉桿上，暫停著；北牆背景。", "screen_direction": "toward", "action": "出發定格前的鋪陳：HERO 進了時光機圓環，博士手扶拉桿、嘴上說『準備好再拉』——停頓製造期待。", "remedy": "WS 可能被畫成接近 FS；剪輯時當環境鏡使用或稍微外推保留圓環與拉桿。", "imgs": []}, {"id": "EP1-04-19", "t": "11", "narration": ["結果他直接就拉了。", "機器沒反應。"], "subject": "PROF（兼時光機圓環與拉桿）", "shot_size": "WS", "azimuth": "front", "angle": "eye", "composition": "與上一張幾乎相同機位：HERO 仍站在中央圓環裡；畫面右的 PROF 已把紅色拉桿整個往下拉；圓環毫無光效、一片安靜。", "screen_direction": "off_down", "action": "反高潮：博士沒等就直接把拉桿拉到底，結果時光機完全沒反應，畫面刻意跟上一張一樣以凸顯笑點。", "remedy": "WS 可能被畫成接近 FS；剪輯時與上一張對齊做『拉了也沒反應』的靜止笑點。", "imgs": [{"src": "img/EP1-04_v5_claude_19_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/03c57694-d170-4762-8683-a611ea6ac093"}, {"src": "img/EP1-04_v5_claude_19_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/a64ab2ed-7717-4017-9656-532b0f233c27"}]}, {"id": "EP1-04-20", "t": "12", "narration": ["博士往機器上，用力拍了一下。"], "subject": "PROF", "shot_size": "MS", "azimuth": "side", "angle": "eye", "composition": "PROF 側面置中，舉掌往畫面左邊的金屬圓環用力拍下去，表情懊惱；畫面左背景是圓環（HERO 還站在裡面）。", "screen_direction": "left", "action": "全幕收尾喜劇動作：博士懊惱地抬手往時光機上用力拍一巴掌——作為接往幕5『機器啟動把 HERO 送走』的錨點。", "remedy": "MS 可能被畫成膝上；剪輯時裁到需要景別。", "imgs": [{"src": "img/EP1-04_v5_claude_20_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/4f2f312f-a769-4244-b1e6-067f586740de"}, {"src": "img/EP1-04_v5_claude_20_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/98a4820e-25fa-4776-8dc6-3332ec0a97a5"}]}]}}}, {"id": "EP1-05_v5", "narration": ["時間，回到六千六百五十萬年前的北美洲。", "那時候的北美洲啊，中間隔著一大片海，你就掉在西邊這一半。", "你看，森林裡閃了一下藍光。"], "who": {"claude": {"name": "Claude CLI", "notes": "這一幕是地理解說的過場，沒有角色演戲、沒有實景、沒有走位（blocking 空、camera.cell 填 N/A、t 填 0）。依專案規定不做成平面圖表，而是做成『從高空往下看的手繪舊地圖／地形』這個劇中實物。三張圖是一組連續推近（continent → 西半部 → 森林藍光），對應三句旁白，節奏是「建立環境 → 定位(你掉在西邊) → 揭露藍光」。第三張的藍光就是時光機抵達的光，也是接到幕 6（HERO 掉進森林空地）的轉場錨點，位置與藍色要穩定好重現。全程沒有任何角色入鏡，所以沒有比例問題，cast 一律空陣列；地圖上不寫任何文字（照畫風規則）。第一張用實測過的 aerial+EWS 組合（aerial 只在 EWS 驗證成功）；第二、三張改用 high 角度看地形（高角度實測只會輕微往下看，對地形圖剛好夠用）。沒有 HERO 與大恐龍同框，不需要加拍遠一級。", "shots": [{"id": "EP1-05-01", "t": "0", "narration": ["時間，回到六千六百五十萬年前的北美洲。"], "subject": "6,650 萬年前北美洲大陸（手繪舊地圖／高空地形）", "shot_size": "EWS", "azimuth": "front", "angle": "aerial", "composition": "整塊大陸置中；一條南北向的大內海從中間縱貫，把陸地分成畫面左側的西半部和右側的東半部；四周是海洋，無前景人物。", "screen_direction": "off_down", "action": "建立鏡頭：從高空俯瞰整塊史前北美洲，中央一大片海安靜地把大陸切成兩半，定下時間與地點。", "remedy": "N/A", "imgs": [{"src": "img/EP1-05_v5_claude_01_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/d5dacf00-a68c-4515-b327-7a971b7c326d"}, {"src": "img/EP1-05_v5_claude_01_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/51a252e3-1ae0-431c-85c8-514fb9d0aa8e"}]}, {"id": "EP1-05-02", "t": "0", "narration": ["那時候的北美洲啊，中間隔著一大片海，你就掉在西邊這一半。"], "subject": "西半部陸地 + 墜落位置的藍色光點標記", "shot_size": "WS", "azimuth": "front", "angle": "high", "composition": "鏡頭推近到西半部：西邊陸地佔畫面大部分、偏畫面左與中；那條大內海沿著畫面右緣流過；西半部森林裡有一個發亮的藍色小光點標記（你掉下來的地方）。", "screen_direction": "off_down", "action": "揭露位置：從整塊大陸推近到西半部，一個藍色光點落在西邊森林上，標出『你就掉在這一半』。", "remedy": "high 角度實測只會輕微往下看，但對『高空看地形』這種鏡頭剛好夠用，不需強推正上方；WS 若被畫得偏近也無妨（主體是地形不是角色）。剪輯時可從第一張的全大陸連續推近到此框。", "imgs": [{"src": "img/EP1-05_v5_claude_02_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/29f1a77c-71e0-480e-8d20-0a68151f97ee"}, {"src": "img/EP1-05_v5_claude_02_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/4a433273-271c-465d-87eb-abbeb78e7efd"}]}, {"id": "EP1-05-03", "t": "0", "narration": ["你看，森林裡閃了一下藍光。"], "subject": "西半部一片森林樹冠 + 中央一道藍色閃光", "shot_size": "WS", "azimuth": "front", "angle": "high", "composition": "鏡頭再推近到西邊的一片森林樹冠，佔滿畫面；正中央偏中的深綠樹冠之間，有一道明亮的藍色閃光（時光機抵達的光）。", "screen_direction": "off_down", "action": "揭露藍光／轉場錨點：俯瞰森林樹冠，正中央忽然閃出一道藍光，預示下一幕 HERO 將掉進這片森林。藍光位置與藍色要穩定，供幕 6 重現。", "remedy": "high 角度只會輕微往下看，地形樹冠鏡頭可接受；這張是接幕 6 的轉場錨點，剪輯時可對藍光再推近並停留，藍光的位置與藍色需與幕 6 的時光機光一致。", "imgs": [{"src": "img/EP1-05_v5_claude_03_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/1b5083d1-f96a-48f7-b3e9-630fce244e5b"}, {"src": "img/EP1-05_v5_claude_03_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/20fd3c51-f57b-47cb-9b64-43d85bf62ba1"}]}]}}}, {"id": "EP1-06_v5", "narration": ["你是臉先著地的。", "身後的隧道，也跟著關起來了。", "這裡又熱又濕。那時候的地球比現在熱得多，連南北極都沒有冰呢。", "第一個跑來歡迎你的，是蚊子。", "（停）", "都過了六千六百五十萬年，蚊子還是一模一樣。", "你打開 Google，搜尋：白堊紀要怎麼活下去？", "畫面一直轉圈、轉圈。", "沒有訊號。", "（停）", "對啊，六千六百五十萬年前，哪來的基地台。", "你想找一片草地坐下來休息。", "可是這個時代，草還沒有長成草原喔。", "到處都是蕨類，高到你的腰。", "還好，旁邊剛好有一顆長滿青苔的大石頭。", "又平又涼，大小剛剛好。", "今天第一次，你覺得這份工作還不錯嘛。", "然後，那顆石頭，眨了一下眼睛。", "原來，那是一隻甲龍。全身都是盔甲，尾巴上還有一顆骨錘。", "那顆骨錘一揮，可以把你打到下個月去。", "還好，牠只想繼續睡覺。", "你踮著腳尖，偷偷溜走。", "走著走著，你口渴了。", "打開背包一看，放水壺的地方，空空的。", "（停）", "水壺啊，跟生存指南一起留在實驗室了。", "這時候，你聽到了水聲。", "這是今天的第一個好消息。", "（停）", "不過你決定，先不要太相信它。"], "who": {"claude": {"name": "Claude CLI", "notes": "這一幕是 HERO 落地後的第一段獨角戲，節奏走「狼狽落地 → 環境建立 → 手機沒訊號的無力感 → 找地方休息的誤會 → 甲龍揭露的驚嚇 → 偷溜 → 口渴的新麻煩 → 水聲懸念」。全幕以 HERO 為單一視點，用景別與角度分工：EWS 建立史前空地與關閉的時光隧道；MS／MCU 承載蚊子、手機、背包的近身喜劇；ECU 眼睛做「石頭眨眼」的揭露錨點；WS／EWS 做甲龍全身與尺寸震撼。甲龍「石頭」(ANKY) 固定趴在 D27–F28、頭朝東尾錘朝西，是本幕與日後重返的關鍵錨點，鏡頭刻意讓牠先以青苔巨石入鏡、再用眼睛特寫與全身反打揭露。凡 HERO 與甲龍同框（07/09/10/11）都依規則加拍遠一級版備剪。蚊子、手機螢幕皆以符號呈現、畫面無任何文字。結尾 Shot14 讓 HERO 轉頭朝北聽水聲，方向指向下一幕的河邊。", "shots": [{"id": "EP1-06-01", "t": "1", "narration": ["你是臉先著地的。", "身後的隧道，也跟著關起來了。", "這裡又熱又濕。那時候的地球比現在熱得多，連南北極都沒有冰呢。"], "subject": "HERO 趴在泥地，整片史前空地與正在關閉的時光隧道", "shot_size": "EWS", "azimuth": "back", "angle": "high", "composition": "畫面中央偏下是泥地，HERO 很小地臉朝下趴在泥裡；泥地正上方空中有一圈正在縮小、變淡的藍色時光隧道光；四周是蘇鐵、銀杏、針葉樹的茂密森林，右側(東)遠處有蕨類叢，畫面呈現悶熱、朦朧、潮濕的清晨氣氛", "screen_direction": "away", "action": "HERO 臉先著地、四肢攤開趴在泥地那一刻；身後藍光隧道縮成一點即將消失", "remedy": "high 實測只有輕微俯視，可接受；本鏡主要靠 EWS 建立環境與隧道關閉，不依賴強俯角。", "imgs": [{"src": "img/EP1-06_v5_clau cb160dfd7/edit/9ed0d3d3-2793-417f-ad6d-85c7eb7a01b1"}, {"src": "img/EP1-06_v5_claude_1W_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/63907d0a-f348-464d-8d0c-44bdd36aef91"}]}, {"id": "EP1-06-12", "t": "9", "narration": ["走著走著，你口渴了。"], "subject": "HERO 停步、口渴", "shot_size": "MS", "azimuth": "front", "angle": "eye", "composition": "HERO 在畫面中央，停下腳步、一手摸喉嚨、吐舌露出口渴表情，朝鏡頭方向；背景森林空地，已無甲龍", "screen_direction": "toward", "action": "HERO 走到一半停下、摸喉嚨、口乾舌燥的瞬間", "remedy": "MS 可能偏膝上；剪輯時向上裁到腰部即可。", "imgs": [{"src": "img/EP1-06_v5_claude_12_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/1f8de3d2-c3f3-43f3-b4df-34decee739e5"}, {"src": "img/EP1-06_v5_claude_12_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/018eb198-c59d-41c8-8165-d5fb5f7479ff"}]}, {"id": "EP1-06-13", "t": "9", "narration": ["打開背包一看，放水壺的地方，空空的。", "（停）", "水壺啊，跟生存指南一起留在實驗室了。"], "subject": "HERO 翻開背包、發現放水壺的袋子空空的", "shot_size": "MCU", "azimuth": "front", "angle": "eye", "composition": "HERO 在畫面中央，把背包繞到胸前、雙手撐開側袋，低頭盯著空空的水壺袋；側袋明顯是空的（只有鬆垮的網袋輪廓）；背景森林虛化", "screen_direction": "off_down", "action": "HERO 撐開背包水壺袋、發現裡面空空如也、愣住的瞬間", "remedy": "MCU 常被畫成到腰；若偏腰部仍能看清空背包，剪輯時可下推裁近到胸口。", "imgs": [{"src": "img/EP1-06_v5_claude_13_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/57a51940-71bf-4204-b7d3-7e74d97ba0ec"}, {"src": "img/EP1-06_v5_claude_13_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/e476bb25-ed7d-4525-b253-d76ecbeab0db"}]}, {"id": "EP1-06-14", "t": "10", "narration": ["這時候，你聽到了水聲。", "這是今天的第一個好消息。", "（停）", "不過你決定，先不要太相信它。"], "subject": "HERO 轉頭朝北傾聽遠處水聲", "shot_size": "MS", "azimuth": "front34", "angle": "eye", "composition": "HERO 在畫面中央偏左，身體轉為前側 3/4、一手攏在耳邊、抬頭轉向畫面左上方（北方河的方向）傾聽；表情先是一亮、又帶一點半信半疑的狐疑；背景是往北漸遠、朦朧的森林", "screen_direction": "off_up", "action": "HERO 聽見水聲、攏耳轉頭朝北、眼睛一亮又隨即瞇起懷疑的瞬間", "remedy": "MS 可能偏膝上；剪輯時向上裁到腰部，保留攏耳傾聽、朝北的方向以銜接下一幕河邊。", "imgs": [{"src": "img/EP1-06_v5_claude_14_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/7ecaf693-9c69-4a96-a013-ecd699cfcd75"}, {"src": "img/EP1-06_v5_claude_14_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/88757fad-1301-4794-81ad-c2fb3c0b6019"}]}]}}}, {"id": "EP1-07_v5", "narration": ["河的對岸，有一群鴨嘴龍在喝水。", "每一隻都跟大象差不多大，看起來脾氣很好的樣子。", "你拍了一張照片。", "（停）", "可惜不是暴龍，不算數。", "你低下頭。", "就在你的鞋子旁邊，有一個腳印。三根腳趾，跟你的腿差不多長。", "邊緣的泥巴，還在慢慢滲水。", "你想找下一個腳印。", "可是，沒有下一個。", "（停）", "也就是說，牠就停在這裡。", "對岸的鴨嘴龍，同時抬起頭來。", "牠們不喝水了。", "牠們全都在看你的後面。", "你不想回頭。", "（停）", "但你還是回頭了。", "樹的後面，慢慢探出了一顆頭。", "牠沒有吼叫。", "牠在聞。", "牠跟長頸鹿一樣高，跟大象一樣重，大概有八公噸。", "牠一口咬下去，連三角龍的骨頭都咬得穿。", "而你，只到牠的膝蓋而已。", "你突然想起來，手機裡存了一篇文章：", "〈遇到暴龍的三個求生秘訣〉。", "還是離線存的喔，你覺得自己好聰明。", "秘訣一：躲起來。", "你鑽進蕨類裡，屁股還露在外面。", "蕨類擋得住牠的眼睛，", "可是擋不住牠的鼻子。", "暴龍的鼻子，比狗還要靈。", "秘訣二：只要不動，牠就看不到你。", "其實那是電影在騙你的。", "暴龍的眼睛，比老鷹還要好。", "而牠現在，正盯著你的眼睛看。", "秘訣三：爬到樹上。", "你爬上最近的一棵樹。", "（停）", "沒想到，這棵樹比你想的還要軟。", "至於那本生存指南，第一頁只寫了兩個字：快跑。", "可惜它現在躺在實驗室的桌上。", "旁邊，就是你的水壺。", "牠張開了大嘴。", "你連牠的每一顆牙都看得清清楚楚。", "博士明明講過的。", "可是那時候，你在滑手機。", "越大隻的，跑得越慢。", "牠咬了個空。", "你掉了下來。", "然後，你拔腿就跑。"], "who": {"claude": {"name": "Claude CLI", "notes": "全幕 17 顆鏡頭，照旁白順序推進，節奏分四段：A 建立（河、鴨嘴龍、拍照）→ B 懸念（腳印、沒有下一個、對岸抬頭、回頭）→ C 揭露與比例（暴龍探頭、身高對比）→ D 三個求生秘訣全失敗與逃跑。開場用 EWS 從 HERO 背後建立河與對岸鴨嘴龍群；拍照改側面看清他舉相機的動作與遠方小小的鴨嘴龍（笑點：不是暴龍）。腳印用高角度俯看＋HERO 小腿同框給比例，再用一顆高角度遠景強調『只有一個腳印＝牠停在這裡』的空曠懸念。暴龍揭露分兩拍：先 WS 從樹後探頭在聞（不吼），再 WS＋極仰角做身高對比（HERO 只到膝蓋，附 PAIR2_TREX）。三個秘訣各一顆側面鏡頭講笑點：屁股露在蕨類外、對視定格、細樹被壓彎送到嘴前。手機文章、暴龍大嘴、實驗室指南與水壺、博士課堂閃回分別用插入／POV 鏡頭調節奏與補旁白。暴龍咬空＋HERO 掉落用側面 WS，最後用極仰角 FS、HERO 朝鏡頭拔腿跑收尾，接下一幕森林小路。凡 HERO 與成年暴龍同框（07/08/10/11/12/16）都另加一張遠一級版本（07W/08W/10W/11W/12W/16W）供剪輯；暴龍大嘴 POV（14）與逃跑（17）畫面中沒有 HERO／暴龍同框故不加拍。地圖說明：鴨嘴龍群實際位在對岸『s』格（規則標角色不可站），因劇情必須在對岸，當成背景繪製不走位；暴龍 t7 從東南大樹（R23）後方森林邊緣探頭，屬登場來向，之後踏上泥地（b 可站格）逼近 HERO。", "shots": [{"id": "EP1-07-01", "t": 1, "narration": ["河的對岸，有一群鴨嘴龍在喝水。", "每一隻都跟大象差不多大，看起來脾氣很好的樣子。"], "subject": "環境（寬闊河岸＋對岸 img/EP1-07_v5_claude_15_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/35759bcc-7781-4613-ba8b-9d29c94fc668"}]}, {"id": "EP1-07-16", "t": 13, "narration": ["牠咬了個空。", "你掉了下來。"], "subject": "暴龍咬空、HERO 掉落", "shot_size": "WS", "azimuth": "side", "angle": "eye", "composition": "畫面右上方暴龍的上下顎啪一聲合在空氣上（咬空）；畫面左邊偏下，HERO 已經在往下掉、手腳亂揮，落在合起來的嘴下方", "screen_direction": "off_down", "action": "暴龍一口咬在空氣上（越大跑越慢、咬不準），HERO 已往下掉", "remedy": "N/A", "imgs": [{"src": "img/EP1-07_v5_claude_16_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/22386144-ee16-4ce6-be47-2e88b317827f"}, {"src": "img/EP1-07_v5_claude_16_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/573d2c35-e86d-4c8b-b057-c1e9cf9944d8"}]}, {"id": "EP1-07-16W", "t": 13, "narration": ["牠咬了個空。", "你掉了下來。"], "subject": "暴龍咬空、HERO 掉落", "shot_size": "EWS", "azimuth": "side", "angle": "eye", "composition": "拉遠：右上暴龍合上的嘴、左下掉落的 HERO，四周納入更多泥地與森林", "screen_direction": "off_down", "action": "暴龍一口咬在空氣上，HERO 已往下掉（遠一級版本）", "remedy": "N/A", "imgs": [{"src": "img/EP1-07_v5_claude_6W_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/c87cc9de-12ee-4d1f-8f47-f04e1b74e22b"}, {"src": "img/EP1-07_v5_claude_6W_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/7a44c652-1b92-4e78-8c23-d5f35782492c"}]}, {"id": "EP1-07-17", "t": 14, "narration": ["然後，你拔腿就跑。"], "subject": "HERO 拔腿朝鏡頭狂奔", "shot_size": "FS", "azimuth": "front", "angle": "low", "composition": "HERO 在畫面中央朝鏡頭直直衝來、跨大步、手臂亂揮、圓頭、滿臉驚恐；身後是泥岸與河；暴龍在畫面外", "screen_direction": "toward", "action": "HERO 落地後立刻拔腿朝鏡頭狂奔逃離，接下一幕森林小路", "remedy": "N/A", "imgs": [{"src": "img/EP1-07_v5_claude_17_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/658fb5f4-0449-4b2e-9a02-df0b20cdcd2c"}, {"src": "img/EP1-07_v5_claude_17_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/a63db753-2f65-4b45-bb3a-051ee3ff74cc"}]}]}}}, {"id": "EP1-08_v5", "narration": ["牠追上來了。", "地面每震動一下，你就覺得自己死定了。", "可是追著追著，牠的速度慢下來了。", "七噸重的身體，根本跑不起來。", "腿只要一跑，骨頭就撐不住。", "牠最快，大概只有時速十九公里。", "（停）", "這個速度啊，叫做快走。", "你一邊跑，一邊回頭舉起相機。", "手一直在抖，你還是按下了快門。", "照片有點糊，但看得出來是暴龍。", "（停）", "任務，完成一半啦。", "你站上倒下來的樹幹，跟牠揮手說再見。", "牠站在遠遠的地方，喘著氣看著你。", "那個眼神，好像有點受傷呢。"], "who": {"claude": {"name": "Claude CLI", "notes": "全幕是『大而慢的掠食者』這個笑點的視覺化：先壓迫、再洩氣、最後溫柔。開場用背面＋極仰視，相機跟在暴龍身後、沿小路往東看，讓七噸的身體逼近、地面像在震，HERO 在遠方逃（鏡1）。接著切到暴龍側面吃力的全身，專講牠為什麼跑不動（鏡2，只有暴龍，focus 在腿和沉重身體）。第三顆是笑點：相機放在小路東端正面對著跑過來的 HERO，暴龍在他身後已經降成『快走』，用深度把差距拉開（鏡3）。鏡4 用背面過肩，看 HERO 扭身回頭、雙手舉相機對準遠處的暴龍；鏡5 緊接一顆相機螢幕的插入鏡頭（糊照片＋任務完成一半）。鏡6 HERO 站上倒木、極仰視顯得得意，朝畫外左邊的暴龍揮手；鏡7 反打到暴龍的臉，喘氣、眼神受傷，收在情緒上。暴龍與 HERO 身高差 2.94 倍，凡是兩個都在的鏡頭（1、3、4）都另外加拍遠一級版本，剪輯再挑。側面受地圖南北只有三排森林(最多9–12m)限制，拉不出大間距，所以『看差距』的鏡頭都走小路軸線(正面/背面)用透視表現，側面只用在單隻暴龍。", "shots": [{"id": "EP1-08-01", "t": "1", "narration": ["牠追上來了。", "地面每震動一下，你就覺得自己死定了。"], "subject": "TREX（迫近的威脅），HERO（遠方逃跑者）", "shot_size": "MLS", "azimuth": "back", "angle": "low", "composition": "相機貼地在小路上、跟在暴龍正後方。暴龍巨大的背影佔滿畫面中央偏左，尾巴和後腿在前景，頭高聳到畫面上緣（可能裁切）；小路往東延伸，HERO 小小的背影在遠處正中央往前逃；兩側是茂密森林。", "screen_direction": "away", "action": "暴龍前傾猛衝、正要追上；HERO 在遠處拔腿狂奔。沉重腳步讓地面彷彿在震。", "remedy": "MLS 的仰視＋背面雙角色組合未實測；若壓迫感或仰視不足，剪輯用 1W(FS) 或接受較平的角度。", "imgs": [{"src": "img/EP1-08_v5_claude_01_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/3607d76c-ad6c-4480-ae9b-9eba46abc98f"}, {"src": "img/EP1-08_v5_claude_01_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/b684d15a-8210-4235-ac9b-f814263ffdde"}]}, {"id": "EP1-08-01W", "t": "1", "narration": ["牠追上來了。", "地面每震動一下，你就覺得自己死定了。"], "subject": "TREX（迫近的威脅），HERO（遠方逃跑者）", "shot_size": "FS", "azimuth": "back", "angle": "low", "composition": "相機更往後退，暴龍整隻背影頭到腳完整入鏡、仍佔畫面大半，HERO 背影在更遠的小路盡頭，森林與長長的小路大量入鏡。", "screen_direction": "away", "action": "同鏡1，往後拉一級，看得到暴龍整隻與牠追向遠方 HERO 的完整態勢。", "remedy": "FS 背面仰視；若 T-rex 未整隻入鏡，接受頭頂輕微裁切。", "imgs": [{"src": "img/EP1-08_v5_claude_1W_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/d07f78c9-a7ba-4ccf-9e51-acfdd9802cbd"}, {"src": "img/EP1-08_v5_claude_1W_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/ad17bd78-3e6b-4a5e-aeac-b4b1e302adef"}]}, {"id": "EP1-08-02", "t": "2", "narration": ["可是追著追著，牠的速度慢下來了。", "七噸重的身體，根本跑不起來。", "腿只要一跑，骨頭就撐不住。"], "subject": "TREX（吃力放慢腳步）", "shot_size": "FS", "azimuth": "side", "angle": "eye", "composition": "相機在小路南側森林邊緣，正對暴龍側面。暴龍佔滿畫面中央、朝右（東）移動，沉重身體往下沉、後腿吃力彎曲；前景可能有森林枝葉，背景是小路與森林。畫面裡只有暴龍。", "screen_direction": "right", "action": "暴龍從猛衝變成沉重、吃力的半走，巨大身軀晃動，後腿肌肉骨頭像撐不住，張嘴喘氣。", "remedy": "N/A", "imgs": [{"src": "img/EP1-08_v5_claude_02_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/31a8e59e-f35c-417b-840b-e66dd87d4914"}, {"src": "img/EP1-08_v5_claude_02_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/726eb510-9308-4ee1-b134-e0d58024b6ce"}]}, {"id": "EP1-08-03", "t": "3", "narration": ["牠最快，大概只有時速十九公里。", "（停）", "這個速度啊，叫做快走。"], "subject": "HERO（往鏡頭跑），TREX（遠後方只剩快走）", "shot_size": "WS", "azimuth": "front", "angle": "eye", "composition": "相機在小路東端正對著跑來的 HERO。HERO 在前景偏左、全身朝鏡頭衝；畫面中央偏右的更遠處，暴龍在小路上只是『快走』，張嘴喘氣，和 HERO 之間拉開明顯空檔；兩側森林。", "screen_direction": "toward", "action": "HERO 拼命朝鏡頭跑（笑點：他還在狂奔）；身後的暴龍已經降速成悠悠快走，一臉喘。停頓後點出『這叫快走』。", "remedy": "想要 WS，Flow 常把 WS 畫成接近 FS；備有 3W(EWS) 可在剪輯選用。", "imgs": [{"src": "img/EP1-08_v5_claude_03_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/80c027d2-b1de-49b3-a77c-30834baeb3a4"}, {"src": "img/EP1-08_v5_claude_03_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/ecefb969-0d13-40b4-8a81-d484b37688fa"}]}, {"id": "EP1-08-03W", "t": "3", "narration": ["牠最快，大概只有時速十九公里。", "（停）", "這個速度啊，叫做快走。"], "subject": "HERO（往鏡頭跑），TREX（遠後方只剩快走）", "shot_size": "EWS", "azimuth": "front", "angle": "eye", "composition": "相機再退到小路最東端，兩個角色都變小，長長的小路與兩側森林成為主體，HERO 在前景偏左，暴龍在遠後方中央，差距更明顯。", "screen_direction": "toward", "action": "同鏡3，往後拉一級，用大環境強調一個狂奔、一個悠哉快走的荒謬對比。", "remedy": "EWS 距離受地圖東緣限制(18m)，若主體仍偏大，剪輯縮小/裁切。", "imgs": [{"src": "img/EP1-08_v5_claude_3W_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/2dfd501f-7136-4f67-9c86-2e6e598f1d31"}, {"src": "img/EP1-08_v5_claude_3W_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/1315f802-afbf-4adb-8bd0-02be4608d02c"}]}, {"id": "EP1-08-04", "t": "4", "narration": ["你一邊跑，一邊回頭舉起相機。", "手一直在抖，你還是按下了快門。"], "subject": "HERO（扭身回頭舉相機），TREX（遠處被拍的對象）", "shot_size": "FS", "azimuth": "back", "angle": "eye", "composition": "相機在 HERO 正後方小路上。HERO 全身背影在前景偏右，上半身扭回、雙手高舉把相機對準小路深處（西）；畫面深處小路上站著遠處的暴龍，成為他取景的目標；兩側森林。", "screen_direction": "away", "action": "HERO 身體還朝東跑，上半身回扭朝西、雙手發抖地舉相機對準暴龍，按下快門的那一刻。", "remedy": "N/A", "imgs": [{"src": "img/EP1-08_v5_claude_04_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/eeada779-0c48-4df6-af07-a593f33d96e9"}, {"src": "img/EP1-08_v5_claude_04_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/a52bbb09-180c-43ba-ac3d-419bf886e5fa"}]}, {"id": "EP1-08-04W", "t": "4", "narration": ["你一邊跑，一邊回頭舉起相機。", "手一直在抖，你還是按下了快門。"], "subject": "HERO（扭身回頭舉相機），TREX（遠處被拍的對象）", "shot_size": "WS", "azimuth": "back", "angle": "eye", "composition": "相機往後退一步，HERO 背影仍在前景偏右但更小，更多小路與森林入鏡，深處的暴龍與他取景的關係更清楚。", "screen_direction": "away", "action": "同鏡4，往後拉一級，看得到 HERO、他舉的相機、和遠處被拍的暴龍三者的空間關係。", "remedy": "N/A", "imgs": [{"src": "img/EP1-08_v5_claude_4W_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/ed15eb08-eae3-45b5-8f34-1d821c12b7e9"}, {"src": "img/EP1-08_v5_claude_4W_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/6bce62bf-f813-4e07-aa8d-5e8ac2c8c81e"}]}, {"id": "EP1-08-05", "t": "4", "narration": ["照片有點糊，但看得出來是暴龍。", "（停）", "任務，完成一半啦。"], "subject": "相機螢幕（握在 HERO 手中），螢幕上是糊掉的暴龍照片", "shot_size": "ECU", "azimuth": "front", "angle": "eye", "composition": "插入鏡頭。畫面幾乎被相機背面的螢幕佔滿，一對白色火柴人的手從下方／兩側握著相機；螢幕朝向觀眾，顯示一張糊糊、但一眼看得出是暴龍的照片。沒有完整角色，只有手與相機。", "screen_direction": "toward", "action": "剛按下快門後，螢幕上跳出那張晃到有點糊、卻仍認得出暴龍的照片。", "remedy": "ECU 物件版未實測；若螢幕沒放到最大，剪輯再推近到螢幕。", "imgs": [{"src": "img/EP1-08_v5_claude_05_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/a08b92fb-7702-4c7b-a966-ad815b10eb42"}, {"src": "img/EP1-08_v5_claude_05_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/4c63a731-725e-498b-b49e-243bda5e1766"}]}, {"id": "EP1-08-06", "t": "5", "narration": ["你站上倒下來的樹幹，跟牠揮手說再見。"], "subject": "HERO（站上倒木揮手道別）", "shot_size": "FS", "azimuth": "front34", "angle": "low", "composition": "相機貼地在 HERO 的前側（西南）往上看。HERO 全身站在橫過小路的倒木上、佔畫面中央，看得到他的臉；一隻手朝畫面左邊（畫外的暴龍）揮手；背景是小路與森林，天空露一點。暴龍不在畫面內。", "screen_direction": "off_left", "action": "HERO 得意地站上倒木，開心地朝畫外左方的暴龍揮手說再見。", "remedy": "low+front34 未實測；若仰視不足，剪輯接受輕微仰視，人物站在倒木上本身已帶高度。", "imgs": [{"src": "img/EP1-08_v5_claude_06_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/802a702e-f284-40aa-aa2d-15d033062a62"}, {"src": "img/EP1-08_v5_claude_06_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/b91708fd-b6a2-4cf5-a899-42086681a13c"}]}, {"id": "EP1-08-07", "t": "5", "narration": ["牠站在遠遠的地方，喘著氣看著你。", "那個眼神，好像有點受傷呢。"], "subject": "TREX（喘氣、受傷眼神）", "shot_size": "CU", "azimuth": "front", "angle": "eye", "composition": "相機在小路上、暴龍正前方，升到暴龍眼睛高度平視。暴龍的頭與胸口佔滿畫面中央，正面朝鏡頭；嘴半張喘氣、眼神往下、帶一點受傷委屈；背景是小路與森林。畫面裡只有暴龍（HERO 在鏡頭後方的倒木上，不入鏡）。", "screen_direction": "toward", "action": "暴龍站定、胸口起伏地喘氣，看著鏡頭方向（HERO），眼神有點受傷委屈。全幕的情緒收尾。", "remedy": "想要 CU，prompt 用 MCU(△)；MCU 可能畫成到胸腰，剪輯推近/裁切到臉，強調受傷眼神。", "imgs": [{"src": "img/EP1-08_v5_claude_07_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/57e511f1-90a7-483d-9878-8ed3c226a5a8"}, {"src": "img/EP1-08_v5_claude_07_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/e7ffe22c-370a-4f8e-8d3b-8d5819697e9f"}]}]}}}, {"id": "EP1-09_v5", "narration": ["逃過一劫的你，沿著河往下游走，還吹起了口哨。", "照片已經到手了，現在只差一顆牙齒。", "暴龍那麼多，總會有一隻掉牙吧。", "你跑贏了暴龍耶。", "你是史上第一個跑贏暴龍的大學生。", "（停）", "也是史上第一個，延畢兩年的。", "你開心地自拍了一張。", "（停）", "這張照片，可以放在履歷上了吧。", "突然間，你的笑容僵住了。", "你想起來，博士還講過一件事。", "只是那時候，你在打哈欠。", "跑最快的，不是最大隻的。", "是剛剛好的。", "你背後的蕨類，動了一下。", "（停）", "可是，今天根本沒有風啊。"], "who": {"claude": {"name": "Claude CLI", "notes": "這一幕是『假勝利』：先讓 HERO 在開闊河床上得意洋洋，再一刀翻轉成懸念。節奏設計成『先放鬆、後收緊』：鏡頭由極遠（建立地理與孤身一人的渺小）→ 拉近（得意的走路與笑話）→ 自拍動作 → 手機螢幕插入鏡頭（笑點 punch）→ 臉部特寫（笑容僵住的情緒轉折點）→ 拉遠到大遠景的高角度（俯視讓他顯得脆弱、暴露，替威脅鋪陳）→ 中景揭示（背後蕨類晃動的 cliffhanger）。HERO 沿乾河床由北往南（下游）走，走位連續：S3→S5→T6→T7，始終在可站的乾河床(d)上。地面鏡頭統一把『動作線』設在河床南北軸上，相機主要放在主體正前方(南)或前側，河(西)固定在畫面左、森林/蕨類(東)固定在畫面右，不跨線；只有第 1 張是空拍 master（往南俯瞰），河在右，屬於建立鏡頭另立地理，可接受。非平視鏡頭都有理由：Shot1 空拍=建立環境與渺小感；Shot6 俯視=脆弱暴露感。關鍵錨點是 Shot7：HERO 在前景、蕨類叢(V6)在他右後方背景晃動，相機位置、站位、蕨類位置都要穩定，方便後面幕重現。全場只有 HERO 入鏡，沒有大恐龍同框，故不需要加拍遠一級。", "shots": [{"id": "EP1-09-01", "t": "1", "narration": ["逃過一劫的你，沿著河往下游走，還吹起了口哨。", "照片已經到手了，現在只差一顆牙齒。", "暴龍那麼多，總會有一隻掉牙吧。"], "subject": "HERO（孤身一人走在開闊乾河床上，環境為主）", "shot_size": "EWS", "azimuth": "back34", "angle": "aerial", "composition": "HERO 是畫面裡很小的一點，位於河床中偏下，往畫面深處(南)走去；畫面右側是寬闊淺河與對岸朦朧森林，左側是蕨類叢與蘇鐵銀杏森林；河與河床一路延伸到遠方河灣。", "screen_direction": "away", "action": "HERO 背對鏡頭，悠哉地往下游走，渺小而放鬆，建立地理與孤身一人的處境。", "remedy": "aerial△ 只在配 EWS 時成功，本張即為 EWS，可接受；空拍常把人物畫得更小，正合所需。若地形不夠開闊，剪輯維持大遠景並可輕微下移框線。", "imgs": [{"src": "img/EP1-09_v5_claude_01_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/87f70693-5905-48dc-b164-c4b34a09ba18"}, {"src": "img/EP1-09_v5_claude_01_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/e0748df8-e51a-438a-bd84-4d266322edb7"}]}, {"id": "EP1-09-02", "t": "2", "narration": ["你跑贏了暴龍耶。", "你是史上第一個跑贏暴龍的大學生。", "（停）", "也是史上第一個，延畢兩年的。"], "subject": "HERO（得意地走路）", "shot_size": "MLS", "azimuth": "front", "angle": "eye", "composition": "HERO 置中，朝鏡頭走來，膝上入鏡；畫面左是寬河，右是蕨類叢與森林；腳下是龜裂乾河床。", "screen_direction": "toward", "action": "HERO 挺胸、嘟嘴吹口哨、握拳做出小小的勝利動作，一臉得意。配合延畢兩年的笑話，神情越得意越好笑。", "remedy": "N/A（MLS✓、front✓、eye✓）。", "imgs": [{"src": "img/EP1-09_v5_claude_02_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/4d275495-e7fd-49f2-b7d6-2a727f6efffc"}, {"src": "img/EP1-09_v5_claude_02_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/d2bb19ff-827c-4017-85fc-de668ec617da"}]}, {"id": "EP1-09-03", "t": "3", "narration": ["你開心地自拍了一張。", "（停）"], "subject": "HERO（伸手自拍）", "shot_size": "MLS", "azimuth": "front34", "angle": "eye", "composition": "HERO 偏畫面中央，一手往鏡頭方向伸出拿著手機，另一手比 YA；背後是蕨類叢與森林邊緣，左後方可見寬河。", "screen_direction": "toward", "action": "HERO 停在河床上，手臂伸直拿手機自拍，咧嘴大笑，正是按下快門的那一刻。（停）是按完快門、切到手機螢幕前的 0.8 秒停頓。", "remedy": "front34△ 大致可做到；若偏成正面亦可接受，不影響敘事。", "imgs": [{"src": "img/EP1-09_v5_claude_03_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/35357383-dc80-4bdd-ab8a-446681d56ff0"}, {"src": "img/EP1-09_v5_claude_03_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/c6b3dd0b-8e5a-4320-af72-45343a7ecac1"}]}, {"id": "EP1-09-04", "t": "3", "narration": ["這張照片，可以放在履歷上了吧。"], "subject": "手機螢幕（插入鏡頭，上面是 HERO 剛拍的自拍照）", "shot_size": "ECU", "azimuth": "front", "angle": "eye", "composition": "手機螢幕幾乎填滿整個畫面，螢幕裡是 HERO 咧嘴自拍、背後河與河床朦朧；拿手機的粗火柴人手只露在畫面邊緣。", "screen_direction": "toward", "action": "插入鏡頭：螢幕上定格的得意自拍照，配『可以放在履歷上了吧』的笑點 punch。", "remedy": "ECU 針對手機螢幕未實測；若生成把整支手機或整隻手都畫進來，剪輯時裁切到螢幕滿版即可。", "imgs": [{"src": "img/EP1-09_v5_claude_04_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/31901547-4afd-4e68-9475-6c49ed576ee7"}, {"src": "img/EP1-09_v5_claude_04_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/40e5bdb8-6d63-454b-aa0d-1db9e9c172a8"}]}, {"id": "EP1-09-05", "t": "4", "narration": ["突然間，你的笑容僵住了。", "你想起來，博士還講過一件事。", "只是那時候，你在打哈欠。"], "subject": "HERO（臉部，笑容僵住）", "shot_size": "CU", "azimuth": "front34", "angle": "eye", "composition": "HERO 的臉與胸口佔滿畫面中央，微側 3/4；背景河與森林柔焦朦朧；手機垂在身側。", "screen_direction": "off_left", "action": "本來的笑僵在圓白臉上，眼睛睜大、放空，往畫面左外凝視——記憶浮上來的那一刻。情緒轉折點，需要夠近的臉。", "remedy": "想要 CU（臉滿版），但 CU✗；prompt 改用 MCU(△) 句子，剪輯時推近到 CU。MCU 常被畫到腰，必要時再裁到胸上。", "imgs": [{"src": "img/EP1-09_v5_claude_05_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/253a73fc-24f8-4d3c-ad08-ac7a56453555"}, {"src": "img/EP1-09_v5_claude_05_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/aa88fc9c-3271-4392-a1ae-dd8b6f48eed5"}]}, {"id": "EP1-09-06", "t": "5", "narration": ["跑最快的，不是最大隻的。", "是剛剛好的。"], "subject": "HERO（孤立在空曠河床中）", "shot_size": "WS", "azimuth": "front34", "angle": "high", "composition": "HERO 小小地站在廣闊龜裂河床正中央，四周空曠；左邊寬河、右邊蕨類叢與森林，附近有大石頭與漂流木；高角度俯看，強調他的渺小與暴露。", "screen_direction": "off_left", "action": "HERO 僵住後不安地站著、往畫面左（河的方向）張望（看錯了方向），肩膀緊繃，恐懼沉下來。拉遠加俯視替接下來的威脅鋪陳。", "remedy": "WS△ 常被畫成 FS、high△ 只有輕微俯角；若俯視不足或人物過大，剪輯時裁出更空曠、更脆弱的構圖（留多一點天地空間）。", "imgs": [{"src": "img/EP1-09_v5_claude_06_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/987016dc-81d9-486a-a2b8-95f529ec0885"}, {"src": "img/EP1-09_v5_claude_06_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/362da219-2680-44d8-8f84-94b411f055c1"}]}, {"id": "EP1-09-07", "t": "6", "narration": ["你背後的蕨類，動了一下。", "（停）", "可是，今天根本沒有風啊。"], "subject": "HERO（前景，渾然不覺）；次要：他右後方晃動的蕨類叢", "shot_size": "MS", "azimuth": "front", "angle": "eye", "composition": "HERO 置中偏前，腰上入鏡、面向鏡頭；他右後方（東、畫面右）河床邊緣有一叢高蕨類正被撥動、幾片葉子彎折晃動，其餘蕨類全部靜止；左後方背景是寬河。這是關鍵錨點鏡頭。", "screen_direction": "toward", "action": "HERO 面向鏡頭、笑容正慢慢退去、帶點不安，但完全沒發現。畫面重點是他背後那一叢蕨類動了一下——空氣死寂、塵土不動、根本沒有風。懸念收尾。", "remedy": "MS△ 常被畫成膝上；若下緣偏低，剪輯推近到腰上。務必保持『只有背後那一叢蕨類晃動、其餘全靜止』為畫面重點。", "imgs": [{"src": "img/EP1-09_v5_claude_07_1.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/c27d9689-7aa4-4761-ad27-24b9f5fdd7f2"}, {"src": "img/EP1-09_v5_claude_07_2.jpg", "url": "https://flow.google.com/u/4/project/58c66b05-89b5-495f-a132-592cb160dfd7/edit/aaf5f5ea-0efd-4a62-8336-955779e74f43"}]}]}}}];
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const sel=document.getElementById('sc'),out=document.getElementById('out');
sel.innerHTML=S.map((s,i)=>`<option value="${i}">${s.id}</option>`).join('');
const K=[['codex','cx'],['claude','cl']];
function render(){const s=S[+sel.value];
  const who=K.filter(([k])=>s.who[k]);
  const owner=(k,line)=>(s.who[k].shots.filter(x=>(x.narration||[]).includes(line)).map(x=>`<span class="sid ${K.find(z=>z[0]===k)[1]}">${esc(x.id.slice(-2))}</span>`).join(' ')||'—');
  const map=`<div class="card"><h2>旁白分配</h2><p class="sub">每句旁白配在哪一張。</p><div class="tbl" style="margin-top:6px"><table><tr><th></th><th>旁白</th>${who.map(([k])=>`<th>${esc(s.who[k].name)}</th>`).join('')}</tr>
    ${s.narration.map((l,i)=>`<tr><td class=n>${i+1}</td><td>${esc(l)}</td>${who.map(([k])=>`<td>${owner(k,l)}</td>`).join('')}</tr>`).join('')}</table></div></div>`;
  const col=([k,c])=>{const w=s.who[k];return `<div class="col ${c}"><h2>${esc(w.name)}：${w.shots.length} 張</h2><p class="notes">${esc(w.notes)}</p>
    ${w.shots.map(x=>`<div class="card shot"><div class="bar"><span class="sid">${esc(x.id)}</span><div class="chips"><span class=chip>${esc(x.shot_size)}</span><span class=chip>${esc(x.azimuth)}</span><span class=chip>${esc(x.angle)}</span><span class=chip>${esc(x.screen_direction)}</span></div></div>
      <div class="imgs">${x.imgs.length?x.imgs.map(m=>`<div><img src="${esc(m.src)}" alt="${esc(x.id)}" loading="lazy"><a href="${esc(m.url)}" style="font-size:12px">Flow</a></div>`).join(''):'<div class="miss">還沒畫</div>'}</div>
      ${(x.narration||[]).map(n=>`<div class="nar">${esc(n)}</div>`).join('')}
      <dl><dt>主體</dt><dd>${esc(x.subject)}</dd><dt>構圖</dt><dd>${esc(x.composition)}</dd><dt>動作</dt><dd>${esc(x.action)}</dd><dt>補救</dt><dd>${esc(x.remedy)}</dd></dl></div>`).join('')}</div>`};
  out.innerHTML=map+`<div class="cols">${who.map(col).join('')}</div>`;
  out.querySelectorAll('.imgs img').forEach(im=>im.onclick=()=>{const z=document.createElement('div');z.className='zoom';z.innerHTML=`<img src="${im.src}" alt="">`;z.onclick=()=>z.remove();document.body.appendChild(z)});
}
sel.onchange=render;render();
</script>

bject": "HERO；次要主體 TEEN", "shot_size": "FS", "azimuth": "front", "angle": "eye", "composition": "HERO 全身在中央偏右；TEEN 從畫面左後方露出頭、軀幹和跑動雙腿。TEEN 位於第 7 列，從東側回望時自然落在 HERO 的畫面左側，兩張臉互不遮擋。", "screen_direction": "toward", "action": "HERO 用盡全力朝鏡頭跑，身體失去從容；後方 TEEN 步幅大、頭部穩定，形成速度與體能的反差，正式揭露追兵。", "remedy": "N/A", "imgs": [{"src": "img/EP1-01_v2_codex_03_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/b2b70693-262c-4add-b0d6-8d4bcb1b85dd"}, {"src": "img/EP1-01_v2_codex_03_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/c0fcdb66-40c3-415e-b149-ae8e0bb97f0a"}]}, {"id": "EP1-01-04", "t": 4, "narration": ["牠的嘴巴，比你整個人還要大。", "而且啊，牠越追越近了。"], "subject": "TEEN；次要主體 HERO", "shot_size": "MLS", "azimuth": "side", "angle": "eye", "composition": "TEEN 膝上身體佔據畫面左側與中央，巨大張嘴朝右，尾部被左邊框裁切。HERO 在右側接近出框，只露膝上身體；兩者之間的空隙比上一張明顯縮小。以嘴部局部誇張製造吞噬感，不改變 TEEN 身高。", "screen_direction": "right", "action": "TEEN 張嘴到最大、頭頸朝 HERO 前伸；HERO 在右側奮力逃離。先讓旁白落在張嘴形狀上，再以數位推近強調獵物與牙齒之間縮短的空隙。", "remedy": "嘴巴局部誇張尚未實測。若模型把 TEEN 全身放大，使用 PAIR2_TEEN 鎖定身高，保留張嘴形狀，剪輯時推近嘴與 HERO 之間的空隙，讓旁白和裁切共同完成誇張感。", "imgs": [{"src": "img/EP1-01_v2_codex_04_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/1c33a506-4bb2-40ca-b313-dfafcd16df28"}, {"src": "img/EP1-01_v2_codex_04_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/1cc411e4-3f67-4d6b-9c2b-9eed1e5b8879"}]}, {"id": "EP1-01-05", "t": 5, "narration": ["你一定很想問：", "我到底是怎麼跑到這裡來的？", "這件事呢，要從今天早上開始說起。"], "subject": "HERO；次要主體 TEEN", "shot_size": "FS", "azimuth": "side", "angle": "low", "composition": "HERO 全身懸空在畫面中央偏右，Q6 樹根在他正下方。TEEN 在左側，口鼻向右伸到 HERO 後方但不接觸；TEEN 高處頭頂與低處腿部可被邊框裁切，HERO 輪廓完整。右後方是 M3–S5 空地的暖色亮面，左側是較暗樹幹。", "screen_direction": "right", "action": "HERO 跨根跳躍到最高點，東側前腿伸出、西側後腿彎曲，雙臂上揚，臉朝東，嘴巴驚叫；胸前相機向東甩出，背包仍貼在背後。TEEN 張嘴前伸。整張在此定格，不再切新的反應鏡頭。", "remedy": "先使用已驗證的完整極低角度句子生成。若雙角色跳躍使低角度失效，維持 HERO 全身、樹根和追兵的相對位置，接受較弱的仰視作備選，以剪輯推近加強壓迫感。選定後保存原圖，幕 11 直接重用同一張，不重新生成；同時固定 Q6 懸空 HERO、P6 TEEN、Q8 相機、樹根位置、西方光向、右後空地與所有遮擋關係。", "imgs": [{"src": "img/EP1-01_v2_codex_05_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/33e4e2b0-6d07-44fc-9ad4-2e45ba66adeb"}, {"src": "img/EP1-01_v2_codex_05_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/7d668a4a-18d8-4ecf-8138-e25d32cea898"}]}]}, "claude": {"name": "Claude CLI", "notes": "冷開場的戲劇任務：在觀眾還不知道發生什麼事時，先用「奔跑→環境壓迫→速度→揭露威脅→放大危險→逼近→定格懸念」七拍把人一口氣拉進追逐，最後定格在 HERO 跳起那一瞬間丟出問句，轉場去倒敘。七張圖對應七個敘事功能，景別與視角都為功能服務：①正面極遠景＋逆光夕陽建立環境與孤身奔跑；②正面貼地仰角讓樹「比大樓高」、壓迫感出來；③前側 3/4 中近景貼臉呈現 HERO 的拚命與喘；④側面遠景第一次揭露後面有東西在追（此前三張刻意只畫 HERO，延後揭露）；⑤正面仰角把暴龍的大嘴放到最大、HERO 縮成前景比例尺；⑥後側 3/4 從掠食者背後看出去，用縮小的間距表現「越追越近」；⑦側面定格 HERO 躍過樹根、暴龍大嘴咬在腳跟——這是幕 11 要原樣重現的關鍵錨點，所以用最乾淨好重現的正側面、兩角色都完整入鏡、夕陽從畫左逆光。HERO 全程沿小路（第 6 列）向東（畫面右）跑，暴龍走第 7 列在後方追，間距從 12m 一路縮到貼身。HERO 無帽、滿身泥、胸前小相機、背背包。暴龍大嘴是視覺誇張，不照幾何比例。多數鏡頭用平視；非平視的仰角（②⑤）與後側/側面都寫得出理由。", "shots": [{"id": "EP1-01-01", "t": 1, "narration": ["你正在跑。"], "subject": "HERO（沿泥巴小路奔跑）", "shot_size": "EWS", "azimuth": "front", "angle": "eye", "composition": "HERO 很小在畫面中央偏下，沿小路朝鏡頭跑來；兩側巨樹夾道往畫面上方收攏，小路盡頭是西方夕陽，HERO 逆光成剪影。畫面只有 HERO。", "screen_direction": "toward", "action": "冷開場第一格：孤身一人在黃昏森林小路上全力奔跑，還看不出在逃什麼。", "remedy": "N/A", "imgs": [{"src": "img/EP1-01_v2_claude_01_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/77496b89-2ba1-46b2-b098-fc9033dd309b"}, {"src": "img/EP1-01_v2_claude_01_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/fcec0dd5-28bf-470b-b188-2014d18e365a"}]}, {"id": "EP1-01-02", "t": 2, "narration": ["腳下是爛泥巴，旁邊的樹，比大樓還要高。"], "subject": "HERO 與夾道巨樹（環境為重）", "shot_size": "FS", "azimuth": "front", "angle": "low", "composition": "HERO 在畫面中央全身入鏡，貼地仰角讓他顯得往上衝；兩側與上方是比大樓還高的蘇鐵、銀杏、針葉樹，橙色夕陽天空從樹縫透進來；前景是濕爛的泥巴。畫面只有 HERO。", "screen_direction": "toward", "action": "仰角強調巨樹的壓迫與渺小感，呼應『樹比大樓還高』；HERO 踩著爛泥往鏡頭衝。", "remedy": "低仰角若把 HERO 畫得過大或樹不夠高，回退為平視 FS 並在 prompt 保留巨樹夾道；剪輯時可下壓畫面模擬仰角。", "imgs": [{"src": "img/EP1-01_v2_claude_02_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/abebabe2-3a13-4e83-8225-8db76ae3d425"}, {"src": "img/EP1-01_v2_claude_02_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/ad7a693a-fda3-4fb0-a132-ee13ed1fbf5d"}]}, {"id": "EP1-01-03", "t": 3, "narration": ["你這輩子啊，從來沒跑得這麼快過。"], "subject": "HERO（拚命奔跑的臉與上身）", "shot_size": "MCU", "azimuth": "front34", "angle": "eye", "composition": "HERO 在畫面中央偏左，看得到臉和一側身體，手臂猛擺；背景是被速度模糊掉的夕陽森林小路往右後方退去。畫面只有 HERO。", "screen_direction": "toward", "action": "貼近呈現 HERO 滿臉泥、張口大喘、眼睛瞪大的拚命狀態，把『跑得這麼快』落在角色的身體感上。", "remedy": "MCU 常被畫成到腰、front34 大致可用：若下緣落在腰部，剪輯時推近到胸上即可。", "imgs": [{"src": "img/EP1-01_v2_claude_03_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/b0a059f5-4328-4161-a3b1-cc6afa95e9af"}, {"src": "img/EP1-01_v2_claude_03_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/6e7dc689-26e3-4aaa-926d-34e0996e5aad"}]}, {"id": "EP1-01-04", "t": 4, "narration": ["可是後面那個東西，跑得比你還快。"], "subject": "HERO 與 TEEN（正側面的追逐關係）", "shot_size": "WS", "azimuth": "side", "angle": "eye", "composition": "畫面右邊 HERO 全身往右跑；畫面左後方 TEEN（明顯比人高很多）在同一條小路上追來，嘴開始張；兩側巨樹、橙色夕陽光從畫左來。第一次讓觀眾看到後面有東西。", "screen_direction": "right", "action": "揭露鏡頭：首次把掠食者放進畫面，用正側面一眼交代體型差與追逐方向，暴龍比 HERO 快、間距正在縮。", "remedy": "WS 常被畫成 FS；prompt 已強調大量環境，若仍偏近，接受全身 FS 構圖即可，不影響揭露功能。", "imgs": [{"src": "img/EP1-01_v2_claude_04_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/c32768ed-c3e9-47d8-b40d-59d96333b1ef"}, {"src": "img/EP1-01_v2_claude_04_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/4947e191-5ac2-4c04-a9ce-a18056e23300"}]}, {"id": "EP1-01-05", "t": 5, "narration": ["牠的嘴巴，比你整個人還要大。"], "subject": "TEEN（張到最開的大嘴）；HERO 當前景比例尺", "shot_size": "FS", "azimuth": "front", "angle": "low", "composition": "TEEN 從畫面中央直衝鏡頭、大嘴張到誇張地大、滿口牙，佔滿上半畫面；左下前景是縮得很小的 HERO 在逃；兩側森林、逆光橙色夕陽天空。", "screen_direction": "toward", "action": "放大危險：用貼地仰角＋正面衝鏡，把暴龍的嘴誇張到『比一個人還大』，HERO 縮小當比例尺，威脅感與喜感並存。", "remedy": "嘴若不夠誇張，剪輯時推近到嘴部；低角度若失效改平視仰拍、靠 prompt 維持張嘴衝鏡。", "imgs": [{"src": "img/EP1-01_v2_claude_05_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/0b34bbd2-0fd0-4ce1-9970-aab9e3e87069"}, {"src": "img/EP1-01_v2_claude_05_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/47b87650-ddf8-454b-aaea-98bb4349df2e"}]}, {"id": "EP1-01-06", "t": 6, "narration": ["而且啊，牠越追越近了。"], "subject": "TEEN（掠食者背後視角）；HERO 在前方逃", "shot_size": "MS", "azimuth": "back34", "angle": "eye", "composition": "TEEN 的背與前伸的頭佔滿畫面近景，大嘴張開幾乎咬到前方；畫面前方不遠處是縮小的 HERO 往同一方向逃。兩者都朝畫面深處（遠離鏡頭）跑，間距被壓得很小。", "screen_direction": "away", "action": "逼近感：從暴龍背後看出去，HERO 已在一口之內，用縮短的間距把『越追越近』視覺化。", "remedy": "back34 偶爾會多畫一個 HERO 當前景或畫成純背面、MS 常被畫成膝上：只要維持『暴龍在前景、HERO 在前方近距離』的逼近關係都可接受，必要時剪輯推近。", "imgs": [{"src": "img/EP1-01_v2_claude_06_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/03683e29-0f5b-4d80-932e-0408d2e40183"}, {"src": "img/EP1-01_v2_claude_06_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/881c5379-d720-46f3-bb3e-c39e22554c6b"}]}, {"id": "EP1-01-07", "t": 7, "narration": ["你一定很想問：", "我到底是怎麼跑到這裡來的？", "這件事呢，要從今天早上開始說起。"], "subject": "HERO 躍過樹根的定格瞬間；TEEN 大嘴在後", "shot_size": "WS", "azimuth": "side", "angle": "eye", "composition": "正側面。畫面右邊 HERO 在躍過大樹根的最高點定格（四肢收起、張嘴尖叫）；畫面左、緊貼其後是 TEEN 張到最大的嘴咬向他腳跟。兩角色完整入鏡，夕陽從畫左逆光鑲邊。此為幕 11 原樣重現的關鍵錨點。", "screen_direction": "right", "action": "定格＋懸念＋轉場錨點：最戲劇性的一瞬凍結，旁白丟出『我到底怎麼跑到這裡來的』，接著轉去今天早上。角色姿勢、相機位置、樹根位置、遮擋與光向都要穩定好重現。", "remedy": "WS 常被畫成 FS，可接受兩角色全身入鏡；務必確認 HERO 騰空、樹根在下、TEEN 大嘴緊貼其後都在框內，作為幕 11 的重現基準。", "imgs": [{"src": "img/EP1-01_v2_claude_07_1.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/0ed41669-954b-46d8-92b5-e68019f53c14"}, {"src": "img/EP1-01_v2_claude_07_2.jpg", "url": "https://flow.google.com/u/4/project/e7138fa4-a843-4e8f-ab49-a62ab7ea712e/edit/2c4c7d3c-de99-40f1-9545-5c064ad6da4d"}]}]}}}];
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const sel=document.getElementById('sc'),out=document.getElementById('out');
sel.innerHTML=S.map((s,i)=>`<option value="${i}">${s.id}</option>`).join('');
const K=[['codex','cx'],['claude','cl']];
function render(){const s=S[+sel.value];
  const who=K.filter(([k])=>s.who[k]);
  const owner=(k,line)=>(s.who[k].shots.filter(x=>(x.narration||[]).includes(line)).map(x=>`<span class="sid ${K.find(z=>z[0]===k)[1]}">${esc(x.id.slice(-2))}</span>`).join(' ')||'—');
  const map=`<div class="card"><h2>旁白分配</h2><p class="sub">每句旁白配在哪一張。</p><div class="tbl" style="margin-top:6px"><table><tr><th></th><th>旁白</th>${who.map(([k])=>`<th>${esc(s.who[k].name)}</th>`).join('')}</tr>
    ${s.narration.map((l,i)=>`<tr><td class=n>${i+1}</td><td>${esc(l)}</td>${who.map(([k])=>`<td>${owner(k,l)}</td>`).join('')}</tr>`).join('')}</table></div></div>`;
  const col=([k,c])=>{const w=s.who[k];return `<div class="col ${c}"><h2>${esc(w.name)}：${w.shots.length} 張</h2><p class="notes">${esc(w.notes)}</p>
    ${w.shots.map(x=>`<div class="card shot"><div class="bar"><span class="sid">${esc(x.id)}</span><div class="chips"><span class=chip>${esc(x.shot_size)}</span><span class=chip>${esc(x.azimuth)}</span><span class=chip>${esc(x.angle)}</span><span class=chip>${esc(x.screen_direction)}</span></div></div>
      <div class="imgs">${x.imgs.length?x.imgs.map(m=>`<div><img src="${esc(m.src)}" alt="${esc(x.id)}" loading="lazy"><a href="${esc(m.url)}" style="font-size:12px">Flow</a></div>`).join(''):'<div class="miss">還沒畫</div>'}</div>
      ${(x.narration||[]).map(n=>`<div class="nar">${esc(n)}</div>`).join('')}
      <dl><dt>主體</dt><dd>${esc(x.subject)}</dd><dt>構圖</dt><dd>${esc(x.composition)}</dd><dt>動作</dt><dd>${esc(x.action)}</dd><dt>補救</dt><dd>${esc(x.remedy)}</dd></dl></div>`).join('')}</div>`};
  out.innerHTML=map+`<div class="cols">${who.map(col).join('')}</div>`;
  out.querySelectorAll('.imgs img').forEach(im=>im.onclick=()=>{const z=document.createElement('div');z.className='zoom';z.innerHTML=`<img src="${im.src}" alt="">`;z.onclick=()=>z.remove();document.body.appendChild(z)});
}
sel.onchange=render;render();
</script>

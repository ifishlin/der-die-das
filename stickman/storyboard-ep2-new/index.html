<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="claude:viewport-fit-sides" content="cover"><meta name="robots" content="noindex"><title>EP2-new 小行星撞地球 分鏡表</title><style>
:root{--bg:#f3f1ec;--panel:#fffdf9;--fg:#22201b;--mut:#6c665b;--line:#e0dace;--acc:#1f6b52;--sci:#e3f2e6;--sci-b:#3d8a55;--todo:#f6efe0;--chg:#fff1c9;--warn:#a0442c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181816;--panel:#22211e;--fg:#ebe7de;--mut:#a29b8e;--line:#3a3730;--acc:#6cc7a3;--sci:#1f3326;--sci-b:#6cc78a;--todo:#2e2a20;--chg:#3d3418;--warn:#e08a70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181816;--panel:#22211e;--fg:#ebe7de;--mut:#a29b8e;--line:#3a3730;--acc:#6cc7a3;--sci:#1f3326;--sci-b:#6cc78a;--todo:#2e2a20;--chg:#3d3418;--warn:#e08a70;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:1180px;margin:0 auto;padding-block:16px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
a{color:var(--acc)}h1{font-size:25px;margin:0;text-wrap:balance}h2{font-size:18px;margin:0 0 8px}h3{font-size:16px;margin:0 0 6px}
.sub,.mut{color:var(--mut)}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:0}
.step{font-size:12px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:middle}
.todo{background:var(--todo);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;color:var(--mut);margin:0}
.segnav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px}.sgs{display:flex;gap:6px;flex-wrap:wrap}
.sg{border:1px solid var(--line);border-radius:6px;padding:2px 10px;text-decoration:none;background:var(--panel)}.sg.on{background:var(--acc);color:var(--panel);border-color:var(--acc)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;white-space:nowrap}
.nums{display:flex;flex-wrap:wrap;gap:10px}.num{background:var(--bg);border-radius:8px;padding:6px 14px}.num b{font-size:20px;display:block}
.sci{background:var(--sci);border-left:3px solid var(--sci-b);padding-left:6px}.fx{font-size:12px;color:var(--sci-b);font-weight:700;margin-left:4px}
details summary{cursor:pointer;color:var(--mut);font-size:13.5px}

.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:12px}
.shot{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);min-width:0}
.imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:6px 0}.tk{margin:0;min-width:0}.tk img{width:100%;height:auto;display:block;border-radius:5px;border:3px solid transparent}
.tk.sel img{border-color:var(--acc)}.tk figcaption{font-size:12px;color:var(--mut)}
.tk.empty div{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:5px;color:var(--mut);font-size:13px;text-align:center}
.nar{background:var(--todo);border-radius:6px;padding:4px 10px;margin:4px 0}.kv{font-size:14px;margin:3px 0}
.pz{background:var(--sci);border-radius:6px;padding:6px 10px;margin:6px 0;font-size:14px}.en{font-size:13px;color:var(--mut)}
.cov{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--mut)}
.ok{color:var(--acc);font-weight:600;margin:0 0 6px}.bad{color:var(--warn);font-weight:700;margin:0}
.map{max-width:min(100%,800px);border:1px solid var(--line);border-radius:6px;display:block;margin:6px 0}
code{font-size:12.5px}.shot .todo{padding:4px 10px;font-size:13px;margin:4px 0}
textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);min-height:2.4em;margin-top:6px}
.bar{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:5px;padding:2px 10px;cursor:pointer}.sg.off{color:var(--mut);opacity:.55}</style></head><body><main><nav class="segnav"><a href="../story/ep2-new/">← EP2-new 小行星撞地球</a><span class="sgs"><a class="sg" href="../science-ep2-new/">A 科普</a><a class="sg" href="../script-ep2-new/">B 劇本</a><a class="sg" href="../breakdown-ep2-new/">C 分場表</a><a class="sg on" href="../storyboard-ep2-new/">D 分鏡表</a><span class="sg off">E 粗剪檢視</span><span class="sg off">F 音效表</span></span></nav><header><h1>EP2-new 小行星撞地球：分鏡表</h1><p class=sub>D 分鏡（第 13～17 步）：分鏡模型拆鏡頭 → 檢查 → 補背景和參考圖 → Flow 畫圖 → 挑選用條、下載、配音、壓粗剪。畫圖之前這份報告就有內容（只是缺圖），可以先看；流程只在粗剪停下來。</p></header><section class=card><h2>粗剪<span class=step>第 17 步</span></h2><p class="todo">第 17 步還沒做</p></section><section class=card><h2>摘要<span class=step>第 13～17 步</span></h2><div class=nums><div class=num><b>—</b>場</div><div class=num><b>0</b>鏡頭</div><div class=num><b>0</b>遠景備份</div><div class=num><b>第 14 步還沒做</b>檢查通過</div><div class=num><b>0／0</b>已畫</div><div class=num><b>0／0</b>已挑選用條</div></div><p class=mut></p></section><section class=card><p class="todo">第 10 步還沒做</p></section><div class=bar><button id=copy>複製我的意見</button><span class=mut>每個鏡頭寫完意見，按這裡複製，貼回對話（這就是第 18 步改版的入口）。</span><textarea id=out hidden readonly></textarea></div></main><script>const K="sb-ep2-new";let st={};try{st=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
document.querySelectorAll("textarea[data-s]").forEach(t=>{t.value=st[t.dataset.s]||"";t.oninput=()=>{st[t.dataset.s]=t.value;try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}});
document.getElementById("copy").onclick=()=>{const L=Object.entries(st).filter(([s,v])=>v).map(([s,v])=>s+"："+v);const t=L.join("\n")||"（沒有意見）";
const o=document.getElementById("out");o.value=t;o.hidden=false;o.select();navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{})};</script></body></html>

<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>繪本 · Der Die Das 小卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#EEF1F4; --paper:#FFFFFF; --ink:#1C2430; --muted:#5B6675; --line:#D5DBE2;
  --der:#2A66B0; --die:#C9403A; --das:#2F8A4C;
  --good:#2F8A4C; --good-soft:#E2F3E7; --warn:#A8660B; --warn-soft:#FBF0DC; --bad:#C9403A; --bad-soft:#FBE7E5;
  --shadow:0 1px 2px rgba(28,36,48,.08),0 4px 14px rgba(28,36,48,.06);
  --display:"Baloo 2","Nunito",ui-rounded,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --body:"Nunito","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141922; --paper:#1D2430; --ink:#E9EDF2; --muted:#9AA5B4; --line:#2E3847;
    --der:#6FA6EC; --die:#F07D75; --das:#6CC58A;
    --good:#6CC58A; --good-soft:#1B3325; --warn:#E6B45A; --warn-soft:#3A2E17; --bad:#F07D75; --bad-soft:#3A2023;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141922; --paper:#1D2430; --ink:#E9EDF2; --muted:#9AA5B4; --line:#2E3847;
  --der:#6FA6EC; --die:#F07D75; --das:#6CC58A;
  --good:#6CC58A; --good-soft:#1B3325; --warn:#E6B45A; --warn-soft:#3A2E17; --bad:#F07D75; --bad-soft:#3A2023;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs a{font:700 16px/1 var(--body);color:var(--muted);text-decoration:none;padding:12px 18px;border-radius:10px 10px 0 0;margin-bottom:-2px;border:2px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--paper);border-color:var(--line);border-bottom-color:var(--paper)}
.tabs a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

header{display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,2.8rem);line-height:1;margin:0}
.lede{margin:0;color:var(--muted);max-width:62ch}

.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 15px/1 var(--body);border:2px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn{font:700 16px/1.2 var(--body);border:2px solid var(--line);background:var(--paper);color:var(--ink);padding:12px 16px;border-radius:12px;cursor:pointer}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.chip:focus-visible,.btn:focus-visible,.mic:focus-visible,.letter:focus-visible,.swap:focus-visible,.w:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* table */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cell{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.cellhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.letter{appearance:none;border:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;padding:8px 18px;border-radius:12px;cursor:pointer}
.letter:active{transform:scale(.97)}
.swap{appearance:none;border:2px solid var(--line);background:var(--paper);color:var(--muted);font:700 14px/1 var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.swap:disabled{opacity:.35;cursor:default}
.words{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.w{appearance:none;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--body);color:var(--ink);min-width:0}
.w img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:8px;display:block}
.w .t{font-weight:800;font-size:.82rem;line-height:1.15;text-align:center;overflow-wrap:break-word;hyphens:auto;min-width:0;max-width:100%}
.w .t i{font-style:normal;margin-right:.2em}
.w.der .t i{color:var(--der)} .w.die .t i{color:var(--die)} .w.das .t i{color:var(--das)}
.w.on{border-color:var(--ink)}
.few{color:var(--muted);font-size:.85rem}
.cell.sel{outline:3px solid var(--ink)}
.big.letter{background:none}
.letter.on,.big.letter.on{background:var(--ink);color:var(--bg)}
.w.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink)}

/* practice */
.stage{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:560px;margin:0 auto;width:100%}
.big{font-family:var(--display);font-weight:800;font-size:clamp(6rem,30vw,10rem);line-height:1}
.ask{color:var(--muted);font-weight:700}
.hint{width:100%}
.mic{appearance:none;border:0;cursor:pointer;width:96px;height:96px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.mic svg{width:40px;height:40px}
.mic.listening{background:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
.mic:disabled{opacity:.35;cursor:default;animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,64,58,.45)}50%{box-shadow:0 0 0 16px rgba(201,64,58,0)}}
.status{color:var(--muted);font-weight:700;min-height:1.5em}
.result{border-radius:14px;padding:12px 16px;width:100%}
.result.good{background:var(--good-soft);color:var(--good)}
.result.bad{background:var(--bad-soft);color:var(--bad)}
.result b{font-family:var(--display);font-size:1.3rem;display:block}
.result span{color:var(--ink);opacity:.8}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.score{font-weight:700;color:var(--muted)} .score b{color:var(--ink)}
.unsupported{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-weight:700}
.note{color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:6px}.note p{margin:0}
@media (prefers-reduced-motion: reduce){.mic.listening{animation:none}}

.day{font-family:var(--display);font-weight:800;font-size:1.3rem}
.lesson{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;border-left:10px solid var(--line)}
.lesson.red{border-left-color:#D93C37}.lesson.blue{border-left-color:#3A3AD9}.lesson.green{border-left-color:#33C233}.lesson.white{border-left-color:#B7C0CC}
.lh{padding:16px 18px 6px;display:flex;gap:12px;align-items:flex-start}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);font:800 17px/34px var(--display);text-align:center}
.lh h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.2}
.lh .zh{color:var(--muted);font-weight:700}
.orig{margin:6px 18px 0;padding:10px 14px;border-radius:12px;background:var(--bg);display:flex;gap:10px;align-items:flex-start}
.orig .tx{flex:1}.orig .de{font-weight:700}.orig .lab{font-size:.8rem;color:var(--muted);font-weight:700}
.sec{padding:14px 18px 0;font-weight:800;color:var(--muted);font-size:.85rem;letter-spacing:.04em}
.line{display:flex;gap:10px;align-items:flex-start;padding:8px 18px}
.line.on,.orig.on{background:var(--warn-soft)}
.play{flex:none;appearance:none;border:2px solid var(--line);background:var(--paper);color:var(--ink);width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.play svg{width:18px;height:18px}
.play:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.line .de{font-weight:700;font-size:1.05rem}
.zhline{color:var(--muted)}
body.nozh .zhline,body.nozh .wzh,body.nozh .zh,body.nozh .lab.zh2{display:none}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:8px 18px 18px}
.word{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.word .wde{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.2}
.word .ipa{font-family:"Noto Sans","Segoe UI","Lucida Sans Unicode",system-ui,sans-serif;color:var(--muted)}
.word .wzh{font-size:.95rem}.word .nt{font-size:.8rem;color:var(--muted)}
.gram{margin:6px 0 0;padding:8px 12px 8px 26px;background:var(--bg);border-radius:10px;font-size:.9rem;color:var(--ink)}
.gram li{margin:2px 0}
body.nogram .gram{display:none}
.word.on{border-color:var(--ink)}
.art-der{color:var(--der)}.art-die{color:var(--die)}.art-das{color:var(--das)}

.strip{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
.strip a{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink);font:700 12px/1 var(--body);padding:3px;border:2px solid var(--line);border-radius:8px;background:var(--paper)}
.strip a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.strip img{width:72px;height:54px;border-radius:4px;display:block;background:#ddd}
.sp img.ic{width:160px;height:120px;object-fit:cover;border-radius:6px;display:block;background:#ddd;flex:none;border-radius:4px;display:block;background:#ddd;image-rendering:auto}
.sp{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:84px}
.shot{display:block;background:#ddd}
.shot img{display:block;width:100%;height:auto}
.sh{display:flex;gap:12px;align-items:center;padding:14px 18px 4px}
.sh h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.2}
.sh .no{color:var(--muted);font-weight:700}
.sp .sec.main{color:var(--ink)}
body.noside .sidebox{display:none}
.card{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:14px 18px;display:flex;gap:14px;align-items:flex-start}
.card h3{margin:0 0 4px;font-family:var(--display)}
.arc{display:flex;flex-wrap:wrap;gap:8px}
</style>

  <div class="note">
    <p>「書上原文」是書頁上印的故事文字（照片上的小標籤、對話泡泡沒有收）。「故事主線」是這一頁的主要情節；「旁枝」是畫面上的小細節和小標籤，這兩部分是用簡單德文重新寫的導讀。</p>
    <p>標「合成」或「估計」的音標不是字典上直接查到的，念法大致正確。</p>

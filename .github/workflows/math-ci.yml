# Runs the math site's tests and build check when its source changes.
# It does not deploy: GitHub Pages serves this repo from the main branch, and the built
# files in math/ are committed. Switching Pages to Actions would replace the whole site.
name: math-ci

on:
  push:
    branches: [main]
    paths: ['math-src/**', '.github/workflows/math-ci.yml']
  pull_request:
    paths: ['math-src/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: math-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: math-src/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build -- --outDir dist

<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Der Die Das 小卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#EEF1F4; --paper:#FFFFFF; --ink:#1C2430; --muted:#5B6675; --line:#D5DBE2;
  --der:#2A66B0; --der-soft:#E3EDF9;
  --die:#C9403A; --die-soft:#FBE7E5;
  --das:#2F8A4C; --das-soft:#E2F3E7;
  --shadow:0 1px 2px rgba(28,36,48,.08),0 4px 14px rgba(28,36,48,.06);
  --display:"Baloo 2","Nunito",ui-rounded,"PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --body:"Nunito","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#141922; --paper:#1D2430; --ink:#E9EDF2; --muted:#9AA5B4; --line:#2E3847;
    --der:#6FA6EC; --der-soft:#1C2C44;
    --die:#F07D75; --die-soft:#3A2023;
    --das:#6CC58A; --das-soft:#1B3325;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141922; --paper:#1D2430; --ink:#E9EDF2; --muted:#9AA5B4; --line:#2E3847;
  --der:#6FA6EC; --der-soft:#1C2C44;
  --die:#F07D75; --die-soft:#3A2023;
  --das:#6CC58A; --das-soft:#1B3325;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:flex;flex-direction:column;gap:28px}

header{display:flex;flex-direction:column;gap:10px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,7vw,3.6rem);line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 .der{color:var(--der)} h1 .die{color:var(--die)} h1 .das{color:var(--das)}
.lede{margin:0;color:var(--muted);max-width:60ch}

.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 15px/1 var(--body);border:2px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer}
.chip:disabled{opacity:.4;cursor:default}
.chip:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.der[aria-pressed="true"]{background:var(--der);border-color:var(--der);color:#fff}
.chip.die[aria-pressed="true"]{background:var(--die);border-color:var(--die);color:#fff}
.chip.das[aria-pressed="true"]{background:var(--das);border-color:var(--das);color:#fff}
.chip .n{font-weight:600;opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;user-select:none}
.toggle input{width:20px;height:20px;accent-color:var(--ink)}

section{display:flex;flex-direction:column;gap:14px}
section[hidden]{display:none}
.sec-head{display:flex;align-items:baseline;gap:12px}
.sec-head h2{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;margin:0}
.sec-head .hint{color:var(--muted);font-size:.95rem}
section.der h2{color:var(--der)} section.die h2{color:var(--die)} section.das h2{color:var(--das)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{--c:var(--der);--soft:var(--der-soft);appearance:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;
  background:var(--paper);border-radius:14px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;overflow:hidden;
  outline:3px solid transparent;outline-offset:2px;transition:transform .12s ease,outline-color .12s ease}
.card.die{--c:var(--die);--soft:var(--die-soft)} .card.das{--c:var(--das);--soft:var(--das-soft)}
.card:hover{transform:translateY(-2px)}
.card:focus-visible{outline-color:var(--ink)}
.card.playing{outline-color:var(--c)}
.pic{aspect-ratio:4/3;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:4px solid var(--c)}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.label{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-height:78px}
.word{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.15;overflow-wrap:anywhere}
.word .art{color:var(--c);margin-right:.25em}
.zh{color:var(--muted);font-size:.9rem}
.tag{align-self:flex-start;margin-top:4px;font-size:.75rem;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--c)}
.tag.guess{background:transparent;color:var(--muted);border:1px dashed var(--line)}

/* practice mode: hide article until the card is played */
.quiz .card:not(.revealed) .art{color:transparent;background:var(--line);border-radius:6px;padding-inline:.15em}
.quiz .card:not(.revealed) .pic{border-bottom-color:var(--line)}
.quiz .card:not(.revealed) .tag{visibility:hidden}

footer{color:var(--muted);font-size:.9rem;max-width:70ch;display:flex;flex-direction:column;gap:6px}
footer p{margin:0}
footer a{color:inherit}
footer summary{cursor:pointer;font-weight:700}
footer ul{margin:8px 0 0;padding-left:1.2em;columns:2 16em;column-gap:24px}
[hidden]{display:none!important}
.chip.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

@media (prefers-reduced-motion: reduce){.card{transition:none}.card:hover{transform:none}}
@media (max-width:440px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.word{font-size:1.05rem}}
</style>

<div class="wrap">
  <header>
    <h1><span class="der">der</span> <span class="die">die</span> <span class="das">das</span></h1>
    <p class="lede">點一下卡片，就會唸出冠詞和單字。打開「練習模式」會先把冠詞藏起來，猜猜看再點開聽答案。</p>
  </header>

  <div class="controls">
    <div class="chips" role="group" aria-label="篩選冠詞">
      <button class="chip" id="f-all" data-f="all" aria-pressed="true">全部<span class="n"></span></button>
      <button class="chip der" id="f-der" data-f="der" aria-pressed="false">der<span class="n"></span></button>
      <button class="chip die" id="f-die" data-f="die" aria-pressed="false">die<span class="n"></span></button>
      <button class="chip das" id="f-das" data-f="das" aria-pressed="false">das<span class="n"></span></button>
    </div>
    <div class="chips" role="group" aria-label="篩選類別">
      <button class="chip cat" id="c-all" data-c="all" aria-pressed="true">所有類別</button>
      <button class="chip cat" id="c-school" data-c="school" aria-pressed="false">文具<span class="n"></span></button>
      <button class="chip cat" id="c-wear" data-c="wear" aria-pressed="false">衣物用品<span class="n"></span></button>
      <button class="chip cat" id="c-animal" data-c="animal" aria-pressed="false">動物<span class="n"></span></button>
    </div>
    <label class="toggle"><input type="checkbox" id="quiz"> 練習模式（隱藏冠詞）</label>
  </div>

  <main id="main"></main>

  <footer>
    <p>顏色照德國小學的習慣：der 藍、die 紅、das 綠。</p>
    <p>「原本在 das 堆」或「原本在 die 堆」表示這張卡原本放錯堆，這裡已經放到正確的冠詞下。「名稱待確認」表示單字是依圖片判斷的，教材可能用別的字。</p>
    <p>發音是 Microsoft 神經網路德語語音 Katja 錄製的。</p>
    <details id="credits"><summary>照片出處（Pexels、Wikimedia Commons）</summary><ul></ul></details>
  </footer>
</div>

Ziege","zh":"山羊","note":"","cat":"animal"},{"id":"block","art":"der","noun":"Block","zh":"便條本","note":"photo","cat":"school","by":"Cup of  Couple","lic":"Pexels","page":"https://www.pexels.com/photo/a-pencil-near-crumpled-paper-6963114/"},{"id":"zeichenblock","art":"der","noun":"Zeichenblock","zh":"圖畫紙本","note":"photo","cat":"school","by":"DS stories","lic":"Pexels","page":"https://www.pexels.com/photo/pencil-near-a-notepad-8099385/"},{"id":"schnellhefter","art":"der","noun":"Schnellhefter","zh":"快速資料夾","note":"photo","cat":"school","by":"Rico Heil (silmaril)","lic":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Schnellhefter_Kunststoff.jpg"},{"id":"postmappe","art":"die","noun":"Postmappe","zh":"聯絡夾","note":"photo","cat":"school","by":"https://kaboompics.com/","lic":"Pexels","page":"https://www.pexels.com/photo/a-cardboard-folder-on-a-white-surface-8947698/"},{"id":"zeichenmappe","art":"die","noun":"Zeichenmappe","zh":"大畫夾","note":"photo","cat":"school","by":"Felicity Tai","lic":"Pexels","page":"https://www.pexels.com/photo/crop-female-artist-with-art-bag-7951222/"},{"id":"fluessigkleber","art":"der","noun":"Flüssigkleber","zh":"液體膠水","note":"photo","cat":"school","by":"Justus Blümer from Deutschland","lic":"CC BY 2.0","page":"https://commons.wikimedia.org/wiki/File:UHU_Alleskleber_(6904159900).jpg"},{"id":"knete","art":"die","noun":"Knete","zh":"黏土","note":"photo","cat":"school","by":"Pavel Danilyuk","lic":"Pexels","page":"https://www.pexels.com/photo/children-playing-with-clay-8422174/"},{"id":"wachsmalstift","art":"der","noun":"Wachsmalstift","zh":"蠟筆","note":"photo","cat":"school","by":"Miesha Renae Maiden","lic":"Pexels","page":"https://www.pexels.com/photo/crayon-lot-284082/"},{"id":"wasserfarbe","art":"die","noun":"Wasserfarbe","zh":"水彩","note":"photo","cat":"school","by":"Michal Klajban","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Watercolors_with_a_brush.jpg"},{"id":"wasserbehaelter","art":"der","noun":"Wasserbehälter","zh":"洗筆筒","note":"photo","cat":"school","by":"Anastasia  Shuraeva","lic":"Pexels","page":"https://www.pexels.com/photo/a-person-holding-a-paint-brush-in-a-container-6966320/"},{"id":"pinsel","art":"der","noun":"Pinsel","zh":"畫筆","note":"photo","cat":"school","by":"Ravi Kant","lic":"Pexels","page":"https://www.pexels.com/photo/assorted-paintbrushes-2303796/"},{"id":"turnbeutel","art":"der","noun":"Turnbeutel","zh":"運動袋","note":"photo","cat":"wear","by":"ready made","lic":"Pexels","page":"https://www.pexels.com/photo/white-textile-on-white-surface-3850539/"},{"id":"turnhose","art":"die","noun":"Turnhose","zh":"運動褲","note":"photo","cat":"wear","by":"Engin Akyurt","lic":"Pexels","page":"https://www.pexels.com/photo/casual-black-shorts-fashion-photography-39457524/"},{"id":"tshirt","art":"das","noun":"T-Shirt","zh":"T 恤","note":"photo","cat":"wear","by":"Mr. Mockup","lic":"Pexels","page":"https://www.pexels.com/photo/a-blank-white-shirt-12025472/"},{"id":"turnschuh","art":"der","noun":"Turnschuh","zh":"運動鞋","note":"photo","cat":"wear","by":"Ray Piedra","lic":"Pexels","page":"https://www.pexels.com/photo/sneakers-with-dense-surface-against-gray-background-1456733/"},{"id":"trinkflasche","art":"die","noun":"Trinkflasche","zh":"水壺","note":"photo","cat":"wear","by":"Valentin Ivantsov","lic":"Pexels","page":"https://www.pexels.com/photo/minimalist-black-water-bottle-on-yellow-background-38718303/"},{"id":"brotdose","art":"die","noun":"Brotdose","zh":"便當盒","note":"photo","cat":"wear","by":"Vanessa Loring","lic":"Pexels","page":"https://www.pexels.com/photo/breads-and-fruits-on-green-lunch-box-5971972/"},{"id":"rucksack","art":"der","noun":"Rucksack","zh":"背包","note":"photo","cat":"wear","by":"WrS.tm.pl","lic":"CC0","page":"https://commons.wikimedia.org/wiki/File:Plecak_Hiker_50_L_HiMountain.jpg"},{"id":"jacke","art":"die","noun":"Jacke","zh":"外套","note":"photo","cat":"wear","by":"Tima Miroshnichenko","lic":"Pexels","page":"https://www.pexels.com/photo/a-woman-in-red-jacket-and-blue-knit-cap-holding-a-camera-7009504/"},{"id":"muetze","art":"die","noun":"Mütze","zh":"毛帽","note":"photo","cat":"wear","by":"Wikimedia Commons2 Bot assumed (based on copyri","lic":"Public domain","page":"https://commons.wikimedia.org/wiki/File:Entrelac-hat.jpg"},{"id":"schal","art":"der","noun":"Schal","zh":"圍巾","note":"photo","cat":"wear","by":"https://www.kaschmirprodukte.de","lic":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:100%25_Kaschmir_Wolle_vonk_kaschmirprodukte.de.jpg"},{"id":"handschuh","art":"der","noun":"Handschuh","zh":"手套","note":"photo","cat":"wear","by":"Darya Grey_Owl","lic":"Pexels","page":"https://www.pexels.com/photo/warm-blue-mittens-lying-on-snow-19759500/"},{"id":"hausschuh","art":"der","noun":"Hausschuh","zh":"室內拖鞋","note":"photo","cat":"wear","by":"PiccoloNamek at English Wikipedia","lic":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Slippers.jpg"},{"id":"regenschirm","art":"der","noun":"Regenschirm","zh":"雨傘","note":"photo","cat":"wear","by":"MONNIN Jacques","lic":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:M0354_000727-005_1.jpg"},{"id":"schultuete","art":"die","noun":"Schultüte","zh":"入學糖果筒","note":"photo","cat":"school","by":"Farah Eliane","lic":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Schultuete.jpg"}];

const HINT = {der:'陽性', die:'陰性', das:'中性'};
const main = document.getElementById('main');

for (const art of ['der','die','das']) {
  const list = CARDS.filter(c => c.art === art);
  const sec = document.createElement('section');
  sec.className = art; sec.dataset.art = art;
  sec.innerHTML = `<div class="sec-head"><h2>${art}</h2><span class="hint">${HINT[art]} · <span class="cnt">${list.length}</span> 張</span></div><div class="grid"></div>`;
  const grid = sec.querySelector('.grid');
  for (const c of list) {
    const b = document.createElement('button');
    b.className = 'card ' + art; b.id = 'card-' + c.id; b.dataset.id = c.id; b.dataset.cat = c.cat;
    b.setAttribute('aria-label', `${c.art} ${c.noun}，${c.zh}，點一下聽發音`);
    const tag = c.note === 'moved' ? `<span class="tag">原本在 ${c.from || 'das'} 堆</span>`
              : c.note === 'guess' ? '<span class="tag guess">名稱待確認</span>' : '';
    b.innerHTML = `<div class="pic"><img src="img/${c.id}.jpg" alt="" loading="lazy"></div>
      <div class="label"><span class="word"><span class="art">${c.art}</span>${c.noun}</span><span class="zh">${c.zh}</span>${tag}</div>`;
    b.addEventListener('click', () => play(b, c));
    grid.appendChild(b);
  }
  main.appendChild(sec);
}

// counts on filter chips
document.querySelector('#f-all .n').textContent = CARDS.length;
for (const a of ['der','die','das']) document.querySelector(`#f-${a} .n`).textContent = CARDS.filter(c => c.art === a).length;
for (const k of ['school','wear','animal']) document.querySelector(`#c-${k} .n`).textContent = CARDS.filter(c => c.cat === k).length;

// photo credits
const credits = document.querySelector('#credits ul');
for (const c of CARDS.filter(c => c.page)) {
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.href = c.page; a.textContent = c.by; a.target = '_blank'; a.rel = 'noopener';
  li.append(`${c.art} ${c.noun}：`, a, `（${c.lic}）`);
  credits.appendChild(li);
}

let current = null;
function speakFallback(text) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = 'de-DE'; u.rate = .85;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function play(btn, c) {
  if (current) { current.audio.pause(); current.btn.classList.remove('playing'); }
  const audio = new Audio(`audio/${c.id}.mp3`);
  current = {audio, btn};
  btn.classList.add('playing', 'revealed');
  audio.addEventListener('ended', () => btn.classList.remove('playing'));
  audio.play().catch(() => { speakFallback(`${c.art} ${c.noun}`); setTimeout(() => btn.classList.remove('playing'), 1200); });
}

// filters and practice mode share one state; render() applies it
const state = {art: 'all', cat: 'all'};
const artChips = [...document.querySelectorAll('.chip[data-f]')];
const catChips = [...document.querySelectorAll('.chip[data-c]')];
const quiz = document.getElementById('quiz');
// practice mode: cards shuffled into one mixed grid so the section heading can't give the answer away
const mix = document.createElement('section');
mix.hidden = true;
mix.innerHTML = '<div class="sec-head"><h2>猜猜看</h2><span class="hint">是 der、die 還是 das？點卡片聽答案</span></div><div class="grid"></div>';
main.appendChild(mix);
const allCards = [...document.querySelectorAll('.card')];
const home = new Map(allCards.map(b => [b, b.parentElement]));

function render(reshuffle) {
  const on = quiz.checked;
  document.body.classList.toggle('quiz', on);
  artChips.forEach(ch => { ch.disabled = on; ch.setAttribute('aria-pressed', String(ch.dataset.f === state.art)); });
  catChips.forEach(ch => ch.setAttribute('aria-pressed', String(ch.dataset.c === state.cat)));
  allCards.forEach(b => b.hidden = state.cat !== 'all' && b.dataset.cat !== state.cat);
  if (on && reshuffle) {
    allCards.forEach(b => b.classList.remove('revealed'));
    allCards.slice().sort(() => Math.random() - .5).forEach(b => mix.querySelector('.grid').appendChild(b));
  }
  if (!on) allCards.forEach(b => home.get(b).appendChild(b));
  mix.hidden = !on;
  document.querySelectorAll('section[data-art]').forEach(s => {
    const shown = s.querySelectorAll('.card:not([hidden])').length;
    s.querySelector('.cnt').textContent = shown;
    s.hidden = on || shown === 0 || (state.art !== 'all' && s.dataset.art !== state.art);
  });
}
artChips.forEach(ch => ch.addEventListener('click', () => { state.art = ch.dataset.f; render(false); }));
catChips.forEach(ch => ch.addEventListener('click', () => { state.cat = ch.dataset.c; render(true); }));
quiz.addEventListener('change', () => { allCards.forEach(b => b.classList.remove('revealed')); render(true); });
</script>
